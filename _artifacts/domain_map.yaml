# domain_map.yaml
# Generated by skill-domain-discovery
# Library: @tailor-platform/sdk
# Version: 1.25.1
# Date: 2026-03-13
# Status: reviewed

library:
  name: "@tailor-platform/sdk"
  version: "1.25.1"
  repository: "https://github.com/tailor-platform/sdk"
  description: >
    TypeScript SDK for declaratively defining and deploying enterprise
    applications on the Tailor Platform — covering database schemas, GraphQL
    resolvers, event-driven executors, workflow orchestration, auth, and
    deployment via CLI.
  primary_framework: "framework-agnostic"

domains:
  - name: "Project scaffolding and configuration"
    slug: "project-config"
    description: >
      Setting up a new project and wiring the top-level application
      configuration including auth, IdP, CORS, plugins, and service globs.

  - name: "Data modeling"
    slug: "data-modeling"
    description: >
      Defining TailorDB types with fields, relations, permissions,
      hooks, validation, and generating TypeScript types from those
      definitions.

  - name: "Server-side logic"
    slug: "server-logic"
    description: >
      Implementing business logic through resolvers (custom GraphQL
      operations), executors (event-driven automation), and workflows
      (multi-step job orchestration).

  - name: "Operations and deployment"
    slug: "operations"
    description: >
      Using the CLI to deploy, manage workspaces, run migrations,
      manage secrets, and operate the deployed application.

skills:
  # ── project-config domain ──────────────────────────────────────────

  - name: "Project setup"
    slug: "project-setup"
    domain: "project-config"
    description: >
      Scaffold a new Tailor Platform project using create-sdk and
      understand the resulting file structure.
    type: "lifecycle"
    packages:
      - "@tailor-platform/sdk"
      - "@tailor-platform/create-sdk"
    covers:
      - "npm create @tailor-platform/sdk"
      - "project directory structure"
      - "tailor.config.ts skeleton"
      - "package.json setup"
    tasks:
      - "Create a new Tailor Platform project from a template"
      - "Understand the generated directory structure"
      - "Configure package.json scripts for build/deploy"
    failure_modes:
      - mistake: "Wrong Node.js version"
        mechanism: >
          SDK requires Node.js 22+. Agents may scaffold with an older
          version because training data contains older Node requirements.
        wrong_pattern: |
          # Using Node 18 or 20
          node --version  # v20.x.x
          npm create @tailor-platform/sdk
        correct_pattern: |
          # Ensure Node.js 22+
          node --version  # v22.14.0 or later
          npm create @tailor-platform/sdk -- --template hello-world my-app
        source: "docs/quickstart.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Missing template flag in create command"
        mechanism: >
          The create command requires --template to select a starter.
          Agents may omit it and get an interactive prompt or error.
        wrong_pattern: |
          npm create @tailor-platform/sdk my-app
        correct_pattern: |
          npm create @tailor-platform/sdk -- --template hello-world my-app
        source: "docs/quickstart.md"
        priority: "MEDIUM"
        status: "active"

      - mistake: "Using npm instead of pnpm for workspace operations"
        mechanism: >
          The monorepo uses pnpm workspaces. Using npm for install or
          scripts will fail or produce incorrect node_modules.
        wrong_pattern: |
          npm install
          npm run deploy
        correct_pattern: |
          pnpm install
          pnpm run deploy
        source: "package.json packageManager field"
        priority: "HIGH"
        status: "active"

  - name: "Configuration"
    slug: "configuration"
    domain: "project-config"
    description: >
      Define the application configuration in tailor.config.ts including
      services, auth, IdP, CORS, plugins, and environment variables.
    type: "core"
    packages:
      - "@tailor-platform/sdk"
    covers:
      - "defineConfig"
      - "defineAuth"
      - "defineIdp"
      - "defineStaticWebSite"
      - "definePlugins"
      - "defineGenerators (deprecated)"
      - "env configuration"
      - "cors configuration"
      - "db/resolver/executor/workflow glob patterns"
      - "External resource references (shared DB across apps)"
    tasks:
      - "Set up defineConfig with all service globs"
      - "Reference external DB namespaces for multi-app DB sharing"
      - "Configure auth with user profiles and machine users"
      - "Set up IdP with authorization rules"
      - "Define static websites and use deployment-time URLs"
      - "Configure plugins for code generation"
      - "Define environment variables accessible in functions"
    failure_modes:
      - mistake: "Using defineGenerators instead of definePlugins"
        mechanism: >
          defineGenerators is deprecated. Agents trained on older docs
          generate the old tuple-based API instead of the plugin API.
        wrong_pattern: |
          import { defineGenerators } from "@tailor-platform/sdk";
          export const generators = defineGenerators(
            ["@tailor-platform/kysely-type", { distPath: "./generated/tailordb.ts" }],
          );
        correct_pattern: |
          import { definePlugins } from "@tailor-platform/sdk";
          import { kyselyTypePlugin } from "@tailor-platform/sdk/plugin/kysely-type";
          export const plugins = definePlugins(
            kyselyTypePlugin({ distPath: "./generated/tailordb.ts" }),
          );
        source: "packages/sdk/src/configure/config.ts — defineGenerators marked deprecated"
        priority: "HIGH"
        status: "active"
        version_context: "defineGenerators still works but is deprecated in favor of definePlugins"

      - mistake: "Providing both userProfile and machineUserAttributes in defineAuth"
        mechanism: >
          defineAuth throws at runtime if both are provided. Only one
          approach is allowed per auth definition.
        wrong_pattern: |
          defineAuth("auth", {
            userProfile: { type: user, usernameField: "email" },
            machineUserAttributes: { role: t.string() },
          });
        correct_pattern: |
          // Use userProfile when you have a user type
          defineAuth("auth", {
            userProfile: { type: user, usernameField: "email", attributes: { role: true } },
            machineUsers: { "admin": { attributes: { role: "ADMIN" } } },
          });
        source: "packages/sdk/src/configure/services/auth/index.ts"
        priority: "CRITICAL"
        status: "active"

      - mistake: "Hardcoding static website URL in CORS"
        mechanism: >
          Static website URLs are resolved at deployment time. Using a
          hardcoded URL instead of website.url breaks CORS in production.
        wrong_pattern: |
          const website = defineStaticWebSite("frontend", {});
          export default defineConfig({
            cors: ["https://my-app.tailor.tech"],
          });
        correct_pattern: |
          const website = defineStaticWebSite("frontend", {});
          export default defineConfig({
            cors: [website.url],
            staticWebsites: [website],
          });
        source: "docs/services/staticwebsite.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Forgetting test file ignore patterns in service globs"
        mechanism: >
          By default, **/*.test.ts and **/*.spec.ts are excluded from
          service globs. If a custom ignore pattern is set, these defaults
          are lost and test files get deployed.
        source: "docs/configuration.md"
        priority: "MEDIUM"
        status: "active"

      - mistake: "Missing usernameField unique constraint"
        mechanism: >
          The field specified as usernameField in auth.userProfile must
          have .unique() on the TailorDB type. Omitting it causes runtime
          auth failures.
        wrong_pattern: |
          const user = db.type("User", {
            email: db.string(),  // Missing .unique()
          });
          defineAuth("auth", {
            userProfile: { type: user, usernameField: "email" },
          });
        correct_pattern: |
          const user = db.type("User", {
            email: db.string().unique(),
          });
          defineAuth("auth", {
            userProfile: { type: user, usernameField: "email" },
          });
        source: "docs/services/auth.md"
        priority: "CRITICAL"
        status: "active"

  # ── data-modeling domain ───────────────────────────────────────────

  - name: "Model definition"
    slug: "model-definition"
    domain: "data-modeling"
    description: >
      Define TailorDB types with db.type(), field types, relations,
      permissions, hooks, validation, indexes, and file fields.
    type: "core"
    packages:
      - "@tailor-platform/sdk"
    covers:
      - "db.type()"
      - "db.string / int / float / bool / uuid / date / datetime / time / enum / object / decimal"
      - "db.fields.timestamps()"
      - ".relation() — n-1, 1-1, keyOnly, self-referencing"
      - ".permission() — record-level CRUD"
      - ".gqlPermission() — GraphQL-level access"
      - ".hooks() — create/update transforms"
      - ".validate() — field and type-level validation"
      - ".indexes() — composite indexes"
      - ".files() — file field attachments"
      - ".features() — aggregation, bulkUpsert, publishEvents"
      - ".serial() — auto-increment fields"
      - ".vector() — vector search"
    tasks:
      - "Define a new TailorDB type with fields and relations"
      - "Set up record-level and GraphQL-level permissions"
      - "Add hooks for computed or auto-populated fields"
      - "Configure validation rules on fields"
      - "Set up file attachment fields"
      - "Create composite indexes"
    reference_candidates:
      - topic: "Field types and modifiers"
        reason: ">10 distinct field types each with multiple modifiers (optional, array, index, unique, etc.)"
      - topic: "Permission condition operators"
        reason: "Multiple operators (=, !=, in, not in, hasAny, not hasAny) with operand types (user, record, newRecord, oldRecord)"
    failure_modes:
      - mistake: "Using record/newRecord/oldRecord operand in gqlPermission"
        mechanism: >
          gqlPermission only supports the {user: field} operand. Using
          {record: field} silently compiles but fails at runtime.
        wrong_pattern: |
          .gqlPermission([{
            conditions: [[{ record: "ownerId" }, "=", { user: "id" }]],
            actions: ["read"],
          }])
        correct_pattern: |
          .gqlPermission([{
            conditions: [[{ user: "role" }, "=", "ADMIN"]],
            actions: ["read"],
          }])
          // Use .permission() for record-level conditions:
          .permission({
            read: [[{ record: "ownerId" }, "=", { user: "id" }]],
          })
        source: "docs/services/tailordb.md, parser tests"
        priority: "CRITICAL"
        status: "active"
        skills: ["model-definition"]

      - mistake: "Applying .index() or .unique() to array fields"
        mechanism: >
          Array fields cannot have index or unique constraints. The SDK
          throws an error at parse time.
        wrong_pattern: |
          tags: db.string({ array: true }).unique(),
        correct_pattern: |
          tags: db.string({ array: true }),
          // Index individual elements via composite index if needed
        source: "packages/sdk/src/configure/services/tailordb/schema.ts"
        priority: "HIGH"
        status: "active"

      - mistake: "Mixing field-level and type-level hooks on same field"
        mechanism: >
          A field cannot have both field-level hooks (via .hooks() on the
          field) and type-level hooks (via .hooks() on the type) targeting
          the same field name. This causes a compile error.
        source: "docs/services/tailordb.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Forgetting default-deny permission model"
        mechanism: >
          All permissions default to deny. Agents may define types without
          any permission, making them inaccessible via API.
        wrong_pattern: |
          export const product = db.type("Product", {
            name: db.string(),
            price: db.int(),
          });
          // No .permission() or .gqlPermission() → all operations denied
        correct_pattern: |
          export const product = db.type("Product", {
            name: db.string(),
            price: db.int(),
          })
            .permission(defaultPermission)
            .gqlPermission(defaultGqlPermission);
        source: "docs/services/tailordb.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "Defining an id field manually"
        mechanism: >
          Every db.type() automatically adds an id: uuid() field. Manually
          defining id causes a duplicate field error.
        wrong_pattern: |
          db.type("User", {
            id: db.uuid(),
            name: db.string(),
          });
        correct_pattern: |
          db.type("User", {
            name: db.string(),
            // id field is auto-generated
          });
        source: "packages/sdk/src/configure/services/tailordb/schema.ts"
        priority: "HIGH"
        status: "active"

      - mistake: "Using .vector() on non-string or array fields"
        mechanism: >
          Vector search is only available on string, non-array fields.
          Applying it elsewhere throws an error.
        source: "packages/sdk/src/configure/services/tailordb/schema.ts"
        priority: "MEDIUM"
        status: "active"

      - mistake: "Using fluent .optional() instead of constructor option"
        mechanism: >
          Agents frequently write db.string().optional() assuming a
          fluent API. The correct API is db.string({ optional: true }).
          Same applies to array: db.string({ array: true }), not
          db.string().array(). This is the most common AI-agent mistake.
        wrong_pattern: |
          db.type("Product", {
            description: db.string().optional(),
            tags: db.string().array(),
          });
        correct_pattern: |
          db.type("Product", {
            description: db.string({ optional: true }),
            tags: db.string({ array: true }),
          });
        source: "maintainer interview"
        priority: "CRITICAL"
        status: "active"

      - mistake: "Async or complex logic in condition/validate/hooks"
        mechanism: >
          condition, validate, and hooks functions are pure synchronous
          functions. They cannot perform async operations, external calls,
          or complex logic. Keep them minimal and handle complex logic
          in the function body instead.
        wrong_pattern: |
          db.type("Order", {
            total: db.int().validate(async (args) => {
              const limit = await fetchLimit(); // Not allowed
              return args.value < limit;
            }),
          });
        correct_pattern: |
          db.type("Order", {
            total: db.int().validate(
              [(args) => args.value > 0, "Total must be positive"],
            ),
          });
        source: "maintainer interview"
        priority: "HIGH"
        status: "active"
        skills: ["model-definition", "executor"]

  - name: "Code generation"
    slug: "code-generation"
    domain: "data-modeling"
    description: >
      Generate TypeScript types and utilities from TailorDB definitions
      using plugins (Kysely types, enum constants, file utils, seed).
    type: "core"
    packages:
      - "@tailor-platform/sdk"
    covers:
      - "kyselyTypePlugin"
      - "enumConstantsPlugin"
      - "fileUtilsPlugin"
      - "seedPlugin"
      - "tailor-sdk generate command"
      - "getDB() function"
      - "Custom plugin API"
    tasks:
      - "Set up Kysely type generation for type-safe DB access"
      - "Generate enum constants for use in application code"
      - "Configure seed data loading"
      - "Run tailor-sdk generate to produce TypeScript files"
    failure_modes:
      - mistake: "Missing @tailor-platform/function-types devDependency"
        mechanism: >
          getDB() from generated Kysely types requires
          @tailor-platform/function-types as a devDependency.
          Without it, TypeScript compilation fails.
        wrong_pattern: |
          // package.json missing @tailor-platform/function-types
          // In workflow:
          import { getDB } from "../generated/tailordb";
          const db = getDB("tailordb"); // Type error
        correct_pattern: |
          // pnpm add -D @tailor-platform/function-types
          import { getDB } from "../generated/tailordb";
          const db = getDB("tailordb"); // Works
        source: "docs/generator/builtin.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Importing getDB before running generate"
        mechanism: >
          The generated file does not exist until tailor-sdk generate is
          run. Agents write code importing from generated/ without
          generating first.
        source: "docs/services/workflow.md"
        priority: "MEDIUM"
        status: "active"

      - mistake: "Wrong namespace name in getDB()"
        mechanism: >
          getDB() takes the TailorDB namespace name as defined in
          defineConfig().db, not the type name. Using wrong name
          returns incorrect types.
        wrong_pattern: |
          // Config: db: { tailordb: { files: [...] } }
          const db = getDB("User"); // Wrong — "User" is a type, not namespace
        correct_pattern: |
          // Config: db: { tailordb: { files: [...] } }
          const db = getDB("tailordb"); // Correct — namespace name
        source: "example/workflows/sample.ts"
        priority: "HIGH"
        status: "active"

      - mistake: "Using unsupported Kysely query features"
        mechanism: >
          Kysely allows writing complex SQL (WITH clauses, CTEs, window
          functions, etc.) but the Tailor Platform backend does not
          support all SQL features. Complex queries compile but fail
          at runtime.
        wrong_pattern: |
          const result = await db
            .with("cte", (qb) => qb.selectFrom("Order").selectAll())
            .selectFrom("cte")
            .selectAll()
            .execute();
        correct_pattern: |
          // Use simple queries — SELECT, INSERT, UPDATE, DELETE
          // with WHERE, JOIN, ORDER BY, LIMIT
          const result = await db
            .selectFrom("Order")
            .selectAll()
            .where("status", "=", "active")
            .execute();
        source: "maintainer interview"
        priority: "HIGH"
        status: "active"
        skills: ["code-generation", "resolver", "workflow"]

  # ── server-logic domain ────────────────────────────────────────────

  - name: "Resolver"
    slug: "resolver"
    domain: "server-logic"
    description: >
      Implement custom GraphQL query and mutation endpoints using
      createResolver with type-safe input/output schemas.
    type: "core"
    packages:
      - "@tailor-platform/sdk"
    covers:
      - "createResolver"
      - "t type builder (input/output schemas)"
      - "operation: query | mutation"
      - "body context (input, user, env)"
      - "Input validation with .validate()"
      - "publishEvents"
      - "Kysely DB access in resolvers"
    tasks:
      - "Create a custom query resolver"
      - "Create a mutation resolver with input validation"
      - "Access user context and environment variables"
      - "Use Kysely for database queries in resolvers"
      - "Trigger a workflow from a resolver"
    failure_modes:
      - mistake: "Not default-exporting the resolver"
        mechanism: >
          Each resolver file must have exactly one default export.
          Named exports are ignored by the SDK loader.
        wrong_pattern: |
          export const myResolver = createResolver({ ... });
        correct_pattern: |
          export default createResolver({ ... });
        source: "docs/services/resolver.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "Using db field types instead of t in resolver schemas"
        mechanism: >
          Resolver input/output use the t type builder, not the db
          builder. db fields have DB-specific methods (relation, hooks)
          that are invalid in resolver context.
        wrong_pattern: |
          import { db } from "@tailor-platform/sdk";
          createResolver({
            input: { name: db.string() },
            output: db.object({ result: db.int() }),
          });
        correct_pattern: |
          import { t } from "@tailor-platform/sdk";
          createResolver({
            input: { name: t.string() },
            output: t.object({ result: t.int() }),
          });
        source: "docs/services/resolver.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Missing authInvoker when triggering workflow from resolver"
        mechanism: >
          Triggering a workflow from a resolver requires authInvoker for
          authentication. Without it, the workflow call fails at runtime.
        wrong_pattern: |
          await workflow.trigger({ orderId: input.orderId });
        correct_pattern: |
          await workflow.trigger(
            { orderId: input.orderId },
            { authInvoker: auth.invoker("admin-machine-user") },
          );
        source: "example/resolvers/triggerWorkflow.ts"
        priority: "HIGH"
        status: "active"
        skills: ["resolver", "workflow"]

  - name: "Executor"
    slug: "executor"
    domain: "server-logic"
    description: >
      Set up event-driven automation using createExecutor with triggers
      for record CRUD, schedules, webhooks, resolver execution, and
      auth/IdP events.
    type: "core"
    packages:
      - "@tailor-platform/sdk"
    covers:
      - "createExecutor"
      - "recordCreatedTrigger / recordUpdatedTrigger / recordDeletedTrigger"
      - "scheduleTrigger (cron)"
      - "incomingWebhookTrigger"
      - "resolverExecutedTrigger"
      - "idpUser*Trigger / authAccessToken*Trigger"
      - "Operation kinds: function, graphql, webhook, workflow"
      - "authInvoker for authenticated operations"
      - "Secret references in webhook headers"
    tasks:
      - "Create an executor triggered by record creation"
      - "Set up a scheduled executor with cron"
      - "Handle incoming webhooks"
      - "React to resolver execution events"
      - "Execute GraphQL operations from an executor"
      - "Reference secrets in webhook headers"
    reference_candidates:
      - topic: "Trigger types and event payloads"
        reason: ">10 distinct trigger types each with unique args shape"
    failure_modes:
      - mistake: "Not default-exporting the executor"
        mechanism: >
          Like resolvers, each executor file must default-export.
          Named exports are ignored.
        wrong_pattern: |
          export const myExecutor = createExecutor({ ... });
        correct_pattern: |
          export default createExecutor({ ... });
        source: "docs/services/executor.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "Using function body that returns a value"
        mechanism: >
          Function operations (kind: "function") must return void or
          Promise<void>. Returning a value is a type error.
        wrong_pattern: |
          operation: {
            kind: "function",
            body: async ({ newRecord }) => {
              return newRecord.id; // Error: must return void
            },
          }
        correct_pattern: |
          operation: {
            kind: "function",
            body: async ({ newRecord }) => {
              console.log(newRecord.id);
              // No return value
            },
          }
        source: "packages/sdk/src/configure/services/executor/operation.ts"
        priority: "MEDIUM"
        status: "active"

      - mistake: "Missing authInvoker in graphql/workflow operations"
        mechanism: >
          GraphQL and workflow operations need authInvoker for
          authentication. Without it, the operation fails silently or
          with a permission error.
        wrong_pattern: |
          operation: {
            kind: "graphql",
            query: gql`mutation { ... }`,
            variables: ({ newRecord }) => ({ id: newRecord.id }),
          }
        correct_pattern: |
          operation: {
            kind: "graphql",
            appName: "my-app",
            query: gql`mutation { ... }`,
            variables: ({ newRecord }) => ({ id: newRecord.id }),
            authInvoker: auth.invoker("admin-machine-user"),
          }
        source: "docs/services/executor.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Accessing result on failed resolverExecutedTrigger"
        mechanism: >
          resolverExecutedTrigger args is a discriminated union on
          success field. Accessing result without checking success
          causes runtime errors.
        wrong_pattern: |
          condition: (args) => args.result.someField > 0,
        correct_pattern: |
          condition: (args) => args.success && args.result.someField > 0,
        source: "packages/sdk/src/configure/services/executor/trigger/event.ts"
        priority: "HIGH"
        status: "active"

  - name: "Workflow"
    slug: "workflow"
    domain: "server-logic"
    description: >
      Orchestrate multi-step business logic using createWorkflow and
      createWorkflowJob with job triggering and retry policies.
    type: "core"
    packages:
      - "@tailor-platform/sdk"
    covers:
      - "createWorkflow"
      - "createWorkflowJob"
      - ".trigger() — inter-job communication"
      - "retryPolicy"
      - "Kysely DB access in jobs"
      - "JSON-serializable input/output constraints"
    tasks:
      - "Create a workflow with multiple jobs"
      - "Trigger jobs from other jobs"
      - "Use Kysely for database access in workflow jobs"
      - "Configure retry policies"
      - "Start workflows via CLI or resolver"
    failure_modes:
      - mistake: "Not default-exporting createWorkflow result"
        mechanism: >
          The createWorkflow() result MUST be default exported. Named
          exports are only for jobs. The SDK loader will not find the
          workflow without a default export.
        wrong_pattern: |
          export const myWorkflow = createWorkflow({
            name: "my-workflow",
            mainJob: processOrder,
          });
        correct_pattern: |
          export default createWorkflow({
            name: "my-workflow",
            mainJob: processOrder,
          });
        source: "docs/services/workflow.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "Not named-exporting workflow jobs"
        mechanism: >
          ALL jobs referenced by the workflow must be named exports from
          the same file, including mainJob. The SDK uses named exports
          to discover and register jobs.
        wrong_pattern: |
          const processOrder = createWorkflowJob({ name: "process-order", body: async () => {} });
          export default createWorkflow({ name: "order-flow", mainJob: processOrder });
        correct_pattern: |
          export const processOrder = createWorkflowJob({ name: "process-order", body: async () => {} });
          export default createWorkflow({ name: "order-flow", mainJob: processOrder });
        source: "docs/services/workflow.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "Duplicate job names across project"
        mechanism: >
          Job names must be globally unique across the entire project,
          not just within a single file. Duplicate names cause deployment
          errors.
        source: "docs/services/workflow.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Using Date in job input"
        mechanism: >
          Job inputs must be JSON-serializable (JsonValue). Date objects
          are not JsonValue. Use ISO string instead.
        wrong_pattern: |
          createWorkflowJob({
            name: "process",
            body: async (input: { deadline: Date }) => { ... },
          });
        correct_pattern: |
          createWorkflowJob({
            name: "process",
            body: async (input: { deadline: string }) => {
              const deadline = new Date(input.deadline);
            },
          });
        source: "packages/sdk/src/configure/services/workflow/job.ts"
        priority: "HIGH"
        status: "active"

      - mistake: "Forgetting to await .trigger()"
        mechanism: >
          .trigger() returns a Promise. Not awaiting it means the
          calling job does not receive the triggered job output. While
          the bundler strips await at build time, omitting it causes
          test failures and TypeScript errors.
        wrong_pattern: |
          const result = otherJob.trigger({ data: "value" });
          // result is Promise, not the actual output
        correct_pattern: |
          const result = await otherJob.trigger({ data: "value" });
          // result is the actual output
        source: "docs/services/workflow.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Using Promise.all for parallel job execution"
        mechanism: >
          On the server, jobs execute sequentially (calling job suspends
          until triggered job completes). Promise.all does not enable
          parallel execution and may cause unexpected behavior.
        wrong_pattern: |
          const [a, b] = await Promise.all([
            jobA.trigger(input),
            jobB.trigger(input),
          ]);
        correct_pattern: |
          const a = await jobA.trigger(input);
          const b = await jobB.trigger(input);
        source: "docs/services/workflow.md"
        priority: "HIGH"
        status: "active"

  # ── operations domain ──────────────────────────────────────────────

  - name: "CLI operations"
    slug: "cli-operations"
    domain: "operations"
    description: >
      Use the tailor-sdk CLI for deployment, workspace management,
      migrations, secrets, workflow execution, and debugging.
    type: "core"
    packages:
      - "@tailor-platform/sdk"
    covers:
      - "tailor-sdk apply / remove / show"
      - "tailor-sdk generate"
      - "tailor-sdk login / logout"
      - "tailor-sdk workspace create / list / delete"
      - "tailor-sdk tailordb truncate / migration generate / migration set / migration status"
      - "tailor-sdk workflow list / get / start / executions / resume"
      - "tailor-sdk executor list / get / jobs / trigger / webhook"
      - "tailor-sdk machineuser list / token"
      - "tailor-sdk secret vault / secret"
      - "tailor-sdk user / profile"
      - "tailor-sdk tailordb erd export / serve / deploy"
      - "tailor-sdk function test-run / logs"
      - "--env-file / --workspace-id / --profile / --json / --verbose"
    tasks:
      - "Deploy application to a workspace"
      - "Create and manage workspaces"
      - "Run database migrations"
      - "Get a machine user token for API testing"
      - "Start and monitor workflow executions"
      - "Manage secrets"
      - "Test-run functions locally"
    reference_candidates:
      - topic: "CLI commands and options"
        reason: ">20 distinct commands with unique options and flags"
    failure_modes:
      - mistake: ".trigger() calls in test-run mode"
        mechanism: >
          Workflow job .trigger() calls do NOT work in function test-run
          mode. Tests that depend on inter-job communication will fail
          silently.
        source: "docs/cli/function.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Forgetting --workspace-id on first deploy"
        mechanism: >
          The first deploy requires --workspace-id since no profile
          exists yet. Agents may omit it and get an error.
        wrong_pattern: |
          tailor-sdk apply
        correct_pattern: |
          tailor-sdk apply --workspace-id <workspace-id>
          # Or set up a profile first:
          tailor-sdk profile create
        source: "docs/cli-reference.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Skipping generate before apply"
        mechanism: >
          If plugins are configured, tailor-sdk generate must be run
          before apply to produce generated types. Without it, resolver/
          workflow code that imports generated files will fail to bundle.
        source: "docs/quickstart.md"
        priority: "MEDIUM"
        status: "active"

  # ── lifecycle skill ────────────────────────────────────────────────

  - name: "Quickstart"
    slug: "quickstart"
    domain: "project-config"
    description: >
      End-to-end guide from project creation to first deployment,
      covering setup, config, model definition, and deploy.
    type: "lifecycle"
    packages:
      - "@tailor-platform/sdk"
      - "@tailor-platform/create-sdk"
    covers:
      - "Project scaffolding"
      - "First tailor.config.ts"
      - "First model and resolver"
      - "First deploy and verification"
    tasks:
      - "Create a project and deploy a hello-world app"
      - "Verify deployment works end-to-end"
    failure_modes:
      - mistake: "Deploying without workspace creation"
        mechanism: >
          A workspace must be created before the first deploy. Agents
          may jump straight to tailor-sdk apply without workspace setup.
        wrong_pattern: |
          npm create @tailor-platform/sdk -- --template hello-world my-app
          cd my-app && pnpm install
          pnpm run deploy
        correct_pattern: |
          npm create @tailor-platform/sdk -- --template hello-world my-app
          cd my-app && pnpm install
          tailor-sdk workspace create
          pnpm run deploy -- --workspace-id <id>
        source: "docs/quickstart.md"
        priority: "HIGH"
        status: "active"

      - mistake: "Not setting permissions on first model"
        mechanism: >
          Default-deny permissions mean a deployed model with no
          permissions is unusable via API. First-time users hit this
          immediately.
        source: "docs/services/tailordb.md"
        priority: "HIGH"
        status: "active"
        skills: ["quickstart", "model-definition"]

      - mistake: "Using insecure IdP authorization in production"
        mechanism: >
          "insecure" authorization allows unauthenticated access and is
          only for development. Agents may copy quickstart examples
          into production config.
        wrong_pattern: |
          defineIdp("my-idp", {
            authorization: "insecure",
          });
        correct_pattern: |
          defineIdp("my-idp", {
            authorization: "loggedIn",
            // Or a CEL expression for custom logic
          });
        source: "docs/services/idp.md"
        priority: "CRITICAL"
        status: "active"
        skills: ["quickstart", "configuration"]

tensions:
  - name: "Default-deny security vs getting-started simplicity"
    skills: ["quickstart", "model-definition"]
    description: >
      Permissions default to deny-all, which is secure but makes first
      models unusable without explicit permission setup.
    implication: >
      Agents optimizing for a quick getting-started flow skip permissions
      and produce models that cannot be accessed via API. Agents optimizing
      for security add overly restrictive permissions that block development.

  - name: "Type safety strictness vs rapid prototyping"
    skills: ["code-generation", "workflow"]
    description: >
      Generated Kysely types enforce strict schemas but require running
      generate before any code that imports them compiles.
    implication: >
      Agents write resolver/workflow code importing generated types before
      running generate, causing compilation errors that look like bugs.

  - name: "Declarative config vs imperative logic"
    skills: ["configuration", "resolver", "executor"]
    description: >
      Config (defineConfig) is declarative and validated at build time,
      while resolvers/executors contain imperative TypeScript. Errors
      in config surface early; errors in logic surface at runtime.
    implication: >
      Agents may mix config-level concerns (auth, permissions) with
      runtime logic, or vice versa, producing code that type-checks but
      fails at deployment or runtime.

