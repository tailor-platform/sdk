name: Install aqua
description: Install aqua package manager

inputs:
  aqua_version:
    description: "Version of aqua to install"
    required: false
    default: "v2.53.2"

runs:
  using: composite
  steps:
    - name: Install aqua
      uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
      with:
        aqua_version: ${{ inputs.aqua_version }}
