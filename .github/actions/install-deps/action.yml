name: Install deps
description: Install dependencies

inputs:
  node-version:
    description: "Node.js major version to install"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      name: Install pnpm
      with:
        standalone: true
        run_install: false

    # `actions/setup-node` is used (instead of `pnpm runtime set node`) so that
    # Node is on the system PATH for every spawned shell. `pnpm rebuild` on
    # Windows does not propagate pnpm's internal runtime to subshells, which
    # made postinstall scripts (lefthook, esbuild) fail with "'node' is not
    # recognized" during the bin-link refresh step below.
    - name: Install Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    # Build SDK so that the bin entry points to a real dist file
    - name: Build SDK package
      run: pnpm exec turbo run build --filter @tailor-platform/sdk
      shell: bash

    # Re-link .bin entries after build (pnpm 11 treats a same-lockfile re-install
    # as a no-op, so a second `pnpm install` no longer regenerates bin links
    # on Windows; `pnpm rebuild` forces the relink without touching the lockfile).
    - name: Re-link bin entries after build
      run: pnpm rebuild
      shell: bash
