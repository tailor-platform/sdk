name: Install deps
description: Install dependencies

inputs:
  node-version:
    description: "Node.js major version to install"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      name: Install pnpm
      with:
        standalone: true
        run_install: false

    # `cache: pnpm` requires pnpm on PATH, so pnpm/action-setup must run first.
    - name: Install Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install
      shell: bash

    # Build SDK so that the bin entry points to a real dist file
    - name: Build SDK package
      run: pnpm --filter @tailor-platform/sdk run build
      shell: bash

    # Re-link workspace bin entries after their SDK target has been built.
    - name: Re-link SDK bin entries after build
      run: pnpm --filter '...@tailor-platform/sdk' --filter '!@tailor-platform/sdk' rebuild --pending
      shell: bash
