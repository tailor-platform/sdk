name: Install deps
description: Install dependencies

inputs:
  node-version:
    description: "Node.js major version to install"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      name: Install pnpm
      with:
        standalone: true
        run_install: false

    - name: Install Node.js
      run: pnpm runtime set node ${{ inputs.node-version }} -g
      shell: bash

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    # Build SDK so that the bin entry points to a real dist file
    - name: Build SDK package
      run: pnpm exec turbo run build --filter @tailor-platform/sdk
      shell: bash

    # Re-link .bin entries after build (pnpm 11 treats a same-lockfile re-install
    # as a no-op, so a second `pnpm install` no longer regenerates bin links
    # on Windows; `pnpm rebuild` forces the relink without touching the lockfile).
    - name: Re-link bin entries after build
      run: pnpm rebuild
      shell: bash
