name: Install deps
description: Install dependencies

inputs:
  node-version:
    description: "Node.js major version to install"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - name: Install pnpm + Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        install: false

    - name: Disable global virtual store in CI
      run: echo "PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false" >> "$GITHUB_ENV"
      shell: bash

    - name: Install dependencies
      run: pnpm install
      shell: bash

    # Build the SDK and CLI plugins so their import entries point to real dist
    # files. Their bins are committed launchers, so pnpm links them at install
    # time and no re-link after the build is needed.
    - name: Build SDK packages
      run: pnpm --filter @tailor-platform/sdk --filter @tailor-platform/sdk-plugin-seed --filter @tailor-platform/sdk-plugin-setup --filter @tailor-platform/sdk-plugin-tailordb-erd run build
      shell: bash
