name: Install deps
description: Install dependencies

inputs:
  node-version:
    description: "Node.js major version to install"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      name: Install pnpm
      with:
        run_install: false

    # `cache: pnpm` requires pnpm on PATH, so pnpm/action-setup must run first.
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Disable global virtual store in CI
      run: echo "PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false" >> "$GITHUB_ENV"
      shell: bash

    - name: Install dependencies
      run: pnpm install
      shell: bash

    # Build the SDK and CLI plugins so their bin and import entries point to real dist files.
    - name: Build SDK packages
      run: pnpm --filter @tailor-platform/sdk --filter @tailor-platform/sdk-plugin-seed --filter @tailor-platform/sdk-plugin-tailordb-erd run build
      shell: bash

    # Re-link workspace bin entries after their targets have been built.
    - name: Re-link SDK bin entries after build
      run: pnpm --filter '...@tailor-platform/sdk' --filter '...@tailor-platform/sdk-plugin-seed' --filter '...@tailor-platform/sdk-plugin-tailordb-erd' --filter '!@tailor-platform/sdk' --filter '!@tailor-platform/sdk-plugin-seed' --filter '!@tailor-platform/sdk-plugin-tailordb-erd' rebuild --pending
      shell: bash
