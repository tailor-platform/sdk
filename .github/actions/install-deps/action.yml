name: Install deps
description: Install dependencies

inputs:
  node-version:
    description: "Node.js major version to install"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - name: Setup takumi-guard
      uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1

    - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
      name: Install pnpm
      with:
        standalone: true
        run_install: false

    - name: Install Node.js
      run: pnpm env use --global ${{ inputs.node-version }}
      shell: bash

    - name: Install dependencies
      run: pnpm install
      shell: bash

    # takumi-guard adds registry=https://npm.flatt.tech/ to .npmrc;
    # restore it so downstream steps don't see uncommitted changes.
    - name: Restore .npmrc
      run: git checkout -- .npmrc
      shell: bash

    # Build SDK so that the bin entry points to a real dist file
    - name: Build SDK package
      run: pnpm exec turbo run build --filter @tailor-platform/sdk
      shell: bash

    # Recreate .bin links after build
    - name: Re-install to create bin links
      run: pnpm install --frozen-lockfile
      shell: bash
