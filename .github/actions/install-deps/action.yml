name: Install deps
description: Install dependencies

inputs:
  node-version:
    description: "Node.js major version to install"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      name: Install pnpm
      with:
        standalone: true
        run_install: false

    # `cache: pnpm` requires pnpm on PATH, so pnpm/action-setup must run first.
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Disable global virtual store in CI
      run: echo "PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE=false" >> "$GITHUB_ENV"
      shell: bash

    - name: Install dependencies
      run: pnpm install
      shell: bash

    # Build SDK so that the bin entry points to a real dist file. The ERD
    # plugin is built too: example/tailor.config.ts imports it, which
    # resolves to dist.
    - name: Build SDK packages
      run: pnpm --filter @tailor-platform/sdk --filter @tailor-platform/sdk-plugin-tailordb-erd run build
      shell: bash

    # Re-link workspace bin entries after their SDK target has been built.
    - name: Re-link SDK bin entries after build
      run: pnpm --filter '...@tailor-platform/sdk' --filter '!@tailor-platform/sdk' rebuild --pending
      shell: bash
