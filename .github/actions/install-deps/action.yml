name: Install deps
description: Install dependencies

inputs:
  node-version:
    description: "Node.js major version to install"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      name: Install pnpm
      with:
        standalone: true
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      run: pnpm install
      shell: bash

    # Build SDK so that the bin entry points to a real dist file
    - name: Build SDK package
      run: pnpm --filter @tailor-platform/sdk run build
      shell: bash

    # Re-link the SDK's bin entry after build. pnpm 11 treats a same-lockfile
    # re-install as a no-op, so a second `pnpm install` no longer regenerates
    # bin links. `pnpm rebuild --pending` relinks the newly-built target
    # without re-running every dependency's lifecycle scripts; a bare
    # `pnpm rebuild` would re-invoke esbuild/lefthook postinstalls, and on
    # Windows runners those child shells cannot find `node` on PATH and the
    # step fails.
    - name: Re-link SDK bin entry after build
      run: pnpm rebuild --pending
      shell: bash
