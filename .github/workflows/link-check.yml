name: Link Check

on:
  pull_request:
    paths:
      - "packages/sdk/docs/**/*.md"
      - "scripts/check-docs-paths.js"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: |
            --no-progress
            --include-fragments
            --exclude 'mailto:'
            packages/sdk/docs/**/*.md
          fail: true

      # docs.tailor.tech only serves packages/sdk/docs/, so relative links that
      # escape that directory (e.g. `../../../example/foo.ts`) render on GitHub
      # but 404 on the docs site. lychee passes them because the target file
      # exists on disk — this step catches that specific gap.
      - name: Check relative links stay within packages/sdk/docs/
        run: node scripts/check-docs-paths.js
