name: SDK Metrics

on:
  pull_request:
    branches: [main]
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - cccc.toml
      - .github/scripts/complexity-report*.mjs
      - .github/workflows/sdk-metrics.yml
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  coverage-shard:
    # Skip re-runs triggered by tailor-pr-trigger bot (changeset/generate commits)
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    name: Coverage shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        uses: $/.github/actions/install-deps

      - name: Login as machine user
        run: pnpm tailor login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Run SDK coverage shard
        # The subprocess-driven "e2e" project is invisible to V8 coverage and
        # runs in sdk-e2e.yml; "e2e-coverage" and every other project stay in.
        run: pnpm exec vitest run --coverage --coverage.reporter=lcovonly --project '!e2e' --shard="${SHARD}/4"
        working-directory: packages/sdk
        env:
          SHARD: ${{ matrix.shard }}
          GITHUB_RUN_ID: ${{ github.run_id }}-${{ matrix.shard }}
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ secrets.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ secrets.TAILOR_PLATFORM_FOLDER_ID }}
          TAILOR_PLATFORM_WORKSPACE_REGION: us-west

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-${{ matrix.shard }}
          path: packages/sdk/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage-cleanup:
    # Safety net for e2e workspace leaks. Run once after all shards finish so
    # cleanup cannot delete workspaces that a slower shard is still using.
    needs: coverage-shard
    if: always() && (github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]')
    name: Cleanup e2e workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        uses: $/.github/actions/install-deps

      - name: Login as machine user
        run: pnpm tailor login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Cleanup e2e workspaces
        env:
          RUN_ID: ${{ github.run_id }}
        run: pnpm --filter @tailor-platform/sdk exec tsx scripts/cleanup-e2e-workspaces.ts --run-id="$RUN_ID"

  bundle-size:
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    name: Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        uses: $/.github/actions/install-deps

      - name: Measure bundle size
        run: pnpm --filter @tailor-platform/sdk measure:bundle

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size-results
          path: packages/sdk/bundle-size.json

  type-performance:
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    name: Type Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.attest-report.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetches the base commit, the first parent of the pull request merge commit
          fetch-depth: 2

      - name: Install deps
        uses: $/.github/actions/install-deps

      - name: Prepare the base commit
        if: github.event_name == 'pull_request'
        run: |
          base_dir="${RUNNER_TEMP}/attest-base"
          mkdir -p "${base_dir}"
          git archive HEAD^1 tsconfig.json packages/sdk | tar -x -C "${base_dir}"
          ln -s "${PWD}/node_modules" "${base_dir}/node_modules"
          ln -s "${PWD}/packages/sdk/node_modules" "${base_dir}/packages/sdk/node_modules"

      - name: Run type instantiation benches
        run: |
          base_root=()
          if [ -d "${RUNNER_TEMP}/attest-base" ]; then
            base_root=(--base-root "${RUNNER_TEMP}/attest-base/packages/sdk")
          fi
          pnpm --filter @tailor-platform/sdk perf:attest "${base_root[@]}"

      - name: Report instantiation changes
        id: attest-report
        run: |
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "changes<<${delimiter}"
            if [ -s packages/sdk/attest-changes.md ]; then
              echo ""
              cat packages/sdk/attest-changes.md
              echo ""
            fi
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
          cat packages/sdk/attest-changes.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: type-perf-results
          path: |
            packages/sdk/attest-metrics.json

  runtime-performance:
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    name: Runtime Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        uses: $/.github/actions/install-deps

      - name: Run runtime performance
        run: pnpm --filter @tailor-platform/sdk perf:runtime

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-perf-results
          path: |
            packages/sdk/runtime-perf.json
            packages/sdk/runtime-perf-summary.json

  complexity:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]')
    name: Code Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.report.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetches the base commit, the first parent of the pull request merge commit
          fetch-depth: 2

      - name: Test complexity report
        run: node --test .github/scripts/complexity-report.test.mjs

      - name: Install cccc
        uses: moznion/cccc-action@1d5313811f8451953e46a268c61791a01e40b7df # v1.1.2
        with:
          version: v1.8.3

      - name: Measure complexity
        run: |
          measure() { cccc --config "${GITHUB_WORKSPACE}/cccc.toml" packages/*/src; }
          measure > "${RUNNER_TEMP}/head.json"
          git worktree add --detach "${RUNNER_TEMP}/base" HEAD^1
          git diff --name-status -M HEAD^1 HEAD > "${RUNNER_TEMP}/renames.txt"
          cd "${RUNNER_TEMP}/base"
          measure > "${RUNNER_TEMP}/base.json"

      - name: Report changed functions
        id: report
        run: |
          node .github/scripts/complexity-report.mjs \
            --base "${RUNNER_TEMP}/base.json" \
            --head "${RUNNER_TEMP}/head.json" \
            --renames "${RUNNER_TEMP}/renames.txt" \
            --out "${RUNNER_TEMP}/changes.md"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "changes<<${delimiter}"
            cat "${RUNNER_TEMP}/changes.md"
            # Keeps the trailing newline that separates the message from octocov's tables
            echo
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  report-metrics:
    name: Report Metrics
    # Code Complexity runs only on pull requests, and its failure must not drop the rest of the report
    if: >-
      ${{ !cancelled() &&
      needs.coverage-shard.result == 'success' &&
      needs.bundle-size.result == 'success' &&
      needs.type-performance.result == 'success' &&
      needs.runtime-performance.result == 'success' }}
    needs: [coverage-shard, bundle-size, type-performance, runtime-performance, complexity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout and read coverage artifacts
      pull-requests: write # octocov posts the metrics report on the PR
      actions: write # octocov manages the coverage report artifact
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Prepare coverage
        run: |
          mkdir -p packages/sdk/coverage
          for shard in artifacts/coverage-lcov-*/lcov.info; do
            cp "$shard" "packages/sdk/coverage/lcov-$(basename "$(dirname "$shard")" | sed 's/coverage-lcov-//').info"
          done
          ls -l packages/sdk/coverage/

      - name: Display summary
        run: |
          {
            echo "# SDK Metrics Summary"
            echo ""

            echo "## Coverage"
            echo ""
            echo "See octocov report below for coverage details."
            echo ""

            echo "## Bundle Size"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            jq -r '.metrics[] | "| \(.name) | \(.value) \(.unit) |"' artifacts/bundle-size-results/bundle-size.json
            echo ""

            echo "## Type Performance (instantiations)"
            echo ""
            echo "| Case | Instantiations |"
            echo "|------|---------------:|"
            jq -r '.metrics[] | "| \(.name) | \(.value) |"' artifacts/type-perf-results/attest-metrics.json
            echo ""

            echo "## Runtime Performance"
            echo ""
            echo "| Command | Max | Median |"
            echo "|---------|----:|-------:|"
            jq -r '"| generate | \(.generate.max)ms | \(.generate.median)ms |"' artifacts/runtime-perf-results/runtime-perf-summary.json
            jq -r '"| apply (build) | \(."apply-build".max)ms | \(."apply-build".median)ms |"' artifacts/runtime-perf-results/runtime-perf-summary.json
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: packages/sdk/.octocov.yml
        env:
          OCTOCOV_CUSTOM_METRICS_TYPE_PERFORMANCE: artifacts/type-perf-results/attest-metrics.json
          OCTOCOV_CUSTOM_METRICS_BUNDLE_SIZE: artifacts/bundle-size-results/bundle-size.json
          OCTOCOV_CUSTOM_METRICS_RUNTIME_PERFORMANCE: artifacts/runtime-perf-results/runtime-perf.json
          SDK_COMPLEXITY_CHANGES: ${{ needs.complexity.outputs.changes }}
          SDK_TYPE_PERF_CHANGES: ${{ needs.type-performance.outputs.changes }}
