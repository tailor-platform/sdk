name: SDK Metrics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Login as machine user
        run: pnpm tailor-sdk login --machineuser
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Run SDK coverage
        run: pnpm --filter @tailor-platform/sdk test:coverage
        env:
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ secrets.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ secrets.TAILOR_PLATFORM_FOLDER_ID }}

      - name: Upload results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-results
          path: packages/sdk/coverage/lcov.info

      - name: Cleanup e2e workspaces
        if: always()
        run: pnpm --filter @tailor-platform/sdk exec tsx scripts/cleanup-e2e-workspaces.ts --run-id=${{ github.run_id }}

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Build SDK
        run: pnpm --filter @tailor-platform/sdk build

      - name: Measure bundle size
        run: pnpm --filter @tailor-platform/sdk measure:bundle

      - name: Upload results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bundle-size-results
          path: packages/sdk/bundle-size.json

  type-performance:
    name: Type Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run type check performance
        run: pnpm --filter @tailor-platform/sdk perf:typecheck

      - name: Upload results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: type-perf-results
          path: |
            packages/sdk/diagnostics.json
            packages/sdk/diagnostics-summary.json

  runtime-performance:
    name: Runtime Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Build SDK
        run: pnpm --filter @tailor-platform/sdk build

      - name: Run runtime performance
        run: pnpm --filter @tailor-platform/sdk perf:runtime

      - name: Upload results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runtime-perf-results
          path: |
            packages/sdk/runtime-perf.json
            packages/sdk/runtime-perf-summary.json

  report-metrics:
    name: Report Metrics
    needs: [coverage, bundle-size, type-performance, runtime-performance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Prepare coverage
        run: |
          mkdir -p packages/sdk/coverage
          cp artifacts/coverage-results/lcov.info packages/sdk/coverage/

      - name: Display summary
        run: |
          {
            echo "# SDK Metrics Summary"
            echo ""

            echo "## Coverage"
            echo ""
            echo "See octocov report below for coverage details."
            echo ""

            echo "## Bundle Size"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            jq -r '.metrics[] | "| \(.name) | \(.value) \(.unit) |"' artifacts/bundle-size-results/bundle-size.json
            echo ""

            echo "## Type Check Performance"
            echo ""
            echo "| Feature | Instantiations | Types |"
            echo "|---------|---------------:|------:|"
            jq -r 'sort_by(.instantiations) | reverse | .[] | "| \(.key) | \(.instantiations) | \(.types) |"' artifacts/type-perf-results/diagnostics-summary.json
            echo ""

            echo "## Runtime Performance"
            echo ""
            echo "| Command | Max | Median |"
            echo "|---------|----:|-------:|"
            jq -r '"| generate | \(.generate.max)ms | \(.generate.median)ms |"' artifacts/runtime-perf-results/runtime-perf-summary.json
            jq -r '"| apply (build) | \(."apply-build".max)ms | \(."apply-build".median)ms |"' artifacts/runtime-perf-results/runtime-perf-summary.json
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run octocov
        uses: k1LoW/octocov-action@73d561f65d59e66899ed5c87e4621a913b5d5c20 # v1.5.0
        with:
          config: packages/sdk/.octocov.yml
        env:
          OCTOCOV_CUSTOM_METRICS_TYPE_PERFORMANCE: artifacts/type-perf-results/diagnostics.json
          OCTOCOV_CUSTOM_METRICS_BUNDLE_SIZE: artifacts/bundle-size-results/bundle-size.json
          OCTOCOV_CUSTOM_METRICS_RUNTIME_PERFORMANCE: artifacts/runtime-perf-results/runtime-perf.json
