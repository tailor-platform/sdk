name: SDK Metrics

on:
  pull_request:
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/sdk-metrics.yml
  push:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  coverage-shard:
    # Skip re-runs triggered by tailor-pr-trigger bot (changeset/generate commits)
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    name: Coverage shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Login as machine user
        run: pnpm tailor login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Run SDK coverage shard
        run: pnpm exec vitest run --coverage --coverage.reporter=lcovonly --shard="${SHARD}/4"
        working-directory: packages/sdk
        env:
          SHARD: ${{ matrix.shard }}
          GITHUB_RUN_ID: ${{ github.run_id }}-${{ matrix.shard }}
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ secrets.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ secrets.TAILOR_PLATFORM_FOLDER_ID }}

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov-${{ matrix.shard }}
          path: packages/sdk/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage-cleanup:
    # Safety net for e2e workspace leaks. Run once after all shards finish so
    # cleanup cannot delete workspaces that a slower shard is still using.
    needs: coverage-shard
    if: always() && (github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]')
    name: Cleanup e2e workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Login as machine user
        run: pnpm tailor login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Cleanup e2e workspaces
        env:
          RUN_ID: ${{ github.run_id }}
        run: pnpm --filter @tailor-platform/sdk exec tsx scripts/cleanup-e2e-workspaces.ts --run-id="$RUN_ID"

  bundle-size:
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    name: Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Measure bundle size
        run: pnpm --filter @tailor-platform/sdk measure:bundle

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-results
          path: packages/sdk/bundle-size.json

  type-performance:
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    name: Type Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run type check performance
        run: pnpm --filter @tailor-platform/sdk perf:typecheck

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: type-perf-results
          path: |
            packages/sdk/diagnostics.json
            packages/sdk/diagnostics-summary.json

  runtime-performance:
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    name: Runtime Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run runtime performance
        run: pnpm --filter @tailor-platform/sdk perf:runtime

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-perf-results
          path: |
            packages/sdk/runtime-perf.json
            packages/sdk/runtime-perf-summary.json

  report-metrics:
    name: Report Metrics
    needs: [coverage-shard, bundle-size, type-performance, runtime-performance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout and read coverage artifacts
      pull-requests: write # octocov posts the metrics report on the PR
      actions: write # octocov manages the coverage report artifact
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Prepare coverage
        run: |
          mkdir -p packages/sdk/coverage
          for shard in artifacts/coverage-lcov-*/lcov.info; do
            cp "$shard" "packages/sdk/coverage/lcov-$(basename "$(dirname "$shard")" | sed 's/coverage-lcov-//').info"
          done
          ls -l packages/sdk/coverage/

      - name: Display summary
        run: |
          {
            echo "# SDK Metrics Summary"
            echo ""

            echo "## Coverage"
            echo ""
            echo "See octocov report below for coverage details."
            echo ""

            echo "## Bundle Size"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            jq -r '.metrics[] | "| \(.name) | \(.value) \(.unit) |"' artifacts/bundle-size-results/bundle-size.json
            echo ""

            echo "## Type Check Performance"
            echo ""
            echo "| Feature | Instantiations | Types |"
            echo "|---------|---------------:|------:|"
            jq -r 'sort_by(.instantiations) | reverse | .[] | "| \(.key) | \(.instantiations) | \(.types) |"' artifacts/type-perf-results/diagnostics-summary.json
            echo ""

            echo "## Runtime Performance"
            echo ""
            echo "| Command | Max | Median |"
            echo "|---------|----:|-------:|"
            jq -r '"| generate | \(.generate.max)ms | \(.generate.median)ms |"' artifacts/runtime-perf-results/runtime-perf-summary.json
            jq -r '"| apply (build) | \(."apply-build".max)ms | \(."apply-build".median)ms |"' artifacts/runtime-perf-results/runtime-perf-summary.json
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run octocov
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1
        with:
          config: packages/sdk/.octocov.yml
        env:
          OCTOCOV_CUSTOM_METRICS_TYPE_PERFORMANCE: artifacts/type-perf-results/diagnostics.json
          OCTOCOV_CUSTOM_METRICS_BUNDLE_SIZE: artifacts/bundle-size-results/bundle-size.json
          OCTOCOV_CUSTOM_METRICS_RUNTIME_PERFORMANCE: artifacts/runtime-perf-results/runtime-perf.json
