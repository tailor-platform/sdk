name: "Deploy Drift Check"

# Deploys each create-sdk template to a fresh workspace and verifies that an
# immediate dry run reports "Plan: 0 to create, 0 to update, 0 to delete" — a
# redeploy of unchanged code must be a no-op. Guards against comparison drift
# such as newly added proto fields being reported as updates on every deploy.
# example/ gets the same check inside the existing Workspace Deploy Test
# (deploy.yml), which already deploys it on every PR.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  changes:
    name: Detect changes
    # Skip re-runs triggered by tailor-pr-trigger bot (changeset/generate commits)
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            changes:
              - .github/workflows/deploy-drift-check.yml
              - .github/actions/**
              - packages/**
              - package.json
              - tsconfig.json
              - pnpm-workspace.yaml
              - pnpm-lock.yaml

  drift-check:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    name: Drift check (${{ matrix.target }})
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: hello-world
            dir: packages/create-sdk/templates/hello-world
          - target: tailordb
            dir: packages/create-sdk/templates/tailordb
          - target: resolver
            dir: packages/create-sdk/templates/resolver
          - target: executor
            dir: packages/create-sdk/templates/executor
          - target: workflow
            dir: packages/create-sdk/templates/workflow
          - target: generators
            dir: packages/create-sdk/templates/generators
          - target: inventory-management
            dir: packages/create-sdk/templates/inventory-management
          - target: multi-application
            dir: packages/create-sdk/templates/multi-application
            config: apps/user/tailor.config.ts,apps/admin/tailor.config.ts
          - target: static-web-site
            dir: packages/create-sdk/templates/static-web-site
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Login as machine user
        run: pnpm tailor-sdk login --machineuser
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Create workspace
        id: workspace
        working-directory: ${{ matrix.dir }}
        env:
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ secrets.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ secrets.TAILOR_PLATFORM_FOLDER_ID }}
          WORKSPACE_NAME: e2e-ws-${{ github.run_id }}-drift-${{ matrix.target }}
        run: |
          workspace_id=$(pnpm exec tailor-sdk workspace create -n "$WORKSPACE_NAME" -r us-west --json | tail -1 | jq -r '.id')
          if [[ -z "$workspace_id" || "$workspace_id" == "null" ]]; then
            echo "Failed to create workspace"
            exit 1
          fi
          echo "id=$workspace_id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        working-directory: ${{ matrix.dir }}
        env:
          # Fresh checkout deploys a throwaway app; per-run id injection is intended here.
          TAILOR_PLATFORM_SDK_ALLOW_CI_ID_INJECTION: "true"
          WORKSPACE_ID: ${{ steps.workspace.outputs.id }}
          CONFIG: ${{ matrix.config || 'tailor.config.ts' }}
        run: pnpm exec tailor-sdk deploy -c "$CONFIG" -w "$WORKSPACE_ID" --yes

      - name: Dry run must report no changes
        working-directory: ${{ matrix.dir }}
        env:
          WORKSPACE_ID: ${{ steps.workspace.outputs.id }}
          CONFIG: ${{ matrix.config || 'tailor.config.ts' }}
        run: |
          summary=$(pnpm exec tailor-sdk deploy -c "$CONFIG" -w "$WORKSPACE_ID" --dry-run --yes --json | tail -1 | jq -c '.summary')
          echo "Plan summary: $summary"
          if ! echo "$summary" | jq -e '.create == 0 and .update == 0 and .delete == 0 and .replace == 0' > /dev/null; then
            echo "::error::Dry run after deploy reported drift: $summary"
            echo "Re-running without --json for a readable diff:"
            pnpm exec tailor-sdk deploy -c "$CONFIG" -w "$WORKSPACE_ID" --dry-run --yes
            exit 1
          fi

      - name: Cleanup workspace
        if: always()
        working-directory: packages/sdk
        env:
          RUN_ID: ${{ github.run_id }}
          TARGET: ${{ matrix.target }}
        run: pnpm exec tsx scripts/cleanup-e2e-workspaces.ts --run-id="${RUN_ID}-drift-${TARGET}"

  drift-check-result:
    name: Deploy drift check result
    needs: [changes, drift-check]
    if: >-
      always() &&
      (github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]')
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.should_run }}
          DRIFT_CHECK_RESULT: ${{ needs.drift-check.result }}
        run: |
          # Fail closed: if the paths-filter job itself failed, should_run is
          # empty and must not be mistaken for "no relevant changes".
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Changes job did not succeed (result=$CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" ]]; then
            echo "Skipped - no relevant changes"
            exit 0
          fi
          if [[ "$DRIFT_CHECK_RESULT" != "success" ]]; then
            echo "Drift check job failed"
            exit 1
          fi
          echo "Deploy drift check succeeded"
