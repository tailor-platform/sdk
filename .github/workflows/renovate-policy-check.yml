name: Renovate Policy Check

on:
  pull_request:
    paths:
      - renovate.json
      - pnpm-workspace.yaml
      - .github/workflows/**
      - .github/scripts/renovate-policy-check.mjs
      - "**/package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  policy-check:
    name: Policy check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # checkout the repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run policy check
        run: node .github/scripts/renovate-policy-check.mjs
