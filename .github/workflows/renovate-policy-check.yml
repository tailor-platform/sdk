name: Renovate Policy Check

on:
  pull_request:
    paths:
      - renovate.json
      - pnpm-workspace.yaml
      - .github/workflows/**
      - .github/scripts/renovate-policy-check.mjs
      - "**/package.json"

permissions:
  contents: read

jobs:
  policy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run policy check
        run: node .github/scripts/renovate-policy-check.mjs
