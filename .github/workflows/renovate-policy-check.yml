name: Renovate Policy Check

on:
  pull_request:
    paths:
      - renovate.json
      - pnpm-workspace.yaml
      - .github/workflows/**
      - .github/scripts/renovate-policy-check.mjs
      - "**/package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  policy-check:
    name: Policy check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # checkout the repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run policy check
        run: node .github/scripts/renovate-policy-check.mjs
