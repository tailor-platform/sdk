name: Renovate Policy Check

on:
  pull_request:
    paths:
      - renovate.json
      - pnpm-workspace.yaml
      - .github/workflows/**
      - .github/scripts/renovate-policy-check.mjs
      - .github/scripts/lockfile-audit-fix-normalize.mjs
      - .github/scripts/lockfile-audit-fix-normalize.test.mjs
      - "**/package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  policy-check:
    name: Policy check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read # checkout the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run policy check
        run: node .github/scripts/renovate-policy-check.mjs

      - name: Test lockfile normalize script
        run: node --test .github/scripts/lockfile-audit-fix-normalize.test.mjs
