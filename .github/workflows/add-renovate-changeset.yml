name: Add changeset for Renovate PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  add-changeset-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.user.type == 'Bot'

    steps:
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Default ref on pull_request events is the merge ref
          # (refs/pull/N/merge), which is PR head merged with the *current* base
          # branch tip. That pulls in unrelated base-branch changes whenever main
          # moves forward while the PR is open, causing false positives. Pin to
          # the PR head sha so the diff only reflects this PR's own changes.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Determine changeset plan
        id: plan
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eo pipefail

          FILENAME=".changeset/renovate-${PR_NUMBER}.md"
          if [ -f "$FILENAME" ]; then
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            echo "add_skip_label=false" >> "$GITHUB_OUTPUT"
            echo "Changeset $FILENAME already exists; skipping"
            exit 0
          fi

          git fetch --no-tags --quiet origin "$BASE_REF"
          BASE_SHA=$(git merge-base "origin/${BASE_REF}" HEAD)

          changed=$(git diff --name-only "$BASE_SHA" HEAD \
            | grep -E '^packages/[^/]+/package\.json$' || true)

          if [ -z "$changed" ]; then
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            echo "add_skip_label=true" >> "$GITHUB_OUTPUT"
            echo "No packages/*/package.json changes; skipping"
            exit 0
          fi

          names=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            old=$(git show "$BASE_SHA:$file" 2>/dev/null \
              | jq -S 'del(.devDependencies)' 2>/dev/null || echo "null")
            new=$(jq -S 'del(.devDependencies)' "$file")
            if [ "$old" = "$new" ]; then
              echo "Skipping $file (devDependencies-only change)"
              continue
            fi
            # Private packages are ignored by changesets; mixing them with
            # public packages in one changeset breaks `changeset version`
            # with a "Mixed changesets" error.
            if [ "$(jq -r '.private // false' "$file")" = "true" ]; then
              echo "Skipping $file (private package)"
              continue
            fi
            name=$(jq -r '.name' "$file")
            # @tailor-platform/create-sdk is in the fixed group with
            # @tailor-platform/sdk (see .changeset/config.json), so normalize
            # to avoid redundant entries — they always bump together.
            if [ "$name" = "@tailor-platform/create-sdk" ]; then
              name="@tailor-platform/sdk"
            fi
            names+=("$name")
          done <<< "$changed"

          if [ "${#names[@]}" -eq 0 ]; then
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            echo "add_skip_label=true" >> "$GITHUB_OUTPUT"
            echo "Only devDependencies changed; no changeset needed"
            exit 0
          fi

          unique=$(printf '%s\n' "${names[@]}" | sort -u)
          {
            echo "should_create=true"
            echo "add_skip_label=false"
            echo "names<<NAMES_EOF"
            echo "$unique"
            echo "NAMES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create changeset file
        if: steps.plan.outputs.should_create == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NAMES: ${{ steps.plan.outputs.names }}
        run: |
          set -eo pipefail
          FILENAME=".changeset/renovate-${PR_NUMBER}.md"
          {
            echo "---"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              printf '"%s": patch\n' "$name"
            done <<< "$NAMES"
            echo "---"
            echo ""
            printf '%s\n' "${PR_TITLE}"
          } > "$FILENAME"

      - name: Commit changeset
        if: steps.plan.outputs.should_create == 'true'
        uses: suzuki-shunsuke/commit-action@44cc32c01e261a029c0161ff908a3a2895bfc46f # v0.1.2
        with:
          app_id: ${{ secrets.TAILOR_GITHUB_APP_ID }}
          app_private_key: ${{ secrets.TAILOR_GITHUB_APP_PRIVATE_KEY }}
          commit_message: "chore: add changeset for renovate"
          files: |
            .changeset/renovate-${{ github.event.pull_request.number }}.md
          fail_on_self_push: false

      - name: Add skip-changeset label
        if: steps.plan.outputs.add_skip_label == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --add-label skip-changeset
