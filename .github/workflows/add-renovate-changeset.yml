name: Add changeset for Renovate PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  add-changeset-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.user.type == 'Bot'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check if changeset exists
        id: check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILENAME=".changeset/renovate-${PR_NUMBER}.md"
          if [ -f "$FILENAME" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create changeset file
        if: steps.check.outputs.exists == 'false'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILENAME="renovate-${PR_NUMBER}.md"

          cat > ".changeset/${FILENAME}" << EOF
          ---
          "@tailor-platform/sdk": patch
          ---

          ${PR_TITLE}
          EOF

      - name: Commit changeset
        if: steps.check.outputs.exists == 'false'
        uses: suzuki-shunsuke/commit-action@f12e2d628a4ab72dcefe7890ae07e8dbf1e201b9 # v0.1.1
        with:
          app_id: ${{ secrets.TAILOR_GITHUB_APP_ID }}
          app_private_key: ${{ secrets.TAILOR_GITHUB_APP_PRIVATE_KEY }}
          commit_message: "chore: add changeset for renovate"
          files: |
            .changeset/renovate-${{ github.event.pull_request.number }}.md
          fail_on_self_push: false
