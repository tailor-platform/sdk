name: Publish Any Commit
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pkg-pr-new.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish: # zizmor: ignore[use-trusted-publishing] pkg.pr.new is a preview registry with no OIDC trusted publishing
    name: Publish preview packages
    # Skip re-runs triggered by tailor-pr-trigger bot (changeset/generate commits)
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout the repository
      pull-requests: write # pkg.pr.new posts the preview comment on the PR
    outputs:
      sdk_url: ${{ steps.urls.outputs.sdk_url }}
      create_sdk_url: ${{ steps.urls.outputs.create_sdk_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      # pkg.pr.new --compact URLs are deterministic from the abbreviated (7-char)
      # head SHA, so they can be computed BEFORE publishing. This lets us embed
      # the SDK preview URL into create-sdk's templates without publishing the
      # SDK first — both packages go out in a single `pkg-pr-new publish` call,
      # whereas separate publishes would each rewrite the PR comment (last wins).
      - name: Compute preview URLs
        id: urls
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          SDK_URL="https://pkg.pr.new/@tailor-platform/sdk@${SHORT_SHA}"
          CREATE_SDK_URL="https://pkg.pr.new/@tailor-platform/create-sdk@${SHORT_SHA}"
          {
            echo "sdk_url=$SDK_URL"
            echo "create_sdk_url=$CREATE_SDK_URL"
          } >> "$GITHUB_OUTPUT"
          echo "SDK preview: $SDK_URL"
          echo "create-sdk preview: $CREATE_SDK_URL"

      # `prepare-templates.js` rewrites template manifests but leaves the
      # lockfile untouched; pnpm 11's default `verifyDepsBeforeRun: install`
      # would then auto-install the pkg.pr.new tarball (not published yet) before
      # the build and hang the job. The build itself only needs create-sdk's own deps.
      - name: Build create-sdk with pkg.pr.new SDK
        env:
          TAILOR_SDK_VERSION: ${{ steps.urls.outputs.sdk_url }}
        run: |
          node packages/create-sdk/scripts/prepare-templates.js
          pnpm --config.verify-deps-before-run=false --filter @tailor-platform/create-sdk build

      - name: Publish to pkg.pr.new
        run: pnpm --config.verify-deps-before-run=false exec pkg-pr-new publish --pnpm --compact --commentWithSha --packageManager=pnpm "packages/sdk" "packages/create-sdk" # zizmor: ignore[use-trusted-publishing]

  init-smoke:
    needs: [publish]
    strategy:
      fail-fast: false
      matrix:
        # Minimal set covering all PM / runtime / Node axes.
        # pkg.pr.new is flaky, so we keep the matrix small.
        include:
          - runtime: node
            pm: pnpm
            node: 22
          - runtime: node
            pm: npm
            node: 24
          - runtime: node
            pm: yarn
            node: 22
          - runtime: bun
            pm: bun
            node: 24
          - runtime: bun
            pm: pnpm
            node: 24
    runs-on: ubuntu-latest
    name: Smoke (${{ matrix.runtime }}, ${{ matrix.pm }}, node${{ matrix.node }})
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: true
          run_install: false

      - name: Install Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Enable corepack
        run: corepack enable

      - name: Configure git for create-sdk
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "SDK CI"

      # npx is used regardless of matrix.pm: pkg.pr.new URLs are most reliable
      # via npx, and the PM matrix tests dependency resolution, not scaffolding.
      # CREATE_SDK_NO_INSTALL skips create-sdk's internal install step;
      # the "Install dependencies" step below tests resolution with the matrix PM.
      - name: Scaffold project
        env:
          CREATE_SDK_URL: ${{ needs.publish.outputs.create_sdk_url }}
          CREATE_SDK_NO_INSTALL: "1"
        run: |
          cd /tmp
          npx --yes --package="$CREATE_SDK_URL" create-sdk test-init-app --template hello-world

      - name: Verify generated files
        run: |
          test -f /tmp/test-init-app/tailor.config.ts
          test -f /tmp/test-init-app/package.json
          test -f /tmp/test-init-app/tsconfig.json

      - name: Verify SDK dependency uses pkg.pr.new URL
        env:
          EXPECTED_SDK_URL: ${{ needs.publish.outputs.sdk_url }}
        run: |
          SDK_VERSION=$(jq -r '.devDependencies["@tailor-platform/sdk"]' /tmp/test-init-app/package.json)
          echo "SDK version in generated project: $SDK_VERSION"
          echo "Expected SDK URL: $EXPECTED_SDK_URL"
          if [[ "$SDK_VERSION" != "$EXPECTED_SDK_URL" ]]; then
            echo "Error: SDK dependency should be '$EXPECTED_SDK_URL' but got '$SDK_VERSION'"
            exit 1
          fi

      # Lockfile-less install is expected: scaffolded projects have no lockfile.
      # Yarn 4 PnP is not tested here; this validates node_modules-based resolution.
      - name: Install dependencies
        working-directory: /tmp/test-init-app
        env:
          PM: ${{ matrix.pm }}
          EXPECTED_SDK_URL: ${{ needs.publish.outputs.sdk_url }}
        run: |
          # pnpm 11.6 matches the build-script allowlist against a dependency's
          # full resolved spec, so the name-keyed allowBuilds entry generated by
          # create-sdk does not cover the SDK installed from a pkg.pr.new tarball
          # URL. Add the exact "<name>@<url>" spec so the SDK postinstall runs.
          if [ "$PM" = "pnpm" ]; then
            printf '  "@tailor-platform/sdk@%s": true\n' "$EXPECTED_SDK_URL" >> pnpm-workspace.yaml
          fi
          $PM install

      - name: Verify SDK installed
        env:
          PM: ${{ matrix.pm }}
        run: |
          test -d /tmp/test-init-app/node_modules/@tailor-platform/sdk
          echo "SDK dependency successfully installed with $PM"

      - name: Verify SDK import (Node)
        if: matrix.runtime == 'node'
        working-directory: /tmp/test-init-app
        run: node -e "import('@tailor-platform/sdk').then(m => { console.log('SDK exports:', Object.keys(m).join(', ')); })"

      - name: Verify SDK import (Bun)
        if: matrix.runtime == 'bun'
        working-directory: /tmp/test-init-app
        run: bun -e "import('@tailor-platform/sdk').then(m => { console.log('SDK exports:', Object.keys(m).join(', ')); })"

      - name: Verify CLI bootstrap (Bun)
        if: matrix.runtime == 'bun'
        working-directory: /tmp/test-init-app
        run: bun node_modules/@tailor-platform/sdk/dist/cli/index.mjs --version

      - name: Typecheck
        working-directory: /tmp/test-init-app
        run: npx tsc --noEmit
