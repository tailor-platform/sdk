name: _test-slack-notify

# TEMPORARY: smoke-test the Slack failure notification used by release.yml.
# Delete this file after the dry run on the release-ci-slack-notify branch.

on:
  pull_request:
    paths:
      - .github/workflows/_test-slack-notify.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force failure
        run: |
          echo "intentionally failing to exercise the Slack notify step"
          exit 1

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          jq -n \
            --arg run "$RUN_URL" \
            --arg sha "$COMMIT_SHA" \
            --arg repo "$REPO" \
            '{text: ":test_tube: *Slack notify smoke test* in `\($repo)`\n*Run*: <\($run)|view logs>\n*Commit*: `\($sha[0:7])`"}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
