name: _debug-publish-env

# TEMPORARY: Verify that the publish environment ends up with npm 11.5+ so
# OIDC trusted publishing works in release.yml. Remove this file before merge.

on:
  pull_request:
    paths:
      - .github/actions/install-deps/action.yml
      - .github/workflows/release.yml
      - .github/workflows/_debug-publish-env.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Deps
        uses: ./.github/actions/install-deps

      - name: Setup npm registry for publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Print versions before npm upgrade
        run: |
          echo "BEFORE upgrade:"
          echo "  node: $(node -v)"
          echo "  npm:  $(npm -v)"
        shell: bash

      - name: Ensure npm 11+ for OIDC trusted publishing
        run: npm install -g npm@latest
        shell: bash

      - name: Print versions after npm upgrade
        run: |
          echo "AFTER upgrade:"
          echo "  node: $(node -v)"
          echo "  npm:  $(npm -v)"
        shell: bash
