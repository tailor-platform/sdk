name: _debug-publish-env

on:
  pull_request:
    paths:
      - .github/workflows/_debug-publish-env.yml
      - .github/workflows/release.yml
      - .github/actions/install-deps/**

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Deps
        uses: ./.github/actions/install-deps

      - name: Before — resolved tools
        run: |
          echo "::group::PATH"
          printf '%s\n' "$PATH" | tr ':' '\n' | nl
          echo "::endgroup::"
          echo "::group::which -a"
          which -a node || true
          which -a npm || true
          which -a pnpm || true
          echo "::endgroup::"
          echo "::group::versions"
          node -v || true
          npm -v || true
          pnpm -v || true
          echo "::endgroup::"
          echo "::group::pnpm prefixes"
          echo "PNPM_HOME=${PNPM_HOME:-<unset>}"
          pnpm root -g || true
          pnpm bin -g || true
          echo "::endgroup::"
        shell: bash

      - name: Install npm via pnpm
        run: pnpm add -g npm@latest
        shell: bash

      - name: After — resolved tools
        run: |
          echo "::group::PATH"
          printf '%s\n' "$PATH" | tr ':' '\n' | nl
          echo "::endgroup::"
          echo "::group::which -a npm"
          which -a npm
          echo "::endgroup::"
          echo "::group::npm version"
          npm -v
          echo "::endgroup::"
          echo "::group::pnpm global bin contents"
          ls -la "$(pnpm bin -g)" 2>/dev/null || true
          echo "::endgroup::"
        shell: bash
