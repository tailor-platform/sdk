name: _debug-publish-env

# TEMPORARY: Verify that the publish environment ends up with npm 11.5+ so
# OIDC trusted publishing works in release.yml. Remove this file before merge.

on:
  pull_request:
    paths:
      - .github/actions/install-deps/action.yml
      - .github/workflows/release.yml
      - .github/workflows/_debug-publish-env.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Deps
        uses: ./.github/actions/install-deps

      - name: Setup npm registry for publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Diagnostic — BEFORE npm upgrade
        run: |
          echo "=== versions ==="
          echo "  node:           $(node -v)  ($(which node))"
          echo "  npm:            $(npm -v)   ($(which npm))"
          echo
          echo "=== npm config ==="
          echo "  prefix:         $(npm config get prefix)"
          echo "  globalconfig:   $(npm config get globalconfig)"
          echo "  userconfig:     $(npm config get userconfig)"
          echo "  cache:          $(npm config get cache)"
          echo
          echo "=== PATH ==="
          echo "$PATH" | tr ':' '\n' | nl
          echo
          echo "=== prefix/bin contents ==="
          ls -la "$(npm config get prefix)/bin" 2>/dev/null || echo "  (no such directory)"
          echo
          echo "=== which -a npm ==="
          which -a npm
        shell: bash

      - name: Ensure npm 11+ for OIDC trusted publishing
        run: sudo npm install -g npm@latest --prefix=/usr/local
        shell: bash

      - name: Diagnostic — AFTER npm upgrade
        run: |
          echo "=== versions ==="
          echo "  node:           $(node -v)  ($(which node))"
          echo "  npm:            $(npm -v)   ($(which npm))"
          echo
          echo "=== npm config ==="
          echo "  prefix:         $(npm config get prefix)"
          echo
          echo "=== PATH ==="
          echo "$PATH" | tr ':' '\n' | nl
          echo
          echo "=== prefix/bin contents ==="
          ls -la "$(npm config get prefix)/bin" 2>/dev/null || echo "  (no such directory)"
          echo
          echo "=== which -a npm ==="
          which -a npm
          echo
          echo "=== resolved npm versions on PATH ==="
          for p in $(which -a npm); do
            echo "  $p -> $("$p" -v 2>/dev/null || echo "(failed)")"
          done
        shell: bash
