name: "Workspace Deploy Test"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout to run the paths filter
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changes:
              - .github/workflows/deploy.yml
              - .github/actions/**
              - example/**
              - packages/**
              - package.json
              - tsconfig.json
              - pnpm-workspace.yaml
              - pnpm-lock.yaml

  deploy:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            name: Linux
            slug: linux
          - os: windows-latest
            shell: pwsh
            name: Windows
            slug: win
    runs-on: ${{ matrix.os }}
    name: Deploy (${{ matrix.name }})
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Install aqua
        uses: ./.github/actions/install-aqua

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Login as machine user
        if: runner.os != 'Windows'
        run: pnpm tailor login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Create workspace
        if: runner.os != 'Windows'
        working-directory: example
        run: pnpm --silent tailor workspace create --name "sdk-ci-${RUN_ID}-${SLUG}" --region asia-northeast --json > workspace.json
        env:
          RUN_ID: ${{ github.run_id }}
          SLUG: ${{ matrix.slug }}
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ secrets.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ secrets.TAILOR_PLATFORM_FOLDER_ID }}

      - name: Set workspace ID
        if: runner.os != 'Windows'
        working-directory: example
        shell: bash
        run: |
          WORKSPACE_ID=$(jq -r '.id' workspace.json)
          echo "TAILOR_PLATFORM_WORKSPACE_ID=$WORKSPACE_ID" >> "$GITHUB_ENV"

      - name: Generate
        working-directory: example
        run: pnpm run generate

      - name: Deploy workspace
        working-directory: example
        run: pnpm run deploy
        env:
          TAILOR_DEPLOY_BUILD_ONLY: ${{ runner.os == 'Windows' && 'true' || '' }}

      - name: Verify all migrations applied
        if: runner.os != 'Windows'
        working-directory: example
        shell: bash
        run: |
          STATUS=$(pnpm --silent tailor tailordb migration status --namespace tailordb)
          echo "$STATUS"

          # Check for pending migrations
          if echo "$STATUS" | grep -q "Pending migrations:"; then
            echo "❌ ERROR: Pending migrations found after deploy"
            exit 1
          fi

          echo "✅ All migrations applied successfully"

      # A redeploy of unchanged code must be a no-op; anything else is
      # comparison drift (e.g. new proto fields read as updates on every run).
      - name: Dry run must report no changes
        if: runner.os != 'Windows'
        working-directory: example
        shell: bash
        run: |
          summary=$(pnpm --silent tailor deploy -c tailor.config.ts --dry-run --yes --json | tail -1 | jq -c '.summary')
          echo "Plan summary: $summary"
          if ! echo "$summary" | jq -e '.create == 0 and .update == 0 and .delete == 0 and .replace == 0' > /dev/null; then
            echo "::error::Dry run after deploy reported drift: $summary"
            echo "Re-running without --json for a readable diff:"
            pnpm tailor deploy -c tailor.config.ts --dry-run --yes
            exit 1
          fi

      - name: Validate seed data
        if: runner.os == 'Windows'
        working-directory: example
        run: pnpm run seed:validate

      - name: Seed data
        if: runner.os != 'Windows'
        working-directory: example
        run: |
          pnpm run seed:validate
          pnpm run seed
          pnpm run seed:truncate -y

      - name: Run e2e tests
        if: runner.os != 'Windows'
        working-directory: example
        run: pnpm test:e2e

      - name: Destroy workspace
        if: always() && runner.os != 'Windows'
        working-directory: example
        run: pnpm tailor workspace delete --workspace-id "$TAILOR_PLATFORM_WORKSPACE_ID" --yes

  deploy-result:
    name: deploy-result # required status check context (ruleset status_check_main) — keep equal to the job id
    needs: [changes, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.should_run }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          # Fail closed: if the paths-filter job itself failed, should_run is
          # empty and must not be mistaken for "no relevant changes".
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Changes job did not succeed (result=$CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" ]]; then
            echo "Skipped - no relevant changes"
            exit 0
          fi
          if [[ "$DEPLOY_RESULT" != "success" ]]; then
            echo "Deploy jobs failed"
            exit 1
          fi
          echo "All deploy jobs succeeded"
