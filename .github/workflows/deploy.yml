name: "Workspace Deploy Test"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: "false"
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            changes:
              - .github/workflows/deploy.yml
              - .github/actions/**
              - example/**
              - packages/**
              - package.json
              - pnpm-lock.yaml

  deploy:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            name: Linux
            slug: linux
          - os: windows-latest
            shell: pwsh
            name: Windows
            slug: win
    runs-on: ${{ matrix.os }}
    name: Deploy (${{ matrix.name }})
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: "false"

      - name: Install aqua
        uses: ./.github/actions/install-aqua

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Login as machine user
        if: runner.os != 'Windows'
        run: pnpm tailor-sdk login --machineuser
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Create workspace
        if: runner.os != 'Windows'
        working-directory: example
        run: pnpm --silent tailor-sdk workspace create --name "sdk-ci-${{ github.run_id }}-${{ matrix.slug }}" --region asia-northeast --json > workspace.json
        env:
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ secrets.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ secrets.TAILOR_PLATFORM_FOLDER_ID }}

      - name: Set workspace ID
        if: runner.os != 'Windows'
        working-directory: example
        shell: bash
        run: |
          WORKSPACE_ID=$(jq -r '.id' workspace.json)
          echo "TAILOR_PLATFORM_WORKSPACE_ID=$WORKSPACE_ID" >> "$GITHUB_ENV"

      - name: Generate
        working-directory: example
        run: pnpm run generate

      - name: Deploy workspace
        working-directory: example
        run: pnpm run deploy
        env:
          TAILOR_PLATFORM_SDK_BUILD_ONLY: ${{ runner.os == 'Windows' && 'true' || '' }}

      - name: Verify all migrations applied
        if: runner.os != 'Windows'
        working-directory: example
        shell: bash
        run: |
          STATUS=$(pnpm --silent tailor-sdk tailordb migration status --namespace tailordb)
          echo "$STATUS"

          # Check for pending migrations
          if echo "$STATUS" | grep -q "Pending migrations:"; then
            echo "❌ ERROR: Pending migrations found after deploy"
            exit 1
          fi

          echo "✅ All migrations applied successfully"

      - name: Validate seed data
        if: runner.os == 'Windows'
        working-directory: example
        run: pnpm run seed:validate

      - name: Seed data
        if: runner.os != 'Windows'
        working-directory: example
        run: |
          pnpm run seed:validate
          pnpm run seed
          pnpm run seed:truncate -y

      - name: Run e2e tests
        if: runner.os != 'Windows'
        working-directory: example
        run: pnpm test:e2e

      - name: Destroy workspace
        if: always() && runner.os != 'Windows'
        working-directory: example
        run: pnpm tailor-sdk workspace delete --workspace-id "${{ env.TAILOR_PLATFORM_WORKSPACE_ID }}" --yes

  deploy-result:
    needs: [changes, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.outputs.should_run }}" != "true" ]]; then
            echo "Skipped - no relevant changes"
            exit 0
          fi
          if [[ "${{ needs.deploy.result }}" != "success" ]]; then
            echo "Deploy jobs failed"
            exit 1
          fi
          echo "All deploy jobs succeeded"
