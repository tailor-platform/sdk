name: Skills Sync

on:
  pull_request:
    paths:
      - "packages/sdk/agent-skills/**"
      - ".github/workflows/skills-sync-check.yml"
      - ".github/scripts/sync-skills.sh"
  push:
    branches: [main]
    paths:
      - "packages/sdk/agent-skills/**"
      - ".github/scripts/sync-skills.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    name: Sync skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout the repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync skills to root
        run: bash .github/scripts/sync-skills.sh

      # On a pull request from this repository, the securefix workflow pushes
      # the synced files and CI runs again on the new head. This run is the
      # superseded one; pushes to main and pull requests from forks cannot be
      # fixed that way.
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::skills/ is out of sync with packages/sdk/agent-skills/. Run 'bash .github/scripts/sync-skills.sh' and commit the result."
            git status --porcelain --untracked-files=all
            git diff
            exit 1
          fi

      - name: Upgrade gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          # Upgrade to latest gh CLI (v2.90.0+ required for gh skill)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install gh -y
          gh --version

      - name: Validate skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run
