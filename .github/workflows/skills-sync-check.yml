name: Skills Sync

on:
  pull_request:
    paths:
      - "packages/sdk/skills/**"
      - ".github/workflows/skills-sync-check.yml"
  push:
    branches: [main]
    paths:
      - "packages/sdk/skills/**"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Sync skills to root
        run: |
          # Copy public skills from packages/sdk/skills/ to skills/
          # This enables distribution via `gh skill` and `npx skills`

          for skill_dir in packages/sdk/skills/*/; do
            skill_name=$(basename "$skill_dir")
            mkdir -p "skills/$skill_name"
            cp -r "$skill_dir"* "skills/$skill_name/"
            echo "✓ Synced $skill_name"
          done

      - name: Get changed files
        id: changes
        run: |
          # Include both modified and untracked files
          files=$(git status --porcelain | awk '{print $2}' | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.files != ''
        uses: suzuki-shunsuke/commit-action@f12e2d628a4ab72dcefe7890ae07e8dbf1e201b9 # v0.1.1
        with:
          app_id: ${{ secrets.TAILOR_GITHUB_APP_ID }}
          app_private_key: ${{ secrets.TAILOR_GITHUB_APP_PRIVATE_KEY }}
          commit_message: "chore: sync skills"
          files: ${{ steps.changes.outputs.files }}
