name: Skills Sync

on:
  pull_request:
    paths:
      - "packages/sdk/agent-skills/**"
      - ".github/workflows/skills-sync-check.yml"
  push:
    branches: [main]
    paths:
      - "packages/sdk/agent-skills/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    name: Sync skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout the repository

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Sync skills to root
        run: |
          # Copy public skills from packages/sdk/agent-skills/ to skills/.
          # The bundled copy lives under a non-`skills/` directory so that
          # `gh skill`'s recursive `**/skills/*/SKILL.md` match resolves to a
          # single entry (the repo-root mirror). Root `skills/` is what both
          # `gh skill install` and `npx skills add <repo>` actually pick up.

          for skill_dir in packages/sdk/agent-skills/*/; do
            skill_name=$(basename "$skill_dir")
            mkdir -p "skills/$skill_name"
            cp -r "$skill_dir"* "skills/$skill_name/"
            echo "✓ Synced $skill_name"
          done

      - name: Upgrade gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          # Upgrade to latest gh CLI (v2.90.0+ required for gh skill)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install gh -y
          gh --version

      - name: Validate skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Get changed files
        id: changes
        run: |
          # Include both modified and untracked files
          files=$(git status --porcelain | awk '{print $2}' | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.files != ''
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          app_id: ${{ secrets.TAILOR_GITHUB_APP_ID }}
          app_private_key: ${{ secrets.TAILOR_GITHUB_APP_PRIVATE_KEY }}
          commit_message: "chore: sync skills"
          files: ${{ steps.changes.outputs.files }}
