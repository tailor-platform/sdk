name: ERD Schema

on:
  push:
    branches: [main]
    paths:
      - packages/sdk/src/cli/commands/tailordb/erd/**
      - example/**
      - .github/workflows/erd-schema.yml
      - .github/scripts/erd-*.mjs
  pull_request:
    paths:
      - packages/sdk/src/cli/commands/tailordb/erd/**
      - example/**
      - .github/workflows/erd-schema.yml
      - .github/scripts/erd-*.mjs

permissions: {}

jobs:
  export:
    if: github.event_name == 'push'
    name: Export ERD schema (${{ matrix.namespace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout the repository
    concurrency:
      # Grouped per commit (not per ref) so a rapid follow-up push cannot cancel
      # an in-flight run and leave that commit without its own schema snapshot.
      group: erd-schema-export-${{ github.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        namespace: [tailordb, analyticsdb]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-deps

      # Stores this commit's ERD schema so the preview job below can reuse it
      # instead of rebuilding the base side itself.
      - name: Export ERD schema
        id: export
        env:
          NAMESPACE: ${{ matrix.namespace }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/erd-export-$NAMESPACE.log"
          echo "log_file=$log" >>"$GITHUB_OUTPUT"
          if ! (
            cd example
            pnpm exec tailor-sdk tailordb erd export --namespace "$NAMESPACE" --output "$RUNNER_TEMP/erd-export"
          ) >"$log" 2>&1; then
            cat "$log"
            if grep -q 'not found in local config.db' "$log"; then
              echo "ERD namespace '$NAMESPACE' not found; skipping export."
              echo "exported=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          elif [ -s "$log" ]; then
            cat "$log"
          fi

      # Always uploaded when the export succeeds, so the preview job can pick
      # any ancestor run as a base without checking which ones have it.
      - name: Upload ERD schema
        if: steps.export.outputs.exported != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erd-schema-${{ matrix.namespace }}
          path: ${{ runner.temp }}/erd-export/${{ matrix.namespace }}/dist/index.html
          if-no-files-found: ignore
          retention-days: 90

  preview:
    if: github.event_name == 'pull_request'
    name: Build ERD viewer preview (${{ matrix.namespace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout the repository
      actions: read # look up and download the export job's artifacts
    concurrency:
      group: erd-schema-preview-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Self-contained artifacts are uploaded one file per namespace because
        # `archive: false` only supports a single-file upload.
        namespace: [tailordb, analyticsdb]

    steps:
      - name: Checkout PR merge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # install-deps builds the SDK once, so the `tailor-sdk` CLI bin resolves.
      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Export head ERD schema
        id: head-export
        env:
          NAMESPACE: ${{ matrix.namespace }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/erd-head-$NAMESPACE.log"
          echo "log_file=$log" >>"$GITHUB_OUTPUT"
          if ! (
            cd example
            pnpm exec tailor-sdk tailordb erd export --namespace "$NAMESPACE" --output "$RUNNER_TEMP/erd-head"
          ) >"$log" 2>&1; then
            cat "$log"
            if grep -q 'not found in local config.db' "$log"; then
              echo "Head ERD namespace '$NAMESPACE' not found; rendering base objects as removed."
              echo "exported=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          elif [ -s "$log" ]; then
            cat "$log"
          fi

      # Always runs (even when head is missing, since removing a namespace
      # is inherently relevant) to compute both the relevance verdict and the
      # PR's fork point (compare's merge_base_commit) for the next step. See
      # erd-relevance.mjs.
      - name: Check relevance
        id: relevance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA_BASE: ${{ github.event.pull_request.base.sha }}
          SHA_HEAD: ${{ github.event.pull_request.head.sha }}
          LOG_FILE: ${{ steps.head-export.outputs.log_file }}
        run: node .github/scripts/erd-relevance.mjs

      # Reuses the schema the export job recorded for this PR's actual fork
      # point on its base branch (not just the base's moving tip, which would
      # mix in unrelated changes), instead of rebuilding the base side here.
      # See erd-find-base-run.mjs.
      - name: Find base run
        id: find-base-run
        if: steps.relevance.outputs.relevant != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORK_SHA: ${{ steps.relevance.outputs.fork_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node .github/scripts/erd-find-base-run.mjs

      - name: Download base schema
        id: base
        if: steps.relevance.outputs.relevant != 'false' && steps.find-base-run.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ steps.find-base-run.outputs.run_id }}"
          if gh run download "$run_id" --repo "${{ github.repository }}" \
            --name "erd-schema-${{ matrix.namespace }}" --dir "$RUNNER_TEMP/erd-base"; then
            echo "found=true" >>"$GITHUB_OUTPUT"
          else
            echo "ERD schema export run $run_id has no artifact for namespace '${{ matrix.namespace }}'; rendering current objects as added."
          fi

      - name: Render diff
        if: steps.relevance.outputs.relevant != 'false'
        env:
          NAMESPACE: ${{ matrix.namespace }}
          HEAD_MISSING: ${{ steps.head-export.outputs.exported == 'false' }}
          BASE_FOUND: ${{ steps.base.outputs.found }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/erd-preview"

          base_missing="true"
          [ "$BASE_FOUND" = "true" ] && base_missing="false"

          if [ "$HEAD_MISSING" = "true" ] && [ "$base_missing" = "true" ]; then
            echo "::error::ERD namespace '$NAMESPACE' was not found in head or the base export."
            exit 1
          fi

          diff_args=(--namespace "$NAMESPACE" --output "$RUNNER_TEMP/erd-preview/$NAMESPACE.html")
          if [ "$HEAD_MISSING" = "false" ]; then
            diff_args+=(--head-html "$RUNNER_TEMP/erd-head/$NAMESPACE/dist/index.html")
          fi
          if [ "$base_missing" = "false" ]; then
            diff_args+=(--base-html "$RUNNER_TEMP/erd-base/index.html")
          fi

          cd example
          pnpm exec tailor-sdk tailordb erd diff "${diff_args[@]}"

      # archive: false (upload-artifact v7+) keeps the file unzipped so the HTML
      # can be viewed directly in the browser from the run's artifact list. Only
      # a single file may be uploaded per artifact when archive is false.
      # https://github.blog/changelog/2026-02-26-github-actions-now-supports-uploading-and-downloading-non-zipped-artifacts/
      - name: Upload ERD viewer preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.namespace }}.html
          path: ${{ runner.temp }}/erd-preview/${{ matrix.namespace }}.html
          if-no-files-found: ignore
          archive: false
          retention-days: 7

  comment:
    name: Post preview links
    needs: preview
    # Skip on fork PRs, whose read-only token cannot post comments.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout the repository
      pull-requests: write # upsert the sticky preview comment
      actions: read # required to list the run's artifacts

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Upsert sticky preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node .github/scripts/erd-upsert-comment.mjs
