name: Lint / Format / Type Check

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install aqua
        uses: ./.github/actions/install-aqua

      - name: Install deps
        uses: ./.github/actions/install-deps

      # Install deps builds the SDK once so the CLI bin links resolve; build
      # the remaining packages here before downstream checks.
      - name: Build packages
        run: pnpm -r --filter '!@tailor-platform/sdk' run build

      - name: Run lint
        run: pnpm -r run lint

      - name: Run Vitest lint
        run: pnpm run lint:vitest

      # Ensure no executable files are present
      # refs: https://github.com/changesets/action/issues/523
      # Skip symlinks: `-x` follows symlinks to directories and reports them as executable.
      - name: Check for executable files
        run: |
          executable_files=$(git ls-files | while read -r file; do [ ! -L "$file" ] && [ -x "$file" ] && echo "$file"; done || true)
          if [ -n "$executable_files" ]; then
            echo "Error: Found executable files (changesets/action does not support executable files):"
            echo "$executable_files"
            exit 1
          fi

      - name: Check format
        run: pnpm format:check

      - name: Generate code
        run: pnpm -r run generate

      - name: Check type by tsgo
        run: pnpm -r run typecheck:go

      - name: Check type
        run: pnpm -r run typecheck

      - name: Check unused code (knip)
        run: pnpm -r run knip

      - name: Check package exports (publint)
        run: pnpm -r run publint

      # zod must not leak into user-facing entry points (operates on dist/,
      # already built by install-deps).
      - name: Check zod isolation
        run: pnpm -r run check:zod-isolation

      - name: Check import cycles
        run: pnpm -r run check:import-cycles
