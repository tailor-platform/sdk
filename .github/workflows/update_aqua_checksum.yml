name: update aqua-checksums.json

on:
  pull_request:
    paths:
      - aqua.yaml
      - aqua-checksums.json

permissions: {}

jobs:
  update-aqua-checksums:
    name: Update aqua-checksums.json
    # Pull requests from forks get no secrets, so they cannot request a fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout the PR head

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default ref on pull_request events is the merge ref, which would
          # compute the checksums from base-branch changes the PR head lacks.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install aqua
        uses: $/.github/actions/install-aqua

      - name: Update aqua-checksums.json
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
        run: aqua update-checksum --prune

      # The securefix server pushes the commit with a GitHub App token, so CI
      # runs again on the new head. This step fails once it has sent the
      # request, which only marks this superseded run.
      - name: Commit changes
        uses: csm-actions/securefix-action@ada5710dddfb54a0a55109e320830a757472ce04 # v0.6.4
        with:
          action: client
          app_id: ${{ vars.SECUREFIX_CLIENT_APP_ID }}
          app_private_key: ${{ secrets.SECUREFIX_CLIENT_APP_PRIVATE_KEY }}
          server_repository: securefix-server
          commit_message: "chore: update aqua-checksums.json"
