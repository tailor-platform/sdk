name: Template Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - packages/**
      - example/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/template-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-tests:
    # Skip re-runs triggered by tailor-pr-trigger bot (changeset/generate commits)
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Template tests (${{ matrix.os }})
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Typecheck templates
        run: >-
          pnpm -r
          --filter "./packages/create-sdk/templates/*"
          run typecheck

      - name: Run template unit tests
        run: >-
          pnpm -r
          --filter "./packages/create-sdk/templates/tailordb"
          --filter "./packages/create-sdk/templates/resolver"
          --filter "./packages/create-sdk/templates/workflow"
          --filter "./packages/create-sdk/templates/executor"
          --filter "./packages/create-sdk/templates/generators"
          run test:unit
