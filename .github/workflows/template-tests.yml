name: Template Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - packages/**
      - example/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/template-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-unit-tests:
    # Skip re-runs triggered by tailor-pr-trigger bot (changeset/generate commits)
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        template:
          - tailordb
          - resolver
          - workflow
          - executor
          - generators
    runs-on: ${{ matrix.os }}
    name: Template unit (${{ matrix.template }}, ${{ matrix.os }})
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Build SDK
        run: pnpm -C packages/sdk build

      - name: Typecheck template
        working-directory: packages/create-sdk/templates/${{ matrix.template }}
        run: pnpm typecheck

      - name: Run unit tests
        working-directory: packages/create-sdk/templates/${{ matrix.template }}
        run: pnpm test:unit

  template-typecheck:
    # Skip re-runs triggered by tailor-pr-trigger bot (changeset/generate commits)
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        template:
          - hello-world
          - inventory-management
          - multi-application
          - static-web-site
    runs-on: ${{ matrix.os }}
    name: Template typecheck (${{ matrix.template }}, ${{ matrix.os }})
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Build SDK
        run: pnpm -C packages/sdk build

      - name: Typecheck template
        working-directory: packages/create-sdk/templates/${{ matrix.template }}
        run: pnpm typecheck
