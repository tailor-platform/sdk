name: Template Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        template:
          - tailordb
          - resolver
          - workflow
          - executor
          - generators
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Build SDK
        run: pnpm -C packages/sdk build

      - name: Typecheck template
        working-directory: packages/create-sdk/templates/${{ matrix.template }}
        run: pnpm typecheck

      - name: Run unit tests
        working-directory: packages/create-sdk/templates/${{ matrix.template }}
        run: pnpm test:unit

  template-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        template:
          - hello-world
          - inventory-management
          - multi-application
          - static-web-site
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Build SDK
        run: pnpm -C packages/sdk build

      - name: Typecheck template
        working-directory: packages/create-sdk/templates/${{ matrix.template }}
        run: pnpm typecheck
