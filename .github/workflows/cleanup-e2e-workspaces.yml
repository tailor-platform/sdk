name: "Cleanup e2e workspaces"

on:
  schedule:
    # Daily at 18:00 UTC (03:00 JST) — outside normal CI hours
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List candidates without deleting"
        type: boolean
        default: false

concurrency:
  group: cleanup-e2e-workspaces
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup:
    name: Cleanup e2e workspaces
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repository
      actions: read # query workflow run status to reclaim orphaned workspaces
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Install deps
        uses: $/.github/actions/install-deps

      - name: Login as machine user
        run: pnpm tailor login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: List e2e workspaces
        working-directory: packages/sdk
        run: |
          pnpm --silent tailor workspace list --json > /tmp/workspaces.json
          jq -r '.[] | select(.name | test("^(e2e-ws-|template-e2e-|sdk-ci-)")) | "\(.id)\t\(.name)"' \
            /tmp/workspaces.json > /tmp/e2e-workspaces.tsv
          echo "e2e workspace candidates:"
          cat /tmp/e2e-workspaces.tsv || true

      - name: Select workspaces whose GitHub Actions run has finished
        id: select
        working-directory: packages/sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          skipped=0
          : > /tmp/e2e-doomed.txt
          if [[ ! -s /tmp/e2e-workspaces.tsv ]]; then
            echo "No e2e workspaces found."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Workspace names embed GITHUB_RUN_ID (numeric) as the first numeric segment after the prefix:
          #   e2e-ws-<run_id>-<testRunId>, template-e2e-<run_id>,
          #   sdk-ci-<run_id>-<slug>, sdk-ci-migration-<run_id>
          # testRunId is base36 (`Date.now().toString(36)`), so a purely-numeric leading segment is the run id.
          # The `sdk-ci-migration-` alternative must precede `sdk-ci-` so the longer prefix wins.
          while IFS=$'\t' read -r id name; do
            [[ -z "$id" ]] && continue
            run_id="$(printf '%s' "$name" | sed -nE 's/^(e2e-ws-|template-e2e-|sdk-ci-migration-|sdk-ci-)([0-9]+).*/\2/p')"
            if [[ -z "$run_id" ]]; then
              echo "skip    $name  (no run id in name)"
              skipped=$((skipped + 1))
              continue
            fi

            : > /tmp/gh.err
            status="$(gh run view "$run_id" --json status --jq .status 2>/tmp/gh.err || true)"
            if [[ -z "$status" ]] && grep -qiE 'could not find|no run found|HTTP 404' /tmp/gh.err; then
              # Run has been pruned (past retention). Treat as completed so the orphan is reclaimed.
              status="missing"
            fi

            case "$status" in
              completed|missing)
                echo "select  $name  (run $run_id status=$status)"
                printf '%s\n' "$name" >> /tmp/e2e-doomed.txt
                ;;
              "")
                echo "skip    $name  (gh status unknown: $(tr -d '\n' < /tmp/gh.err))"
                skipped=$((skipped + 1))
                ;;
              *)
                echo "skip    $name  (run $run_id status=$status)"
                skipped=$((skipped + 1))
                ;;
            esac
          done < /tmp/e2e-workspaces.tsv

          count=$(wc -l < /tmp/e2e-doomed.txt | tr -d ' ')
          echo ""
          echo "Result: selected=$count, skipped=$skipped"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Delete the selected workspaces
        if: steps.select.outputs.count != '0'
        working-directory: packages/sdk
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -u
          # Each --name is anchored to the whole workspace name by the CLI, so passing one
          # per selected name deletes exactly the workspaces the select step chose. The
          # names come from `workspace list` and stay inside the platform's own charset
          # (lowercase alphanumerics and hyphens), so they carry no regex metacharacters;
          # --limit pins the expected count so a filter that widened unexpectedly aborts
          # before deleting anything.
          count=$(wc -l < /tmp/e2e-doomed.txt | tr -d ' ')
          if grep -qvE '^[a-z0-9-]+$' /tmp/e2e-doomed.txt; then
            echo "::error::A selected workspace name left the expected charset; refusing to build a filter from it."
            exit 1
          fi
          name_args=()
          while IFS= read -r name; do
            name_args+=(--name "$name")
          done < /tmp/e2e-doomed.txt
          if [[ "${#name_args[@]}" -ne $((count * 2)) ]]; then
            echo "::error::Built ${#name_args[@]} --name arguments for $count selected workspaces."
            exit 1
          fi

          # --older-than 1s excludes a workspace created during this very step;
          # every candidate here belongs to a finished run and is far older.
          if [[ "$DRY_RUN" == "true" ]]; then
            pnpm --silent tailor workspace prune \
              "${name_args[@]}" --older-than 1s --limit "$count" --dry-run --yes
          else
            pnpm --silent tailor workspace prune \
              "${name_args[@]}" --older-than 1s --limit "$count" --yes
          fi
