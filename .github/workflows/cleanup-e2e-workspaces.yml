name: "Cleanup e2e workspaces"

on:
  schedule:
    # Daily at 18:00 UTC (03:00 JST) — outside normal CI hours
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List candidates without deleting"
        type: boolean
        default: false
  # TEMP: enable PR-driven runs so this workflow can be exercised before merge.
  # Remove this `pull_request` trigger before merging.
  pull_request:
    paths:
      - .github/workflows/cleanup-e2e-workspaces.yml

concurrency:
  group: cleanup-e2e-workspaces
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: "false"

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Login as machine user
        run: pnpm tailor-sdk login --machineuser
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: List e2e workspaces
        working-directory: packages/sdk
        run: |
          pnpm --silent tailor-sdk workspace list --json > /tmp/workspaces.json
          jq -r '.[] | select(.name | test("^(e2e-ws-|mig-ws-|template-e2e-)")) | "\(.id)\t\(.name)"' \
            /tmp/workspaces.json > /tmp/e2e-workspaces.tsv
          echo "e2e workspace candidates:"
          cat /tmp/e2e-workspaces.tsv || true

      - name: Delete workspaces whose GitHub Actions run has finished
        working-directory: packages/sdk
        env:
          GH_TOKEN: ${{ github.token }}
          # PR-driven runs (Phase A verification) are always dry-run.
          DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && 'true' || 'false' }}
        run: |
          set -u
          deleted=0
          skipped=0
          failed=0
          if [[ ! -s /tmp/e2e-workspaces.tsv ]]; then
            echo "No e2e workspaces found."
            exit 0
          fi

          # Workspace names embed GITHUB_RUN_ID (numeric) as the first segment after the prefix:
          #   e2e-ws-<run_id>-<testRunId>, mig-ws-<run_id>-<testRunId>, template-e2e-<run_id>
          # testRunId is base36 (`Date.now().toString(36)`), so a purely-numeric leading segment is the run id.
          while IFS=$'\t' read -r id name; do
            [[ -z "$id" ]] && continue
            run_id="$(printf '%s' "$name" | sed -nE 's/^(e2e-ws-|mig-ws-|template-e2e-)([0-9]+).*/\2/p')"
            if [[ -z "$run_id" ]]; then
              echo "skip    $name  (no run id in name)"
              skipped=$((skipped + 1))
              continue
            fi

            : > /tmp/gh.err
            status="$(gh run view "$run_id" --json status --jq .status 2>/tmp/gh.err || true)"
            if [[ -z "$status" ]] && grep -qiE 'could not find|no run found|HTTP 404' /tmp/gh.err; then
              # Run has been pruned (past retention). Treat as completed so the orphan is reclaimed.
              status="missing"
            fi

            case "$status" in
              completed|missing)
                if [[ "$DRY_RUN" == "true" ]]; then
                  echo "dry     $name  (run $run_id status=$status)"
                else
                  echo "delete  $name  (run $run_id status=$status)"
                  if pnpm --silent tailor-sdk workspace delete --workspace-id "$id" --yes; then
                    deleted=$((deleted + 1))
                  else
                    failed=$((failed + 1))
                  fi
                fi
                ;;
              "")
                echo "skip    $name  (gh status unknown: $(tr -d '\n' < /tmp/gh.err))"
                skipped=$((skipped + 1))
                ;;
              *)
                echo "skip    $name  (run $run_id status=$status)"
                skipped=$((skipped + 1))
                ;;
            esac
          done < /tmp/e2e-workspaces.tsv

          echo ""
          echo "Result: deleted=$deleted, skipped=$skipped, failed=$failed"
          if [[ "$failed" -gt 0 ]]; then
            exit 1
          fi
