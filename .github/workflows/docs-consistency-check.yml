name: Docs Quality & Consistency Check

on:
  pull_request:
    types: [ready_for_review, labeled]
    paths:
      - "packages/sdk/src/**"
      - "packages/sdk/docs/**"
      - "example/**"
      - "AGENTS.md"
      - "CLAUDE.md"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  docs-consistency:
    if: >
      github.event.action == 'ready_for_review'
      || (github.event.action == 'labeled' && github.event.label.name == 'docs-check')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check docs-implementation consistency
        uses: anthropics/claude-code-action@593d7a5c4e0073569f74772c2b7b64c30ec14707 # v1.0.141
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            # Documentation Quality & Consistency Check

            Review the PR changes along two axes:

            1. **Consistency** — documentation stays accurate with the implementation (no factual mismatches).
            2. **Reader perspective** — user-facing docs describe only what an SDK *user* needs, and do not leak SDK/Platform internal implementation details.

            ## Target Documentation

            - `packages/sdk/docs/cli-reference.md` - CLI reference
            - `packages/sdk/docs/cli/*.md` - CLI subcommand docs
            - `packages/sdk/docs/services/*.md` - Service documentation
            - `packages/sdk/docs/configuration.md` - Configuration reference
            - `AGENTS.md` - Developer guide and code patterns
            - `CLAUDE.md` - Compatibility adapter for agent instructions
            - `example/` - Working example code
            - Published JSDoc on **exported** symbols in `packages/sdk/src/**` - shipped to users' IDEs via the package's `.d.ts` files

            ### Audience scope (important)

            - `packages/sdk/docs/**` ships inside the published npm package (`@tailor-platform/sdk`), `example/` is read by SDK users, and JSDoc on exported symbols reaches users through editor tooltips/autocompletion. Apply **both** the Consistency and Reader-Perspective checks to these.
            - `AGENTS.md` / `CLAUDE.md` are developer/contributor instructions, **not** user-facing. Apply **only** the Consistency check to them; do **not** raise reader-perspective issues for them.
            - JSDoc on non-exported / internal symbols is not user-facing — skip it for the reader-perspective check.

            ## Investigation Steps

            ### 1. Retrieve PR Changes

            ```bash
            gh pr view ${{ env.PR_NUMBER }} --json title,body,files
            gh pr diff ${{ env.PR_NUMBER }}
            ```

            ### 2. Classify Changes

            Determine which categories the PR changes fall into:

            - **CLI commands/options**: Added, changed, or removed commands or flags
            - **Public API**: New or modified exported functions, types, or interfaces
            - **Configuration**: Changes to config file schema (`defineConfig`, `defineAuth`, etc.)
            - **Executors/Resolvers/Workflows**: Changes to creation APIs or trigger types
            - **Example code**: Changes that should reflect current best practices

            ### 3. Cross-Reference Documentation (Consistency)

            For each changed area, check the corresponding documentation:

            #### CLI Changes
            - Read `packages/sdk/docs/cli-reference.md` and relevant `packages/sdk/docs/cli/*.md` files
            - Verify all CLI commands, options, and their descriptions match the implementation
            - Compare source code command definitions with docs

            #### API / Config Changes
            - Read `packages/sdk/docs/services/*.md` and `packages/sdk/docs/configuration.md`
            - Verify documented function signatures, parameters, and return types match the implementation
            - Check if new exports are documented

            #### Pattern / Example Changes
            - Read relevant files in `example/` directory
            - Verify examples use current API patterns (not deprecated ones)
            - Check `AGENTS.md` "Code Patterns" and "Non-obvious Rules and Gotchas" sections

            #### Reverse Check (docs changed but implementation not updated)
            - If documentation was changed, verify the implementation matches
            - Look for docs describing features that don't exist yet or have been removed

            ### 4. Reader-Perspective Review (`packages/sdk/docs/**`, `example/`, and published JSDoc)

            For changed user-facing docs, check that they describe only what an SDK *user* needs and do not leak SDK/Platform internals. Flag the following:

            - **Internal implementation details**: internal API / RPC / method / class names (e.g. `TestExecScript`), transport or wire-format terms the user never types (`proto` / `protobuf` / `gRPC` / `unary RPC` / `streaming method`), internal layer structure (`parser` / `configure` / `types` modules), runtime-internal delegation mechanics, internal wrapping behavior, internal on-disk layout or sanitization algorithms (e.g. how `.tailor-sdk/<id>` names are derived), and AST / code-injection internals.
            - **JSDoc duplication (SSOT)**: detailed API reference — full interface/type definitions, exhaustive field tables — copied into prose. JSDoc/IDE autocompletion is the single source of truth; the docs should explain intent and link out, not mirror every field.
            - **Private references**: links to or mentions of private/internal repositories or internal issue trackers (e.g. a `<org>/<private-repo>` link or an `<org>/<tracker>#NNN` reference).
            - **Wrong-audience notes**: content addressed to someone other than the reader (e.g. a "Note for Platform developers" block inside user docs).

            **Do NOT over-prune.** A reference to internal mechanics is acceptable when the reader must understand it to use the API correctly — for example, the workflow *deterministic execution* requirement, or why `migrate.ts` sees a particular schema state. Only flag descriptions that exist purely for internal convenience or naming and that a user never acts on.

            ### 5. Post Results

            Search for an existing review summary and update it, or create a new review.

            ```bash
            REVIEW_ID=$(gh api --paginate repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews \
              --jq '.[] | select((.body // "") | contains("<!-- docs-consistency-check -->")) | select(.state != "DISMISSED") | .id' \
              | tail -n 1)
            ```

            **If any issues are found** (consistency and/or reader-perspective), post a review summary in this format. Omit a subsection if it has no findings:

            ```markdown
            ## 📖 Docs Quality & Consistency Check

            ### ⚠️ Consistency Issues

            | File | Issue | Suggested Fix |
            |------|-------|---------------|
            | `path/to/doc.md` | Description of mismatch with the implementation | What should be updated |

            ### 📝 Reader-Perspective Issues

            | File | Issue | Suggested Fix |
            |------|-------|---------------|
            | `packages/sdk/docs/...` | Internal detail / JSDoc duplication / private reference that a user does not need | What to remove or rephrase |

            ### Details

            (For each issue, explain the mismatch — what the implementation does vs what the docs say — or
            why the flagged content is internal-only, with specific file paths and line numbers.)

            ### Recommended Actions
            - ...

            > Re-run this check by adding the `docs-check` label to the PR.

            ---
            <!-- docs-consistency-check -->
            ```

            **If no issues are found**, post a review summary in this format:

            ```markdown
            ## 📖 Docs Quality & Consistency Check

            ✅ Docs are consistent with the implementation and contain no user-facing internal-detail leaks.

            **Checked areas:**
            - (list what was checked)

            > Re-run this check by adding the `docs-check` label to the PR.

            ---
            <!-- docs-consistency-check -->
            ```

            Store the selected markdown in `REVIEW_BODY`. Use `gh api --method PUT` to
            update if `REVIEW_ID` is set. Otherwise use `gh api --method POST` with
            `event=COMMENT` to create a new pull request review. Use `COMMENT` so the
            review does not affect PR mergeability. Do not use `APPROVE`,
            `REQUEST_CHANGES`, or `gh pr comment`.

            ```bash
            if [ -n "$REVIEW_ID" ]; then
              gh api --method PUT "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews/$REVIEW_ID" \
                -f body="$REVIEW_BODY"
            else
              gh api --method POST "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews" \
                -f event=COMMENT \
                -f body="$REVIEW_BODY"
            fi
            ```

            ## Important Notes
            - The PR branch is already checked out
            - Always post results as a pull request review summary using `gh` commands, not as a conversational response
            - Be specific: include file paths and line numbers for every issue
            - Only flag real issues, not stylistic differences
            - Reader-perspective issues apply **only** to user-facing documentation: `packages/sdk/docs/**`, `example/`, and published JSDoc on exported symbols in `packages/sdk/src/**`. Do **not** raise reader-perspective issues for `AGENTS.md` / `CLAUDE.md` (developer-facing) or for non-exported / internal code.
            - Do not flag internal mechanics that a user must understand to use the API correctly (see the note in 3.5)
            - If unsure whether something is an issue, mention it with a note that it may be intentional

          claude_args: |
            --model claude-sonnet-4-5-20250929
            --allowedTools "Bash(gh pr:*),Bash(gh api:*),Read,Glob,Grep"

      - name: Remove trigger label
        if: always() && github.event.action == 'labeled' && github.event.label.name == 'docs-check'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --remove-label docs-check
