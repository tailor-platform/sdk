name: Generate

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    # No bot-skip guard here (unlike test.yml): generate must re-run on
    # tailor-pr-trigger[bot] commits so the cross-platform consistency check
    # validates the generated files the bot just committed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            changes:
              - .github/workflows/generate.yml
              - .github/actions/**
              - packages/**
              - example/**
              - package.json
              - tsconfig.json
              - pnpm-workspace.yaml
              - pnpm-lock.yaml

  generate:
    name: generate # required status check context (ruleset status_check_main) — keep equal to the job id
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run generate
        run: pnpm -r run generate

      # The "expected" generator fixtures come from a separate config
      # (tailor.config.expected.ts) that `pnpm generate` and CI tests don't
      # cover; regenerate them so the commit step below catches any drift.
      - name: Update generator expected fixtures
        run: pnpm --filter example run test:generator:update-expects

      - name: Get changed files
        id: changes
        run: |
          # Include untracked files too, so newly generated fixtures (e.g. a
          # schema for a new type) are committed and not silently dropped.
          files=$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.files != ''
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          app_id: ${{ secrets.TAILOR_GITHUB_APP_ID }}
          app_private_key: ${{ secrets.TAILOR_GITHUB_APP_PRIVATE_KEY }}
          commit_message: "chore: run generate"
          files: ${{ steps.changes.outputs.files }}

  generate-cross-platform:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: Generate consistency (${{ matrix.name }})
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Configure git for Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run generate
        run: pnpm -r run generate

      - name: Check for uncommitted changes
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.name }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files differ between $PLATFORM_NAME and committed files"
            echo ""
            echo "Changed files:"
            git status --porcelain
            echo ""
            echo "Diff:"
            git diff
            exit 1
          fi
          echo "No differences found - generate output is consistent across platforms"

  generate-summary:
    name: generate-summary # required status check context (ruleset status_check_main) — keep equal to the job id
    needs: [changes, generate, generate-cross-platform]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.should_run }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          GENERATE_CROSS_PLATFORM_RESULT: ${{ needs.generate-cross-platform.result }}
        run: |
          # Fail closed: if the paths-filter job itself failed, should_run is
          # empty and must not be mistaken for "no relevant changes".
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Changes job did not succeed (result=$CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" ]]; then
            echo "Skipped - no relevant changes"
            exit 0
          fi
          if [[ "$GENERATE_RESULT" != "success" ]]; then
            echo "Generate job failed"
            exit 1
          fi
          if [[ "$GENERATE_CROSS_PLATFORM_RESULT" != "success" ]]; then
            echo "Cross-platform generate jobs failed"
            exit 1
          fi
          echo "All generate jobs succeeded"
