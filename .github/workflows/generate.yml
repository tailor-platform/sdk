name: Generate

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run generate
        run: pnpm -r run generate

      # The "expected" generator fixtures come from a separate config
      # (tailor.config.expected.ts) that `pnpm generate` and CI tests don't
      # cover; regenerate them so the commit step below catches any drift.
      - name: Update generator expected fixtures
        run: pnpm --filter example run test:generator:update-expects

      - name: Get changed files
        id: changes
        run: |
          files=$(git diff --name-only | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.files != ''
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          app_id: ${{ secrets.TAILOR_GITHUB_APP_ID }}
          app_private_key: ${{ secrets.TAILOR_GITHUB_APP_PRIVATE_KEY }}
          commit_message: "chore: run generate"
          files: ${{ steps.changes.outputs.files }}

  generate-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: Generate consistency (${{ matrix.name }})
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Configure git for Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run generate
        run: pnpm -r run generate

      - name: Check for uncommitted changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files differ between ${{ matrix.name }} and committed files"
            echo ""
            echo "Changed files:"
            git status --porcelain
            echo ""
            echo "Diff:"
            git diff
            exit 1
          fi
          echo "No differences found - generate output is consistent across platforms"

  generate-summary:
    needs: [generate, generate-cross-platform]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.generate.result }}" != "success" ]]; then
            echo "Generate job failed"
            exit 1
          fi
          if [[ "${{ needs.generate-cross-platform.result }}" != "success" ]]; then
            echo "Cross-platform generate jobs failed"
            exit 1
          fi
          echo "All generate jobs succeeded"
