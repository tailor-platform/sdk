name: Lockfile Runtime Diff

# Tests lockfile-runtime-diff.mjs, which the Renovate changeset automation and
# skip-changeset-check action rely on to tell whether a lockfile change
# touched a published package's runtime dependencies. The script has no
# dependencies of its own, so this only needs a checkout.
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/lockfile-runtime-diff.mjs
      - .github/scripts/lockfile-runtime-diff.test.mjs
      - .github/workflows/lockfile-runtime-diff.yml
  pull_request:
    paths:
      - .github/scripts/lockfile-runtime-diff.mjs
      - .github/scripts/lockfile-runtime-diff.test.mjs
      - .github/workflows/lockfile-runtime-diff.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test lockfile-runtime-diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: node --test .github/scripts/lockfile-runtime-diff.test.mjs
