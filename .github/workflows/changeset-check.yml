name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changeset-check:
    name: Changeset check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout and diff the PR

    if: >-
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.ref != 'changeset-release/main' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            changeset:
              - '.changeset/*.md'
              - '!.changeset/README.md'
            packages:
              - 'packages/sdk/**'
              - 'packages/create-sdk/**'
              - 'packages/tailor-proto/**'

      - name: Fail if no changeset
        if: steps.filter.outputs.packages == 'true' && steps.filter.outputs.changeset != 'true'
        run: |
          echo "::error::No changeset file found in this PR."
          echo ""
          echo "Please add a changeset file using: pnpm changeset"
          echo ""
          echo "If this PR does not require a changeset (e.g., docs-only changes),"
          echo "add 'skip-changeset' label to this PR."
          exit 1

      - name: Install Deps
        if: steps.filter.outputs.changeset == 'true'
        uses: ./.github/actions/install-deps

      - name: Validate changeset packages
        if: steps.filter.outputs.changeset == 'true'
        run: pnpm changeset status --since origin/main
