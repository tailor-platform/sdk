name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changeset-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >-
      github.event.pull_request.user.login != 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            changeset:
              - '.changeset/*.md'
              - '!.changeset/README.md'
            packages:
              - 'packages/sdk/**'
              - 'packages/create-sdk/**'
              - 'packages/tailor-proto/**'

      - name: Fail if no changeset
        if: steps.filter.outputs.packages == 'true' && steps.filter.outputs.changeset != 'true'
        run: |
          echo "::error::No changeset file found in this PR."
          echo ""
          echo "Please add a changeset file using: pnpm changeset"
          echo ""
          echo "If this PR does not require a changeset (e.g., docs-only changes),"
          echo "add 'skip-changeset' label to this PR."
          exit 1

      - name: Setup pnpm
        if: steps.filter.outputs.changeset == 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          standalone: true
          run_install: false

      - name: Install Node.js
        if: steps.filter.outputs.changeset == 'true'
        run: pnpm env use --global 24
        shell: bash

      - name: Install dependencies
        if: steps.filter.outputs.changeset == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate changeset packages
        if: steps.filter.outputs.changeset == 'true'
        run: pnpm changeset status
