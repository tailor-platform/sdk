name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changeset-check:
    name: Changeset check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout and diff the PR

    if: >-
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.ref != 'changeset-release/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Under the default `some`, a '!' pattern matches every other file.
          predicate-quantifier: some-with-excludes
          filters: |
            changeset:
              - '.changeset/*.md'
              - '!.changeset/README.md'
            packages:
              - 'packages/sdk/**'
              - 'packages/create-sdk/**'
              - 'packages/sdk-plugin-seed/**'
              - 'packages/sdk-plugin-setup/**'
              - 'packages/eslint-plugin-sdk/**'
              - 'packages/sdk-codemod/**'
              - 'packages/sdk-plugin-tailordb-erd/**'
              - 'packages/sdk-plugin-frontend/**'
              - 'packages/tailor-proto/**'
            published_docs:
              - 'packages/sdk/docs/**'
              - '!packages/sdk/docs/**/*.*.md'
              - 'packages/sdk/agent-skills/**'
              - 'packages/create-sdk/templates/*/README.md'
              - 'packages/*/README.md'

      - name: Fail if published docs change without a changeset
        if: >-
          steps.filter.outputs.published_docs == 'true' && steps.filter.outputs.changeset != 'true'
        run: |
          echo "::error::This PR changes documentation a package publishes but has no changeset."
          echo ""
          echo "Add a changeset (patch if only documentation changed) so the next release ships it: pnpm changeset"
          echo "The 'skip-changeset' label does not apply to published documentation."
          exit 1

      - name: Fail if no changeset
        if: >-
          steps.filter.outputs.packages == 'true' && steps.filter.outputs.changeset != 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
        run: |
          echo "::error::No changeset file found in this PR."
          echo ""
          echo "Please add a changeset file using: pnpm changeset"
          echo ""
          echo "If this PR does not require a changeset (e.g., test-only changes),"
          echo "add 'skip-changeset' label to this PR."
          exit 1

      - name: Install Deps
        if: steps.filter.outputs.changeset == 'true'
        uses: $/.github/actions/install-deps

      - name: Validate changeset packages
        if: steps.filter.outputs.changeset == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: pnpm changeset status --since "origin/$BASE_REF"

      # `changeset status` only validates the plan; it doesn't run the JSON
      # edits that `changeset version` performs during the Release workflow.
      # Actually running `version` here catches crashes (e.g. a package.json
      # missing a "version" key) before they surface post-merge on main.
      - name: Dry-run changeset version
        if: steps.filter.outputs.changeset == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version
          git checkout -- .
