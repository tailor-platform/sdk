name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changeset-check:
    name: Changeset check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout and diff the PR

    if: >-
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.ref != 'changeset-release/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Under the default `some`, a '!' pattern matches every other file.
          predicate-quantifier: some-with-excludes
          filters: |
            changeset:
              - '.changeset/*.md'
              - '!.changeset/README.md'
            packages:
              - 'packages/sdk/**'
              - 'packages/create-sdk/**'
              - 'packages/sdk-plugin-seed/**'
              - 'packages/sdk-plugin-setup/**'
              - 'packages/eslint-plugin-sdk/**'
              - 'packages/sdk-codemod/**'
              - 'packages/sdk-plugin-tailordb-erd/**'
              - 'packages/sdk-plugin-frontend/**'
              - 'packages/tailor-proto/**'
            codemod_source:
              - 'packages/sdk-codemod/src/**'
              - 'packages/sdk-codemod/codemods/**'
              - '!packages/sdk-codemod/**/*.test.ts'
              - '!packages/sdk-codemod/src/__snapshots__/**'
              - '!packages/sdk-codemod/src/test-helpers/**'
              - '!packages/sdk-codemod/codemods/**/tests/**'
            package_source:
              - 'packages/sdk/src/**'
              - 'packages/sdk/bin/**'
              - 'packages/sdk/postinstall.mjs'
              - 'packages/create-sdk/src/**'
              - 'packages/create-sdk/templates/**'
              - 'packages/sdk-plugin-seed/src/**'
              - 'packages/sdk-plugin-seed/bin/**'
              - 'packages/sdk-plugin-setup/src/**'
              - 'packages/sdk-plugin-setup/bin/**'
              - 'packages/eslint-plugin-sdk/src/**'
              - 'packages/sdk-plugin-tailordb-erd/src/**'
              - 'packages/sdk-plugin-tailordb-erd/bin/**'
              - 'packages/sdk-plugin-frontend/src/**'
              - 'packages/tailor-proto/src/**'
              - '!packages/*/src/**/*.test.ts'
              - '!packages/*/src/**/*.test-d.ts'
              - '!packages/*/src/**/test-helpers/**'
              - '!packages/*/src/**/test-helpers.ts'
              - '!packages/*/src/**/__test_fixtures__/**'
              - '!packages/*/src/**/__fixtures__/**'
              - '!packages/sdk/src/vitest/integration/**'
            published_docs:
              - 'packages/sdk/docs/**'
              - '!packages/sdk/docs/**/*.*.md'
              - 'packages/sdk/agent-skills/**'
              - 'packages/create-sdk/templates/*/README.md'
              - 'packages/*/README.md'

      - name: Fail if published docs change without a changeset
        if: >-
          steps.filter.outputs.published_docs == 'true' && steps.filter.outputs.changeset != 'true'
        run: |
          echo "::error::This PR changes documentation a package publishes but has no changeset."
          echo ""
          echo "Add a changeset (patch if only documentation changed) so the next release ships it: pnpm changeset"
          echo "The 'skip-changeset' label does not apply to published documentation."
          exit 1

      - name: Fail if codemod source changes without a changeset
        if: >-
          steps.filter.outputs.codemod_source == 'true' && steps.filter.outputs.changeset != 'true'
        run: |
          echo "::error::This PR changes sdk-codemod source but has no changeset."
          echo ""
          echo "tailor upgrade runs the latest published @tailor-platform/sdk-codemod. Add a changeset that releases it: pnpm changeset"
          echo "The 'skip-changeset' label does not apply to sdk-codemod source."
          exit 1

      - name: Fail if package source changes without a changeset
        if: >-
          steps.filter.outputs.package_source == 'true' && steps.filter.outputs.changeset != 'true'
        run: |
          echo "::error::This PR changes source a package ships but has no changeset."
          echo ""
          echo "Add a changeset (patch for an internal refactor with no user-visible change): pnpm changeset"
          echo "For a change under packages/tailor-proto/src, release @tailor-platform/sdk, which bundles it."
          echo "A PR stacked on another can edit the parent PR's changeset instead."
          echo "The 'skip-changeset' label does not apply to package source."
          exit 1

      - name: Fail if no changeset
        if: >-
          steps.filter.outputs.packages == 'true' && steps.filter.outputs.changeset != 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
        run: |
          echo "::error::No changeset file found in this PR."
          echo ""
          echo "Please add a changeset file using: pnpm changeset"
          echo ""
          echo "If this PR changes only tests, CI, tooling, or files no package ships,"
          echo "add 'skip-changeset' label to this PR."
          exit 1

      - name: Fail if a major changeset is outside a v<N> branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version_branch='^v[0-9]+([./-].*)?$'
          if [[ "$BASE_REF" =~ $version_branch || "$HEAD_REF" =~ $version_branch ]]; then
            exit 0
          fi
          majors=$(grep -lE '^"[^"]+": *major *$' .changeset/*.md || true)
          if [ -n "$majors" ]; then
            echo "::error::A major changeset is only allowed on a v<N> branch (for example v3) or a branch derived from it."
            echo ""
            echo "Major changesets found (base: $BASE_REF, head: $HEAD_REF):"
            echo "$majors"
            echo ""
            echo "Breaking changes ship in a major release, from a v<N> branch. For the narrow exception that allows minor, see docs/changeset.md."
            exit 1
          fi

      - name: Install Deps
        if: steps.filter.outputs.changeset == 'true'
        uses: $/.github/actions/install-deps

      - name: Validate changeset packages
        if: steps.filter.outputs.changeset == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: pnpm changeset status --since "origin/$BASE_REF"

      - name: Fail if codemod source changes without an sdk-codemod release
        if: >-
          steps.filter.outputs.codemod_source == 'true' && steps.filter.outputs.changeset == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          plan="$(mktemp)"
          pnpm changeset status --since "origin/$BASE_REF" --output "$plan"
          if ! jq -e 'any(.releases[]; .name == "@tailor-platform/sdk-codemod" and .type != "none")' "$plan" > /dev/null; then
            echo "::error::This PR changes sdk-codemod source, but no changeset it adds or edits releases @tailor-platform/sdk-codemod."
            echo ""
            echo "tailor upgrade runs the latest published @tailor-platform/sdk-codemod. Add a changeset that releases it (pnpm changeset), or list it in a changeset this PR already edits."
            exit 1
          fi

      # `changeset status` only validates the plan; it doesn't run the JSON
      # edits that `changeset version` performs during the Release workflow.
      # Actually running `version` here catches crashes (e.g. a package.json
      # missing a "version" key) before they surface post-merge on main.
      - name: Dry-run changeset version
        if: steps.filter.outputs.changeset == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version
          git checkout -- .
