name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changeset-check:
    name: Changeset check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout and diff the PR

    if: >-
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.ref != 'changeset-release/main' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            changeset:
              - '.changeset/*.md'
              - '!.changeset/README.md'
            packages:
              - 'packages/sdk/**'
              - 'packages/create-sdk/**'
              - 'packages/tailor-proto/**'

      - name: Fail if no changeset
        if: steps.filter.outputs.packages == 'true' && steps.filter.outputs.changeset != 'true'
        run: |
          echo "::error::No changeset file found in this PR."
          echo ""
          echo "Please add a changeset file using: pnpm changeset"
          echo ""
          echo "If this PR does not require a changeset (e.g., docs-only changes),"
          echo "add 'skip-changeset' label to this PR."
          exit 1

      - name: Install Deps
        if: steps.filter.outputs.changeset == 'true'
        uses: ./.github/actions/install-deps

      - name: Validate changeset packages
        if: steps.filter.outputs.changeset == 'true'
        run: pnpm changeset status --since origin/main

      # `changeset status` only validates the plan; it doesn't run the JSON
      # edits that `changeset version` performs during the Release workflow.
      # Actually running `version` here catches crashes (e.g. a package.json
      # missing a "version" key) before they surface post-merge on main.
      - name: Dry-run changeset version
        if: steps.filter.outputs.changeset == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version
          git checkout -- .
