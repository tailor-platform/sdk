name: ERD Viewer Preview

on:
  pull_request:
    paths:
      - packages/sdk/src/cli/commands/tailordb/erd/**
      - example/tailordb/**
      - example/tailor.config.ts
      - .github/workflows/erd-viewer-preview.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    name: Build ERD viewer preview (${{ matrix.namespace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout the repository
    strategy:
      fail-fast: false
      matrix:
        # Self-contained artifacts are uploaded one file per namespace because
        # `archive: false` only supports a single-file upload.
        namespace: [tailordb, analyticsdb]

    steps:
      - name: Checkout PR merge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # install-deps builds the SDK once, so the `tailor-sdk` CLI bin resolves.
      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Checkout base branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .erd-base
          persist-credentials: false

      # `erd export` is fully local (no platform login/network needed) and emits
      # a single self-contained index.html per namespace. The base checkout is
      # built with this PR's SDK so the diff reflects schema changes, not viewer
      # implementation changes.
      - name: Build ERD viewers and diff
        env:
          NAMESPACE: ${{ matrix.namespace }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/erd-preview" "$RUNNER_TEMP/erd-diff"

          (
            cd example
            TAILOR_PLATFORM_SDK_DTS_PATH="$RUNNER_TEMP/erd-dts/head-$NAMESPACE.d.ts" \
              pnpm exec tailor-sdk tailordb erd export --namespace "$NAMESPACE" --output "$RUNNER_TEMP/erd-head"
          )
          (
            cd .erd-base/example
            TAILOR_PLATFORM_SDK_DTS_PATH="$RUNNER_TEMP/erd-dts/base-$NAMESPACE.d.ts" \
              "$GITHUB_WORKSPACE/node_modules/.bin/tailor-sdk" tailordb erd export --namespace "$NAMESPACE" --output "$RUNNER_TEMP/erd-base"
          )

          pnpm --filter @tailor-platform/sdk exec tsx src/cli/commands/tailordb/erd/preview-diff.ts \
            --base-html "$RUNNER_TEMP/erd-base/$NAMESPACE/dist/index.html" \
            --head-html "$RUNNER_TEMP/erd-head/$NAMESPACE/dist/index.html" \
            --output-html "$RUNNER_TEMP/erd-diff/$NAMESPACE-diff.html"

          # Rename to "<namespace>.html" / "<namespace>-diff.html" so the
          # artifacts REST API stays identifiable per namespace.
          cp "$RUNNER_TEMP/erd-head/$NAMESPACE/dist/index.html" "$RUNNER_TEMP/erd-preview/$NAMESPACE.html"

      # archive: false (upload-artifact v7+) keeps the file unzipped so the HTML
      # can be viewed directly in the browser from the run's artifact list. Only
      # a single file may be uploaded per artifact when archive is false.
      # https://github.blog/changelog/2026-02-26-github-actions-now-supports-uploading-and-downloading-non-zipped-artifacts/
      - name: Upload ERD viewer preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erd-viewer-preview-${{ matrix.namespace }}
          path: ${{ runner.temp }}/erd-preview/${{ matrix.namespace }}.html
          if-no-files-found: error
          archive: false
          retention-days: 7

      - name: Upload ERD diff preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erd-viewer-diff-${{ matrix.namespace }}
          path: ${{ runner.temp }}/erd-diff/${{ matrix.namespace }}-diff.html
          if-no-files-found: error
          archive: false
          retention-days: 7

  comment:
    name: Post preview links
    needs: preview
    # Skip on fork PRs, whose read-only token cannot post comments.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout the repository
      pull-requests: write # upsert the sticky preview comment
      actions: read # required to list the run's artifacts

    steps:
      - name: Upsert sticky preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MARKER: "<!-- erd-viewer-preview -->"
        run: |
          set -euo pipefail

          # Build the comment body from this run's ERD preview artifacts. The
          # artifacts REST API reports a non-zipped artifact's name as the file
          # basename, so match on "<namespace>.html" and "<namespace>-diff.html".
          body="$MARKER"$'\n'"### 🗺️ ERD viewer preview"$'\n\n'
          body+="Self-contained HTML built for this run. Diff previews compare this PR with base branch \`$BASE_REF\`:"$'\n'

          while IFS=$'\t' read -r name id; do
            [ -z "$name" ] && continue
            if [[ "$name" == *-diff.html ]]; then
              ns=${name%-diff.html}
              label="$ns diff"
            else
              ns=${name%.html}
              label="$ns viewer"
            fi
            body+=$'\n'"- **$label**: [$name]($SERVER/$REPO/actions/runs/$RUN_ID/artifacts/$id)"
          done < <(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | endswith(".html")) | [.name, (.id|tostring)] | @tsv' | sort)

          # Upsert: update the existing sticky comment if present, else create one.
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq 'map(select(.body | contains(env.MARKER))) | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            echo "Updated sticky comment $existing"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
            echo "Created sticky comment"
          fi
