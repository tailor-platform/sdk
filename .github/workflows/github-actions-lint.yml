---
# Static analysis for GitHub Actions using ghalint and zizmor
#
# - ghalint: https://github.com/suzuki-shunsuke/ghalint
# - zizmor: https://docs.zizmor.sh/
#
# actionlint is intentionally absent here: it does not parse `parallel:` steps
# yet (rhysd/actionlint#693). zizmor covers the security audits actionlint
# offers, so this job keeps its security coverage. The generated-workflow
# templates below still run under actionlint, which they parse cleanly.
name: GitHub Actions Lint

on:
  pull_request:
    paths:
      - .github/workflows/*.yaml
      - .github/workflows/*.yml
      - .github/actions/**
      - aqua.yaml
      - aqua-checksums.json
      - .ghalint.yaml
      - packages/sdk/src/cli/commands/setup/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua
        uses: ./.github/actions/install-aqua

      - name: Run ghalint workflows
        run: ghalint run

      - name: Run ghalint actions
        run: ghalint run-action

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --no-progress .github/workflows/ .github/actions/

  lint-generated-workflows:
    name: Lint generated workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua
        uses: ./.github/actions/install-aqua

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run actionlint tests
        run: pnpm --filter @tailor-platform/sdk exec vitest run src/cli/commands/setup/workflow-lint.test.ts
