---
# Static analysis for GitHub Actions using actionlint, ghalint, and zizmor
#
# - actionlint: https://github.com/rhysd/actionlint
# - ghalint: https://github.com/suzuki-shunsuke/ghalint
# - zizmor: https://docs.zizmor.sh/
name: GitHub Actions Lint

on:
  pull_request:
    paths:
      - .github/workflows/*.yaml
      - .github/workflows/*.yml
      - .github/actions/**
      - aqua.yaml
      - aqua-checksums.json
      - .ghalint.yaml
      - packages/sdk/src/cli/commands/setup/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install aqua
        uses: ./.github/actions/install-aqua

      - name: Run actionlint
        run: actionlint -color

      - name: Run ghalint workflows
        run: ghalint run

      - name: Run ghalint actions
        run: ghalint run-action

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --no-progress .github/workflows/ .github/actions/

  lint-generated-workflows:
    name: Lint generated workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install aqua
        uses: ./.github/actions/install-aqua

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run actionlint tests
        run: pnpm --filter @tailor-platform/sdk exec vitest run src/cli/commands/setup/github/workflow-lint.test.ts
