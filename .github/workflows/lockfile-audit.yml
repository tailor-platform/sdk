name: Lockfile Audit

# Guards against reintroducing known-vulnerable dependency versions via
# pnpm-lock.yaml changes. Renovate's lock file maintenance bumps in-range
# transitive deps weekly, but lockfile conflict resolutions in long-lived
# branches can silently downgrade them again (this happened with fast-uri
# and picomatch). This gate fails such PRs before they reach main.
on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
  pull_request:
    paths:
      - pnpm-lock.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          standalone: true
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # pnpm audit resolves advisories against the lockfile only; no install needed.
      - name: Audit lockfile
        run: pnpm audit --audit-level=moderate
