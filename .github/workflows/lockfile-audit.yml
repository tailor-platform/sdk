name: Lockfile Audit

# Guards against reintroducing known-vulnerable dependency versions via
# pnpm-lock.yaml changes. Renovate's lock file maintenance bumps in-range
# transitive deps weekly, but lockfile conflict resolutions in long-lived
# branches can silently downgrade them again (this happened with fast-uri
# and picomatch). This job diffs the audit result of this change against
# the base commit and only fails on advisories newly introduced by this
# change, so pre-existing vulnerabilities elsewhere in the lockfile don't
# block unrelated PRs. Those are instead picked up and auto-fixed by the
# scheduled lockfile-audit-fix workflow.
on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
  pull_request:
    paths:
      - pnpm-lock.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Audit lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm + Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.21.0
          install: false

      - name: Audit lockfile for newly introduced vulnerabilities
        uses: tailor-platform/actions/lockfile-audit@19c81ce6530e0c79e7ab7753dea32233997006e7 # v2.3.5
