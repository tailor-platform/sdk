name: "SDK E2E Test"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: "false"
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            changes:
              - .github/workflows/sdk-e2e.yml
              - packages/**
              - package.json
              - pnpm-lock.yaml

  sdk-e2e:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    name: SDK E2E
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: "false"

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Run SDK e2e tests
        working-directory: packages/sdk
        run: pnpm exec turbo run test -- --project e2e
        env:
          TAILOR_PLATFORM_TOKEN: ${{ secrets.TAILOR_PLATFORM_PAT }}
          TAILOR_PLATFORM_ORGANIZATION_ID: ${{ secrets.TAILOR_PLATFORM_ORGANIZATION_ID }}
          TAILOR_PLATFORM_FOLDER_ID: ${{ secrets.TAILOR_PLATFORM_FOLDER_ID }}

      - name: Cleanup e2e workspaces
        if: always()
        working-directory: packages/sdk
        run: pnpm exec tsx scripts/cleanup-e2e-workspaces.ts
        env:
          TAILOR_PLATFORM_TOKEN: ${{ secrets.TAILOR_PLATFORM_PAT }}

  sdk-e2e-result:
    needs: [changes, sdk-e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.outputs.should_run }}" != "true" ]]; then
            echo "Skipped - no relevant changes"
            exit 0
          fi
          if [[ "${{ needs.sdk-e2e.result }}" != "success" ]]; then
            echo "SDK E2E job failed"
            exit 1
          fi
          echo "SDK E2E job succeeded"
