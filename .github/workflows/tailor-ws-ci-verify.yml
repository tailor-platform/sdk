# Generated by `tailor setup` — managed by the Tailor SDK.
#
# - The SDK manages the jobs and steps whose id starts with `tailor-` and the
#   top-level name, on, and permissions. Do not edit or rename them:
#   `tailor setup check` reports it, and re-running `tailor setup` then needs
#   --force.
# - Give the jobs and steps you add ids that do not start with `tailor-`:
#   the prefix is reserved for the SDK, and `tailor setup` stops on it.
# - Re-running `tailor setup` keeps your own jobs and steps, every other
#   top-level key, and runs-on, timeout-minutes, container, and env on managed
#   jobs and the ignore, fail-on-drift, install-command, node-version-file,
#   label, ttl, and user-mapping inputs of managed steps.
# - State is tracked in .github/tailor.lock (machine-owned: commit it; the only
#   part to edit by hand is appIds, to re-key an app after moving its directory).
name: Tailor (ws-ci-verify)

on:
  pull_request:
    branches: ["verify/ws-setup-ci"]
  push:
    branches: ["verify/ws-setup-ci"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview changes without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tailor-plan:
    if: |-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs['dry-run'])
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tailor-plan-ws-ci-verify-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - id: tailor-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tailor-setup
        uses: tailor-platform/actions/setup@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          package-manager: pnpm
      - id: tailor-install
        uses: tailor-platform/actions/install@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          package-manager: pnpm
      - id: tailor-generate-check
        uses: tailor-platform/actions/generate-check@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          package-manager: pnpm
      - id: tailor-seed-validate
        run: pnpm exec tailor seed validate
        env:
          SEED_USER_PASSWORD: ${{ github.event_name == 'pull_request' && 'validate-only' || secrets.SEED_USER_PASSWORD }}
      - id: tailor-drift-check
        uses: tailor-platform/actions/drift-check@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          package-manager: pnpm
          fail-on-drift: ${{ vars.TAILOR_PLATFORM_FAIL_ON_DRIFT == 'true' }}
      - id: tailor-migration-drift-check
        uses: tailor-platform/actions/migration-drift-check@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          package-manager: pnpm
      - id: tailor-plan
        # Fork PRs cannot read secrets; the checks above still run for them.
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: tailor-platform/actions/plan@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          workspace-id: aded971b-d2a2-4636-a197-24c1fcb376fd
          package-manager: pnpm
          label: ws-ci-verify
          platform-client-id: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  tailor-deploy:
    if: |-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs['dry-run'])
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: tailor-deploy-ws-ci-verify
      cancel-in-progress: false
    outputs:
      workspace-id: ${{ steps.tailor-apply.outputs.workspace-id }}
      app-url: ${{ steps.tailor-apply.outputs.app-url }}
      app-urls: ${{ steps.tailor-apply.outputs.app-urls }}
      console-urls: ${{ steps.tailor-apply.outputs.console-urls }}
    steps:
      - id: tailor-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tailor-setup
        uses: tailor-platform/actions/setup@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          package-manager: pnpm
      - id: tailor-install
        uses: tailor-platform/actions/install@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          package-manager: pnpm
      - id: tailor-apply
        uses: tailor-platform/actions/deploy@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          workspace-id: aded971b-d2a2-4636-a197-24c1fcb376fd
          package-manager: pnpm
          platform-client-id: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}
      - id: tailor-slack-prereq
        if: always()
        shell: bash
        env:
          SLACK_TOKEN: ${{ secrets.TAILOR_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.TAILOR_SLACK_CHANNEL_ID }}
        run: |
          if [[ -n "$SLACK_TOKEN" && -n "$SLACK_CHANNEL_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - id: tailor-notify
        if: always() && steps.tailor-slack-prereq.outputs.ready == 'true'
        uses: tailor-platform/actions/notify@1c1a451a463770897b3e1987c45df57b27369c8f # v2.9.0
        with:
          provider: slack
          status: ${{ job.status }}
          workspace-name: ws-ci-verify
          slack-token: ${{ secrets.TAILOR_SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.TAILOR_SLACK_CHANNEL_ID }}
          # editable: user-mapping: ${{ vars.TAILOR_SLACK_USER_MAPPING }}

  tailor-result:
    name: tailor-result (ws-ci-verify)
    # Add your own jobs to needs to count them toward this check; tailor setup keeps them.
    needs:
      - tailor-plan
      - tailor-deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: tailor-result
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: |
          echo "::error::A job in needs failed or was cancelled."
          exit 1
