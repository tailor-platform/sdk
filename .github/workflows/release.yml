name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Deps
        uses: ./.github/actions/install-deps

      - name: Get github access token to create release PR
        id: get_access_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.TAILOR_GITHUB_APP_ID }}
          private-key: ${{ secrets.TAILOR_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Setup npm registry for publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          registry-url: "https://registry.npmjs.org"

      # `pnpm/action-setup` v6.0.3+ ships a Node directory that contains
      # only `node` (no `npm`), so `npm` resolves to the runner's system
      # binary at `/usr/local/bin/npm` (10.8.2) — which lacks OIDC trusted
      # publishing. Update that system npm in place by pinning the install
      # prefix to `/usr/local`, otherwise `npm install -g` would land in
      # the pnpm-managed Node prefix and never appear on PATH.
      - name: Ensure npm 11+ for OIDC trusted publishing
        run: npm install -g npm@latest --prefix=/usr/local
        shell: bash

      - name: Create Release PR
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          commitMode: "github-api"
          publish: "pnpm changeset publish"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.get_access_token.outputs.token }}
