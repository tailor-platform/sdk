name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        exclude:
          # Save macOS runner minutes (10x cost) - skip Current (24), keep LTS (22) only
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: pnpm exec turbo run test -- --project unit
        env:
          TAILOR_PLATFORM_TOKEN: ${{ secrets.TAILOR_PLATFORM_PAT }}
