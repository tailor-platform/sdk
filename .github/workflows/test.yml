name: Test

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect changes
    # Skip re-runs triggered by tailor-pr-trigger bot (changeset/generate commits)
    if: github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            changes:
              - .github/workflows/test.yml
              - .github/actions/**
              - packages/**
              - example/**
              - llm-challenge/**
              - package.json
              - tsconfig.json
              - pnpm-workspace.yaml
              - pnpm-lock.yaml

  test:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    name: Test (Node ${{ matrix.node }})
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps
        with:
          node-version: ${{ matrix.node }}

      - name: Login as machine user
        run: pnpm tailor login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.PLATFORM_MACHINE_USER_CLIENT_SECRET }}

      - name: Build packages
        run: pnpm -r --filter '!@tailor-platform/sdk' run build

      - name: Run tests
        run: pnpm -r run test --project 'unit*'

  plugin-windows:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: windows-latest
    name: Plugin tests (Windows)
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Build packages
        run: pnpm -r --filter '!@tailor-platform/sdk' run build
        shell: bash

      # Windows-specific PATHEXT resolution and .cmd/.ps1 spawn branches are
      # only exercised here; the main unit suite runs on Linux.
      - name: Run plugin tests
        run: pnpm --filter @tailor-platform/sdk exec vitest run --project unit-plugin
        shell: bash

  test-summary:
    name: test-summary # required status check context (ruleset status_check_main) — keep equal to the job id
    needs: [changes, test, plugin-windows]
    if: >-
      always() &&
      (github.event.action != 'synchronize' || github.event.sender.login != 'tailor-pr-trigger[bot]')
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.should_run }}
          TEST_RESULT: ${{ needs.test.result }}
          PLUGIN_WINDOWS_RESULT: ${{ needs.plugin-windows.result }}
        run: |
          # Fail closed: if the paths-filter job itself failed, should_run is
          # empty and must not be mistaken for "no relevant changes".
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Changes job did not succeed (result=$CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" ]]; then
            echo "Skipped - no relevant changes"
            exit 0
          fi
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Test jobs failed"
            exit 1
          fi
          if [[ "$PLUGIN_WINDOWS_RESULT" != "success" ]]; then
            echo "Plugin tests (Windows) failed"
            exit 1
          fi
          echo "All test jobs succeeded"
