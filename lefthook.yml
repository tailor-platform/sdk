# Refer for explanation to following link: https://lefthook.dev/configuration/

output:
  - summary

pre-commit:
  jobs:
    - name: format
      glob: "*.{ts,js,json,md,yml,yaml}"
      exclude:
        - "node_modules/**"
        - "pnpm-lock.yaml"
        - "dist/**"
        - "build/**"
        - "out/**"
        - "*.tsbuildinfo"
        - "logs/**"
        - "*.log"
        - "npm-debug.log*"
        - "yarn-debug.log*"
        - "yarn-error.log*"
        - "pnpm-debug.log*"
        - "lerna-debug.log*"
        - "coverage/**"
        - ".tailor/**"
        - "example/tests/fixtures/**"
        - "example/generated/**"
        - "example/seed/**"
        - "packages/tailor-proto/**"
        - "packages/sdk-codemod/codemods/**/tests/**"
      run: pnpm oxfmt --check {staged_files}

    - name: checks
      glob: "*.{ts,js}"
      group:
        piped: true
        jobs:
          - name: build
            run: pnpm --filter=@tailor-platform/sdk run build
          - name: generate
            run: pnpm --filter=@tailor-platform/sdk --filter=example run generate
          - name: lint
            run: pnpm --filter=@tailor-platform/sdk --filter=example run lint
          - name: lint-vitest
            run: pnpm run lint:vitest
          - name: lint-templates
            run: pnpm --filter='./packages/create-sdk/templates/*' run lint
          - name: typecheck
            run: pnpm --filter=@tailor-platform/sdk --filter=example run typecheck:rs
          - name: knip
            run: pnpm --filter=@tailor-platform/sdk run knip

post-commit:
  commands:
    verify-signature:
      run: 'git cat-file -p HEAD | grep -q "gpgsig" || { echo "ERROR: Commit is not signed!" >&2; exit 1; }'
