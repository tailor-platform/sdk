# Refer for explanation to following link: https://lefthook.dev/configuration/

pre-commit:
  commands:
    format:
      glob: "*.{ts,js,json,md,yml,yaml}"
      exclude:
        - "node_modules/**"
        - "pnpm-lock.yaml"
        - "dist/**"
        - "build/**"
        - "out/**"
        - "*.tsbuildinfo"
        - "logs/**"
        - "*.log"
        - "npm-debug.log*"
        - "yarn-debug.log*"
        - "yarn-error.log*"
        - "pnpm-debug.log*"
        - "lerna-debug.log*"
        - "coverage/**"
        - ".tailor-sdk/**"
        - "example/tests/fixtures/**"
        - "example/generated/**"
        - "example/seed/**"
        - "packages/tailor-proto/**"
        - "packages/sdk-codemod/codemods/**/tests/**"
      run: pnpm oxfmt --check {staged_files}

    checks:
      glob: "*.{ts,js}"
      run: >-
        pnpm --filter=@tailor-platform/sdk run build &&
        pnpm --filter=@tailor-platform/sdk --filter=example run generate &&
        pnpm --filter=@tailor-platform/sdk --filter=example run lint &&
        pnpm --filter=@tailor-platform/sdk --filter=example run typecheck:go &&
        pnpm --filter=@tailor-platform/sdk run knip &&
        pnpm --filter='./packages/create-sdk/templates/*' run lint

post-commit:
  commands:
    verify-signature:
      run: 'git cat-file -p HEAD | grep -q "gpgsig" || { echo "ERROR: Commit is not signed!" >&2; exit 1; }'
