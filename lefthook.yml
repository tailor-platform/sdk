# Refer for explanation to following link: https://lefthook.dev/configuration/

pre-commit:
  commands:
    format:
      glob: "*.{ts,js,json,md,yml,yaml}"
      exclude:
        - "node_modules/**"
        - "pnpm-lock.yaml"
        - "dist/**"
        - "build/**"
        - "out/**"
        - "*.tsbuildinfo"
        - "logs/**"
        - "*.log"
        - "npm-debug.log*"
        - "yarn-debug.log*"
        - "yarn-error.log*"
        - "pnpm-debug.log*"
        - "lerna-debug.log*"
        - ".eslintcache"
        - "coverage/**"
        - ".tailor-sdk/**"
        - "example/tests/fixtures/**"
        - "example/generated/**"
        - "example/seed/**"
        - "packages/tailor-proto/**"
      run: pnpm exec vp fmt --check {staged_files}

    checks:
      glob: "*.{ts,js}"
      run: >-
        pnpm exec vp run --filter @tailor-platform/sdk --filter example build --cache
        && pnpm exec vp run --filter @tailor-platform/sdk --filter example generate --cache
        && pnpm exec vp run --filter @tailor-platform/sdk --filter example lint --cache
        && pnpm exec vp run --filter @tailor-platform/sdk --filter example typecheck:go --cache
        && pnpm exec vp run --filter @tailor-platform/sdk --filter example knip --cache
        && pnpm exec vp run --filter './packages/create-sdk/templates/*' lint --cache

post-commit:
  commands:
    verify-signature:
      run: 'git cat-file -p HEAD | grep -q "gpgsig" || { echo "ERROR: Commit is not signed!" >&2; exit 1; }'
