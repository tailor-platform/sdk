# Refer for explanation to following link: https://lefthook.dev/configuration/

pre-commit:
  commands:
    format:
      glob: "*.{ts,js,json,md,yml,yaml}"
      exclude:
        - "node_modules/**"
        - "pnpm-lock.yaml"
        - "dist/**"
        - "build/**"
        - "out/**"
        - "*.tsbuildinfo"
        - "logs/**"
        - "*.log"
        - "npm-debug.log*"
        - "yarn-debug.log*"
        - "yarn-error.log*"
        - "pnpm-debug.log*"
        - "lerna-debug.log*"
        - "coverage/**"
        - ".tailor-sdk/**"
        - "example/tests/fixtures/**"
        - "example/generated/**"
        - "example/seed/**"
        - "packages/tailor-proto/**"
        - "packages/sdk-codemod/codemods/**/tests/**"
        - "packages/create-sdk/templates/*/src/generated/**"
        - "packages/create-sdk/templates/*/src/seed/**"
      run: pnpm oxfmt --check {staged_files}

    checks:
      glob: "*.{ts,js}"
      run: >-
        pnpm exec turbo run build lint typecheck:go knip
        --filter=@tailor-platform/sdk --filter=example
        --no-update-notifier --output-logs=errors-only
        && pnpm exec turbo run lint
        --filter='./packages/create-sdk/templates/*'
        --no-update-notifier --output-logs=errors-only

post-commit:
  commands:
    verify-signature:
      run: 'git cat-file -p HEAD | grep -q "gpgsig" || { echo "ERROR: Commit is not signed!" >&2; exit 1; }'
