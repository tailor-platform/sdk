# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
version: 3
rules:
  # changesets/action's `next`-tagged prereleases have broken releases before.
  - ignore: true
    conditions:
      - expr: |
          ActionRepoFullName == "changesets/action"
