# __HEADER__
name: Tailor (__WORKSPACE_NAME__)

on:
  # __PULL_REQUEST_START__
  pull_request:
    branches: ["__BRANCH__"]
    # __PR_TYPES__
  # __PULL_REQUEST_END__
  push:
    branches: ["__BRANCH__"]
  workflow_dispatch:
    # __DISPATCH_INPUTS_START__
    inputs:
      dry-run:
        description: Preview changes without deploying
        type: boolean
        default: false
    # __DISPATCH_INPUTS_END__

permissions:
  contents: read

jobs:
  # __CHANGES_JOB__
  # __PLAN_JOB_START__
  tailor-plan:
    # __PLAN_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: __ENVIRONMENT__
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tailor-plan-__WORKSPACE_NAME__-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      # __CHANGES_GUARD__
      - id: tailor-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tailor-setup
        uses: tailor-platform/actions/setup@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      # __GENERATE_CHECK_START__
      - id: tailor-generate-check
        uses: tailor-platform/actions/generate-check@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      # __GENERATE_CHECK_END__
      # __PER_APP_GENERATE_CHECK__
      # __SEED_VALIDATE_START__
      - id: tailor-seed-validate
        run: __TAILOR_CLI__ seed validate__SEED_VALIDATE_ARGS__
        env:
          SEED_USER_PASSWORD: ${{ github.event_name == 'pull_request' && 'validate-only' || secrets.SEED_USER_PASSWORD }}
        # __WORKING_DIRECTORY__
      # __SEED_VALIDATE_END__
      # __PER_APP_SEED_VALIDATE__
      - id: tailor-drift-check
        uses: tailor-platform/actions/drift-check@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
          fail-on-drift: ${{ vars.TAILOR_PLATFORM_FAIL_ON_DRIFT == 'true' }}
      # __MIGRATION_DRIFT_CHECK_START__
      - id: tailor-migration-drift-check
        uses: tailor-platform/actions/migration-drift-check@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      # __MIGRATION_DRIFT_CHECK_END__
      # __PER_APP_MIGRATION_DRIFT_CHECK__
      - id: tailor-plan
        # Fork PRs cannot read secrets; the checks above still run for them.
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: tailor-platform/actions/plan@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        # __CONFIG_ENV__
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          package-manager: __PACKAGE_MANAGER__
          label: __WORKSPACE_NAME__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ vars.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID || secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  # __PLAN_JOB_END__
  # __ERD_PREVIEW_JOB_START__
  tailor-erd-preview-matrix:
    # __ERD_MATRIX_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      namespaces: ${{ steps.tailor-erd-preview-matrix.outputs.namespaces }}
      app-dirs: ${{ steps.tailor-erd-preview-matrix.outputs['app-dirs'] }}
      base-app-dirs: ${{ steps.tailor-erd-preview-matrix.outputs['base-app-dirs'] }}
    steps:
      # __CHANGES_GUARD__
      - id: tailor-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tailor-checkout-base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .tailor-erd-base
          persist-credentials: false
      - id: tailor-erd-preview-matrix
        shell: bash
        env:
          APP_DIR: "__APP_DIR__"
          WORKSPACE_NAME: "__WORKSPACE_NAME__"
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const appDir = process.env.APP_DIR || ".";
          const workspaceName = process.env.WORKSPACE_NAME;
          const output = process.env.GITHUB_OUTPUT;
          const dirPattern = /^[A-Za-z0-9._/-]+$/;
          const namespacePattern = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;

          function lockTarget(file) {
            try {
              const lock = JSON.parse(fs.readFileSync(file, "utf8"));
              return lock.targets?.find(
                (candidate) =>
                  candidate.kind === "branch" &&
                  candidate.workspaceName === workspaceName,
              );
            } catch (error) {
              if (error && error.code === "ENOENT") return undefined;
              throw error;
            }
          }

          function validNamespace(namespace, label) {
            if (typeof namespace !== "string" || !namespacePattern.test(namespace)) {
              throw new Error(`Invalid ERD namespace in ${label}: ${String(namespace)}`);
            }
            return namespace;
          }

          function normalizeDir(value, label) {
            const raw = typeof value === "string" && value.length > 0 ? value : appDir;
            const normalized =
              raw.replaceAll("\\", "/").replace(/\/{2,}/g, "/").replace(/^\.\//, "").replace(/\/$/, "") ||
              ".";
            if (
              !dirPattern.test(normalized) ||
              normalized.startsWith("/") ||
              normalized.split("/").includes("..")
            ) {
              throw new Error(`Invalid ERD app dir in ${label}: ${raw}`);
            }
            return normalized;
          }

          // Each namespace is owned by one app. A side without an ERD target yet reuses the
          // other side's owner; a namespace missing from a side's target is exported from
          // that side's first app, where it renders as added or removed.
          function appDirsFromTarget(target, label) {
            const dirs = new Map();
            if (target?.inputs?.erdPreview !== true) return dirs;
            const apps = Array.isArray(target.inputs.apps)
              ? target.inputs.apps
              : [{ dir: target.inputs.dir, erdNamespaces: target.inputs.erdNamespaces }];
            for (const app of apps) {
              const dir = normalizeDir(app?.dir, label);
              for (const namespace of Array.isArray(app?.erdNamespaces) ? app.erdNamespaces : []) {
                dirs.set(validNamespace(namespace, label), dir);
              }
            }
            return dirs;
          }

          function defaultAppDir(target, label) {
            const apps = target?.inputs?.apps;
            return normalizeDir(Array.isArray(apps) ? apps[0]?.dir : target?.inputs?.dir, label);
          }

          const headTarget = lockTarget(".github/tailor.lock");
          const baseTarget = lockTarget(".tailor-erd-base/.github/tailor.lock");
          const headDirs = appDirsFromTarget(headTarget, "head setup lock");
          const baseDirs = appDirsFromTarget(baseTarget, "base setup lock");
          const namespaces = [...new Set([...headDirs.keys(), ...baseDirs.keys()])].sort((a, b) =>
            a.localeCompare(b),
          );
          function dirsFor(dirs, target, otherDirs, label) {
            const hasTarget = target?.inputs?.erdPreview === true;
            const fallback = defaultAppDir(target, label);
            return Object.fromEntries(
              namespaces.map((namespace) => [
                namespace,
                dirs.get(namespace) ?? (hasTarget ? undefined : otherDirs.get(namespace)) ?? fallback,
              ]),
            );
          }
          const appDirs = dirsFor(headDirs, headTarget, baseDirs, "head setup lock");
          const baseAppDirs = dirsFor(baseDirs, baseTarget, headDirs, "base setup lock");

          if (namespaces.length === 0) {
            console.error("No ERD preview namespaces found in the head or base setup lock.");
            process.exit(1);
          }

          fs.appendFileSync(output, `namespaces=${JSON.stringify(namespaces)}\n`);
          fs.appendFileSync(output, `app-dirs=${JSON.stringify(appDirs)}\n`);
          fs.appendFileSync(output, `base-app-dirs=${JSON.stringify(baseAppDirs)}\n`);
          NODE

  tailor-erd-preview:
    needs: tailor-erd-preview-matrix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        namespace: ${{ fromJSON(needs.tailor-erd-preview-matrix.outputs.namespaces) }}
    steps:
      - id: tailor-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tailor-setup
        uses: tailor-platform/actions/setup@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-checkout-base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .tailor-erd-base
          persist-credentials: false
      - id: tailor-detect-base-package-manager
        shell: bash
        run: |
          set -euo pipefail
          cd .tailor-erd-base
          base_package_manager="$(
            if [ -f pnpm-lock.yaml ]; then
              echo pnpm
            elif [ -f yarn.lock ]; then
              echo yarn
            elif [ -f bun.lockb ] || [ -f bun.lock ]; then
              echo bun
            elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              echo npm
            else
              echo "__PACKAGE_MANAGER__"
            fi
          )"
          echo "package-manager=$base_package_manager" >> "$GITHUB_OUTPUT"
          if [ "$base_package_manager" = "pnpm" ]; then
            base_pnpm_version="$(node <<'NODE'
          const fs = require("node:fs");

          const fallback = "10";

          function readManifest(file) {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              return {};
            }
          }

          function pnpmVersion(manifest) {
            const packageManager = manifest.packageManager;
            if (typeof packageManager === "string" && packageManager.startsWith("pnpm@")) {
              return packageManager.slice("pnpm@".length).split("+")[0];
            }

            const devPackageManager = manifest.devEngines?.packageManager;
            if (devPackageManager?.name === "pnpm" && devPackageManager.version) {
              return devPackageManager.version;
            }

            return undefined;
          }

          process.stdout.write(
            pnpmVersion(readManifest("package.json")) ?? fallback,
          );
          NODE
          )"
            echo "pnpm-version=$base_pnpm_version" >> "$GITHUB_OUTPUT"
          fi
      - id: tailor-setup-base-pnpm
        if: steps.tailor-detect-base-package-manager.outputs['package-manager'] == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.tailor-detect-base-package-manager.outputs['pnpm-version'] }}
          package_json_file: .tailor-erd-base/package.json
          run_install: false
      - id: tailor-setup-base-node
        if: steps.tailor-detect-base-package-manager.outputs['package-manager'] != 'bun'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tailor-erd-base/package.json
      - id: tailor-setup-base-yarn
        if: steps.tailor-detect-base-package-manager.outputs['package-manager'] == 'yarn'
        shell: bash
        working-directory: .tailor-erd-base
        run: |
          set -euo pipefail
          corepack enable
      - id: tailor-setup-base-bun
        if: steps.tailor-detect-base-package-manager.outputs['package-manager'] == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - id: tailor-install-base
        shell: bash
        working-directory: .tailor-erd-base
        env:
          BASE_PACKAGE_MANAGER: ${{ steps.tailor-detect-base-package-manager.outputs['package-manager'] }}
        run: |
          set -euo pipefail
          case "$BASE_PACKAGE_MANAGER" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            yarn)
              if grep -q '^__metadata:' yarn.lock; then
                yarn install --immutable
              else
                yarn install --frozen-lockfile
              fi
              ;;
            bun) bun install --frozen-lockfile ;;
            *)
              echo "::error::Unsupported base package-manager '$BASE_PACKAGE_MANAGER' (expected pnpm, npm, yarn, or bun)"
              exit 1
              ;;
          esac
      - id: tailor-restore-head-setup
        uses: tailor-platform/actions/setup@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-build-erd-preview
        shell: bash
        env:
          APP_DIR: ${{ fromJSON(needs.tailor-erd-preview-matrix.outputs['app-dirs'])[matrix.namespace] }}
          BASE_APP_DIR: ${{ fromJSON(needs.tailor-erd-preview-matrix.outputs['base-app-dirs'])[matrix.namespace] }}
          BASE_PACKAGE_MANAGER: ${{ steps.tailor-detect-base-package-manager.outputs['package-manager'] }}
          NAMESPACE: ${{ matrix.namespace }}
        run: |
          set -euo pipefail

          run_tailor_cli() {
            case "__PACKAGE_MANAGER__" in
              pnpm) pnpm exec tailor "$@" ;;
              npm) npx @tailor-platform/sdk "$@" ;;
              yarn) yarn tailor "$@" ;;
              bun) bun run tailor "$@" ;;
              *)
                echo "::error::Unsupported package-manager '__PACKAGE_MANAGER__' (expected pnpm, npm, yarn, or bun)"
                exit 1
                ;;
            esac
          }

          run_head_node() {
            case "__PACKAGE_MANAGER__" in
              pnpm) pnpm exec node "$@" ;;
              npm) node "$@" ;;
              yarn) yarn node "$@" ;;
              bun) node "$@" ;;
              *)
                echo "::error::Unsupported package-manager '__PACKAGE_MANAGER__' (expected pnpm, npm, yarn, or bun)"
                exit 1
                ;;
            esac
          }

          tailor_cli_bin="$(
            run_head_node - <<'NODE'
          const path = require("node:path");
          const { createRequire } = require("node:module");
          const appDir = process.env.APP_DIR || ".";
          const githubWorkspace = process.env.GITHUB_WORKSPACE;
          if (!githubWorkspace) {
            throw new Error("GITHUB_WORKSPACE is required.");
          }

          let lastError;
          for (const manifestPath of [
            path.join(githubWorkspace, appDir, "package.json"),
            path.join(githubWorkspace, "package.json"),
          ]) {
            try {
              const requireFromManifest = createRequire(manifestPath);
              process.stdout.write(
                path.join(
                  path.dirname(requireFromManifest.resolve("@tailor-platform/sdk/cli")),
                  "index.mjs",
                ),
              );
              process.exit(0);
            } catch (error) {
              lastError = error;
            }
          }
          throw lastError || new Error("Failed to resolve @tailor-platform/sdk/cli.");
          NODE
          )"

          run_head_tailor_cli_bin() {
            local command_cwd="$1"
            shift

            run_head_cli_env() {
              env TAILOR_CLI_BIN="$tailor_cli_bin" TAILOR_CLI_CWD="$command_cwd" "$@"
            }

            (
              cd "$GITHUB_WORKSPACE" || exit 1
              case "__PACKAGE_MANAGER__" in
                pnpm) run_head_cli_env pnpm exec node "$head_cli_runner" "$@" ;;
                npm) run_head_cli_env node "$head_cli_runner" "$@" ;;
                yarn) run_head_cli_env yarn node "$head_cli_runner" "$@" ;;
                bun) run_head_cli_env bun "$head_cli_runner" "$@" ;;
                *)
                  echo "::error::Unsupported package-manager '__PACKAGE_MANAGER__' (expected pnpm, npm, yarn, or bun)"
                  exit 1
                  ;;
              esac
            )
          }

          run_base_tailor_cli_bin() {
            local command_cwd="$1"
            shift

            run_head_cli_env() {
              env TAILOR_CLI_BIN="$tailor_cli_bin" TAILOR_CLI_CWD="$command_cwd" "$@"
            }

            (
              cd "$command_cwd" || exit 1
              case "$BASE_PACKAGE_MANAGER" in
                pnpm) run_head_cli_env pnpm exec node "$head_cli_runner" "$@" ;;
                npm) run_head_cli_env node "$head_cli_runner" "$@" ;;
                yarn) run_head_cli_env yarn node "$head_cli_runner" "$@" ;;
                bun) run_head_cli_env bun "$head_cli_runner" "$@" ;;
                *)
                  echo "::error::Unsupported base package-manager '$BASE_PACKAGE_MANAGER' (expected pnpm, npm, yarn, or bun)"
                  exit 1
                  ;;
              esac
            )
          }

          head_output="$RUNNER_TEMP/tailor-erd/head"
          base_output="$RUNNER_TEMP/tailor-erd/base"
          preview_output="$RUNNER_TEMP/tailor-erd/preview"
          dts_output="$RUNNER_TEMP/tailor-erd/dts"
          head_cli_runner="$RUNNER_TEMP/tailor-erd/run-head-cli.mjs"
          head_log="$RUNNER_TEMP/tailor-erd/head-$NAMESPACE.log"
          base_log="$RUNNER_TEMP/tailor-erd/base-$NAMESPACE.log"
          rm -rf "$head_output" "$base_output" "$preview_output" "$dts_output"
          mkdir -p "$head_output" "$base_output" "$preview_output" "$dts_output"
          cat > "$head_cli_runner" <<'NODE'
          import { pathToFileURL } from "node:url";

          const cliBin = process.env.TAILOR_CLI_BIN;
          const commandCwd = process.env.TAILOR_CLI_CWD;
          if (!cliBin || !commandCwd) {
            throw new Error("TAILOR_CLI_BIN and TAILOR_CLI_CWD are required.");
          }

          process.chdir(commandCwd);
          process.argv = [process.argv[0], cliBin, ...process.argv.slice(2)];
          await import(pathToFileURL(cliBin).href);
          NODE

          head_config="$GITHUB_WORKSPACE/$APP_DIR/tailor.config.ts"
          base_config="$GITHUB_WORKSPACE/.tailor-erd-base/$BASE_APP_DIR/tailor.config.ts"
          head_html="$head_output/$NAMESPACE/dist/index.html"
          base_html="$base_output/$NAMESPACE/dist/index.html"
          preview_html="$preview_output/$NAMESPACE-viewer.html"

          head_missing="false"
          if [ ! -f "$head_config" ]; then
            echo "Head ERD config not found; rendering base objects as removed."
            head_missing="true"
          elif ! (
            cd "$GITHUB_WORKSPACE/$APP_DIR" || exit 1
            TAILOR_PLATFORM_SDK_DTS_PATH="$dts_output/head-$NAMESPACE.d.ts" \
              run_tailor_cli tailordb erd export --config "$head_config" --namespace "$NAMESPACE" --output "$head_output"
          ) >"$head_log" 2>&1; then
            if grep -q 'not found in local config.db' "$head_log"; then
              cat "$head_log"
              echo "Head ERD namespace '$NAMESPACE' not found; rendering base objects as removed."
              head_missing="true"
            else
              cat "$head_log"
              exit 1
            fi
          elif [ -s "$head_log" ]; then
            cat "$head_log"
          fi

          base_missing="false"
          if [ ! -f "$base_config" ]; then
            echo "Base ERD config not found; rendering current objects as added."
            base_missing="true"
          elif ! (
            TAILOR_PLATFORM_SDK_DTS_PATH="$dts_output/base-$NAMESPACE.d.ts" \
              run_base_tailor_cli_bin "$GITHUB_WORKSPACE/.tailor-erd-base/$BASE_APP_DIR" tailordb erd export --config "$base_config" --namespace "$NAMESPACE" --output "$base_output"
          ) >"$base_log" 2>&1; then
            if grep -q 'not found in local config.db' "$base_log"; then
              cat "$base_log"
              echo "Base ERD namespace '$NAMESPACE' not found; rendering current objects as added."
              base_missing="true"
            else
              cat "$base_log"
              exit 1
            fi
          elif [ -s "$base_log" ]; then
            cat "$base_log"
          fi

          if [ "$head_missing" = "true" ] && [ "$base_missing" = "true" ]; then
            echo "::error::ERD namespace '$NAMESPACE' was not found in head or base."
            exit 1
          fi
          if [ "$head_missing" = "false" ] && [ ! -f "$head_html" ]; then
            echo "::error::Head ERD viewer was not generated at $head_html"
            exit 1
          fi
          if [ "$base_missing" = "false" ] && [ ! -f "$base_html" ]; then
            echo "::error::Base ERD viewer was not generated at $base_html"
            exit 1
          fi

          diff_args=(--namespace "$NAMESPACE" --output "$preview_html")
          if [ "$head_missing" = "false" ]; then
            diff_args+=(--head-html "$head_html")
          fi
          if [ "$base_missing" = "false" ]; then
            diff_args+=(--base-html "$base_html")
          fi
          run_head_tailor_cli_bin "$GITHUB_WORKSPACE" tailordb erd diff "${diff_args[@]}"
      # __ERD_GITHUB_COM_UPLOAD_START__
      - id: tailor-upload-erd-viewer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.namespace }}-viewer.html
          path: ${{ runner.temp }}/tailor-erd/preview/${{ matrix.namespace }}-viewer.html
          if-no-files-found: error
          archive: false
          retention-days: 7
      # __ERD_GITHUB_COM_UPLOAD_END__
      # __ERD_GHES_UPLOAD_START__
      - id: tailor-upload-erd-viewer
        # upload-artifact v3.2.2: GitHub Enterprise Server does not support v4 or later.
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: ${{ matrix.namespace }}-viewer.html
          path: ${{ runner.temp }}/tailor-erd/preview/${{ matrix.namespace }}-viewer.html
          if-no-files-found: error
          retention-days: 7
      # __ERD_GHES_UPLOAD_END__

  # __ERD_PREVIEW_JOB_END__
  # __ERD_PREVIEW_COMMENT_JOB_START__
  tailor-erd-preview-comment:
    # __ERD_COMMENT_NEEDS__
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # __ERD_GITHUB_COM_ACTIONS_READ_START__
      actions: read
      # __ERD_GITHUB_COM_ACTIONS_READ_END__
      pull-requests: write
    steps:
      - id: tailor-comment-erd-preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
          # __ERD_GHES_NAMESPACES_START__
          NAMESPACES: ${{ needs.tailor-erd-preview-matrix.outputs.namespaces }}
          # __ERD_GHES_NAMESPACES_END__
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MARKER: "<!-- tailor-erd-preview: __WORKSPACE_NAME__ -->"
        run: |
          set -euo pipefail
          export GH_HOST="${GITHUB_SERVER_URL#*://}"

          current_head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Skipping stale ERD preview comment for $HEAD_SHA; current head is $current_head."
            exit 0
          fi

          body="$MARKER"$'\n'"### TailorDB ERD preview (__WORKSPACE_NAME__)"$'\n\n'
          # __ERD_GITHUB_COM_LINKS_START__
          body+="Self-contained ERD viewer HTML artifacts for this pull request. Each viewer can switch between the current schema and a diff against base branch \`$BASE_REF\`."$'\n'
          viewer_artifacts() {
            gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | endswith("-viewer.html")) | [.name, (.id|tostring)] | @tsv'
          }
          artifact_link() { printf '[%s](%s)' "$1" "$SERVER/$REPO/actions/runs/$RUN_ID/artifacts/$2"; }
          # __ERD_GITHUB_COM_LINKS_END__
          # __ERD_GHES_LINKS_START__
          body+="Self-contained ERD viewer HTML files for this pull request, each zipped as an artifact of [the workflow run]($SERVER/$REPO/actions/runs/$RUN_ID). Each viewer can switch between the current schema and a diff against base branch \`$BASE_REF\`."$'\n'
          # upload-artifact v3 artifacts reach the REST API only after the run completes.
          viewer_artifacts() { jq -r '.[] | "\(.)-viewer.html"' <<<"$NAMESPACES"; }
          artifact_link() { printf '%s' "\`$1\`"; }
          # __ERD_GHES_LINKS_END__

          viewers=$(viewer_artifacts | sort)
          while IFS=$'\t' read -r name id; do
            [ -z "$name" ] && continue
            if [[ "$name" != *-viewer.html ]]; then
              continue
            fi
            ns=${name%-viewer.html}
            label="$ns viewer"
            body+=$'\n'"- **$label**: $(artifact_link "$name" "$id")"
          done <<<"$viewers"

          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq 'map(select(.body | contains(env.MARKER))) | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  # __ERD_PREVIEW_COMMENT_JOB_END__
  # __MIGRATION_TEST_JOB_START__
  tailor-migration-test:
    if: |-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == '__MIGRATION_TEST_LABEL__' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: "__MIGRATION_TEST_ENVIRONMENT__"
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tailor-migration-test-__WORKSPACE_NAME__-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - id: tailor-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tailor-setup
        uses: tailor-platform/actions/setup@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-migration-test-login
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ vars.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID || secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
        run: |
          echo "::add-mask::$TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID"
          echo "::add-mask::$TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET"
          __TAILOR_CLI__ login --machine-user
        # __WORKING_DIRECTORY__
      - id: tailor-migration-test
        timeout-minutes: 50
        env:
          TAILOR_PLATFORM_WORKSPACE_ID: ${{ vars.__MIGRATION_TEST_SOURCE_VARIABLE__ }}
        run: |
          status=0
          __TAILOR_CLI__ tailordb migration test --data clone --yes --clone-timeout 30m --json > "$RUNNER_TEMP/migration-test.json" || status=$?
          {
            echo "### Migration test (__WORKSPACE_NAME__)"
            if [ -s "$RUNNER_TEMP/migration-test.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/migration-test.json"
              echo '```'
            else
              echo "Failed before producing a result. See the job log for the error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        # __WORKING_DIRECTORY__
      - id: tailor-migration-test-unlabel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: "__MIGRATION_TEST_LABEL__"
        run: |
          encoded_label="$(jq -rn --arg label "$LABEL" '$label | @uri')"
          gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$encoded_label" --silent \
            || echo "::warning::Could not remove the '$LABEL' label; remove it manually before re-running."

  # __MIGRATION_TEST_JOB_END__
  tailor-deploy:
    # __DEPLOY_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: __ENVIRONMENT__
    concurrency:
      group: tailor-deploy-__WORKSPACE_NAME__
      cancel-in-progress: false
    outputs:
      workspace-id: ${{ steps.tailor-apply.outputs.workspace-id }}
      app-url: ${{ steps.tailor-apply.outputs.app-url }}
    steps:
      # __CHANGES_GUARD__
      - id: tailor-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tailor-setup
        uses: tailor-platform/actions/setup@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          package-manager: __PACKAGE_MANAGER__
      # __SEED_PREFLIGHT_START__
      - id: tailor-seed-validate
        run: __TAILOR_CLI__ seed validate__SEED_VALIDATE_ARGS__
        env:
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
        # __WORKING_DIRECTORY__
      # __SEED_PREFLIGHT_END__
      - id: tailor-apply
        uses: tailor-platform/actions/deploy@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        # __CONFIG_ENV__
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ vars.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID || secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
      # __SEED_START__
      - id: tailor-seed
        shell: bash
        # __WORKING_DIRECTORY__
        env:
          TAILOR_PLATFORM_WORKSPACE_ID: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
        run: |
          __TAILOR_CLI__ seed apply --upsert__SEED_ARGS__
      # __SEED_END__
      - id: tailor-slack-prereq
        if: always()
        shell: bash
        env:
          SLACK_TOKEN: ${{ secrets.TAILOR_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.TAILOR_SLACK_CHANNEL_ID }}
        run: |
          if [[ -n "$SLACK_TOKEN" && -n "$SLACK_CHANNEL_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - id: tailor-notify
        if: always() && steps.tailor-slack-prereq.outputs.ready == 'true'
        uses: tailor-platform/actions/notify@26a3cae341adecfaf0e6c81bd969de09c72dad55 # v2.7.0
        with:
          provider: slack
          status: ${{ job.status }}
          workspace-name: __WORKSPACE_NAME__
          slack-token: ${{ secrets.TAILOR_SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.TAILOR_SLACK_CHANNEL_ID }}
          # editable: user-mapping: ${{ vars.TAILOR_SLACK_USER_MAPPING }}

  tailor-result:
    name: tailor-result (__WORKSPACE_NAME__)
    # Add your own jobs to needs to count them toward this check; tailor setup keeps them.
    needs:
      # __RESULT_NEEDS__
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: tailor-result
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: |
          echo "::error::A job in needs failed or was cancelled."
          exit 1
