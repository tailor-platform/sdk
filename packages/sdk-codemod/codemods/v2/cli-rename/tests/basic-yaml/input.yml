name: Tail crash reports
on: workflow_dispatch
jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install
      - run: pnpm exec tailor-sdk crash-report list
      - run: pnpm exec tailor-sdk crash-report send --file latest.crash.log
      - run: pnpm exec tailor-sdk login --machineuser ci
      - run: >
          pnpm exec tailor-sdk login
          --machineuser ci
      - run: "pnpm exec tailor-sdk query --machineuser ci"
