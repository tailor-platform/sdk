# __HEADER__
name: Tailor Preview (__WORKSPACE_NAME__)

on:
  pull_request:
    branches: ["__BRANCH__"]
    # __PR_TYPES__
    # To deploy only for PRs that carry the `tailor:preview` label instead of all PRs,
    # re-run: tailor setup preview --require-preview-label
    # __PATHS__

permissions:
  contents: read
  pull-requests: write

jobs:
  tailor-preview-deploy:
    # __DEPLOY_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: __ENVIRONMENT__
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tailor-preview-__WORKSPACE_NAME__-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - id: tailor-checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: tailor-setup
        uses: tailor-platform/actions/setup@e74173d4bdd931d036ad359cf5f7729fc6aa7067 # v1.5.1
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@e74173d4bdd931d036ad359cf5f7729fc6aa7067 # v1.5.1
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-generate-check
        uses: tailor-platform/actions/generate-check@e74173d4bdd931d036ad359cf5f7729fc6aa7067 # v1.5.1
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      - id: tailor-preview-deploy
        uses: tailor-platform/actions/preview-deploy@e74173d4bdd931d036ad359cf5f7729fc6aa7067 # v1.5.1
        with:
          workspace-name-prefix: __WORKSPACE_NAME__
          region: "__REGION__"
          organization-id: ${{ vars.TAILOR_PLATFORM_ORGANIZATION_ID }}
          folder-id: ${{ vars.TAILOR_PLATFORM_FOLDER_ID }}
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: tailor-preview-comment
        if: always()
        uses: tailor-platform/actions/preview-comment@e74173d4bdd931d036ad359cf5f7729fc6aa7067 # v1.5.1
        with:
          workspace-id: ${{ steps.tailor-preview-deploy.outputs.workspace-id }}
          workspace-name: ${{ steps.tailor-preview-deploy.outputs.workspace-name }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          app-url: ${{ steps.tailor-preview-deploy.outputs.app-url }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  tailor-preview-cleanup:
    # __CLEANUP_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: __ENVIRONMENT__
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: tailor-checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: tailor-setup
        uses: tailor-platform/actions/setup@e74173d4bdd931d036ad359cf5f7729fc6aa7067 # v1.5.1
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@e74173d4bdd931d036ad359cf5f7729fc6aa7067 # v1.5.1
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-preview-cleanup
        uses: tailor-platform/actions/preview-cleanup@e74173d4bdd931d036ad359cf5f7729fc6aa7067 # v1.5.1
        with:
          workspace-name-prefix: __WORKSPACE_NAME__
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
