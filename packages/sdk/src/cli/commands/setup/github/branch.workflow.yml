# __HEADER__
name: Tailor (__WORKSPACE_NAME__)

on:
  # __PULL_REQUEST_START__
  pull_request:
    branches: [__BRANCH__]
    # __PATHS__
  # __PULL_REQUEST_END__
  push:
    branches: [__BRANCH__]
    # __PATHS__
  workflow_dispatch:
    # __DISPATCH_INPUTS_START__
    inputs:
      dry-run:
        description: Preview changes without deploying
        type: boolean
        default: false
    # __DISPATCH_INPUTS_END__

permissions:
  contents: read

jobs:
  # __PLAN_JOB_START__
  tailor-plan:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tailor-plan-__WORKSPACE_NAME__-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # __SETUP_STEPS__
      - id: tailor-generate
        # __WORKING_DIRECTORY__
        run: __PM_EXEC__ tailor-sdk generate
      - id: tailor-generate-check
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git --no-pager diff --cached --stat
            echo "::error::Generated files are out of date. Run 'tailor-sdk generate' locally and commit the result."
            exit 1
          fi
      - id: tailor-plan
        # Fork PRs cannot read secrets; the checks above still run for them.
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: tailor-platform/actions/plan@v1
        with:
          workspace-name: __WORKSPACE_NAME__
          workspace-region: __WORKSPACE_REGION__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  # __PLAN_JOB_END__
  tailor-deploy:
    # __DEPLOY_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # __ENVIRONMENT__
    concurrency:
      group: tailor-deploy-__WORKSPACE_NAME__
      cancel-in-progress: false
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # __SETUP_STEPS__
      - id: tailor-apply
        uses: tailor-platform/actions/deploy@v1
        with:
          workspace-name: __WORKSPACE_NAME__
          workspace-region: __WORKSPACE_REGION__
          organization-id: __ORGANIZATION_ID__
          # __FOLDER_ID__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
