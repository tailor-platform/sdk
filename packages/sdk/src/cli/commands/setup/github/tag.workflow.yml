# __HEADER__
name: Tailor (__WORKSPACE_NAME__)

on:
  push:
    tags: ["__TAG_PATTERN__"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview changes without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # __TAG_GUARD_JOB_START__
  tailor-tag-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      on-branch: ${{ steps.tailor-tag-guard.outputs.on-branch }}
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: tailor-tag-guard
        uses: tailor-platform/actions/tag-guard@b37a41f0f491bac6619deb5ba8ba8d4a00cdff1e # v1.3.0
        with:
          target-branch: "__BRANCH__"
  # __TAG_GUARD_JOB_END__
  tailor-plan:
    # __PLAN_NEEDS__
    # __PLAN_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: __ENVIRONMENT__
    permissions:
      contents: read
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: tailor-setup
        uses: tailor-platform/actions/setup@b37a41f0f491bac6619deb5ba8ba8d4a00cdff1e # v1.3.0
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      - id: tailor-generate-check
        uses: tailor-platform/actions/generate-check@b37a41f0f491bac6619deb5ba8ba8d4a00cdff1e # v1.3.0
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      - id: tailor-plan
        uses: tailor-platform/actions/plan@4d0f160b6b5cc2f02594776665471497c297181e # v1.2.0
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          label: __WORKSPACE_NAME__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}

  tailor-deploy:
    needs: tailor-plan
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs['dry-run']) }}
    environment: __ENVIRONMENT__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: tailor-deploy-__WORKSPACE_NAME__
      cancel-in-progress: false
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: tailor-setup
        uses: tailor-platform/actions/setup@b37a41f0f491bac6619deb5ba8ba8d4a00cdff1e # v1.3.0
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      - id: tailor-apply
        uses: tailor-platform/actions/deploy@4d0f160b6b5cc2f02594776665471497c297181e # v1.2.0
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
