# __HEADER__
name: Tailor (__WORKSPACE_NAME__)

on:
  push:
    tags: ["__TAG_PATTERN__"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview changes without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # __TAG_GUARD_JOB_START__
  tailor-tag-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      on-branch: ${{ steps.tailor-tag-guard.outputs.on-branch }}
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: tailor-tag-guard
        env:
          TARGET_BRANCH: "__BRANCH__"
        run: |
          git fetch origin "$TARGET_BRANCH"
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$TARGET_BRANCH"; then
            echo "on-branch=true" >> "$GITHUB_OUTPUT"
          else
            # A tag outside the target branch is not an error — just skip.
            echo "on-branch=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $GITHUB_REF_NAME is not reachable from $TARGET_BRANCH; skipping deploy."
          fi
  # __TAG_GUARD_JOB_END__
  tailor-plan:
    # __PLAN_NEEDS__
    # __PLAN_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: __ENVIRONMENT__
    permissions:
      contents: read
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # __SETUP_STEPS__
      - id: tailor-generate
        # __WORKING_DIRECTORY__
        run: __PM_EXEC__ tailor-sdk generate
      - id: tailor-generate-check
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git --no-pager diff --cached --stat
            echo "::error::Generated files are out of date. Run 'tailor-sdk generate' locally and commit the result."
            exit 1
          fi
      - id: tailor-plan
        uses: tailor-platform/actions/plan@v1
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          label: __WORKSPACE_NAME__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}

  tailor-deploy:
    needs: tailor-plan
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs['dry-run']) }}
    environment: __ENVIRONMENT__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: tailor-deploy-__WORKSPACE_NAME__
      cancel-in-progress: false
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # __SETUP_STEPS__
      - id: tailor-apply
        uses: tailor-platform/actions/deploy@v1
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
