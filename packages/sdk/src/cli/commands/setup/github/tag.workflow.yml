# __HEADER__
name: Tailor (__WORKSPACE_NAME__)

on:
  push:
    tags: ["__TAG_PATTERN__"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview changes without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # __TAG_GUARD_JOB_START__
  tailor-tag-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      on-branch: ${{ steps.tailor-tag-guard.outputs.on-branch }}
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: tailor-tag-guard
        env:
          TARGET_BRANCH: "__BRANCH__"
        run: |
          git fetch origin "$TARGET_BRANCH"
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$TARGET_BRANCH"; then
            echo "on-branch=true" >> "$GITHUB_OUTPUT"
          else
            # A tag outside the target branch is not an error — just skip.
            echo "on-branch=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $GITHUB_REF_NAME is not reachable from $TARGET_BRANCH; skipping deploy."
          fi
  # __TAG_GUARD_JOB_END__
  tailor-plan:
    # __PLAN_NEEDS__
    # __PLAN_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: __ENVIRONMENT__
    permissions:
      contents: read
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # __SETUP_STEPS__
      - id: tailor-generate
        # __WORKING_DIRECTORY__
        run: __PM_EXEC__ tailor-sdk generate
      - id: tailor-generate-check
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git --no-pager diff --cached --stat
            echo "::error::Generated files are out of date. Run 'tailor-sdk generate' locally and commit the result."
            exit 1
          fi
      - id: tailor-mask-credentials
        run: |
          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$CLIENT_SECRET"
        env:
          CLIENT_ID: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
      - id: tailor-login
        # __WORKING_DIRECTORY__
        run: __PM_EXEC__ tailor-sdk login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
      - id: tailor-plan
        # __WORKING_DIRECTORY__
        run: |
          if [ -z "$TAILOR_PLATFORM_WORKSPACE_ID" ]; then
            echo "exit-code=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          OUTPUT=$(__PM_EXEC__ tailor-sdk deploy --dry-run --yes 2>&1)
          EXIT_CODE=$?
          set -e

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "exit-code=$EXIT_CODE"
            echo "output<<$EOF"
            echo "$OUTPUT"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          TAILOR_PLATFORM_WORKSPACE_ID: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
      - id: tailor-plan-summary
        run: |
          if [ -n "$LABEL" ]; then
            KEY="$LABEL"
          elif [ -n "$WORKSPACE_ID" ]; then
            KEY="$WORKSPACE_ID"
          else
            KEY="workspace"
          fi

          if [ -z "$WORKSPACE_ID" ]; then
            {
              echo "## Tailor Platform Plan ($KEY)"
              echo ""
              echo "Workspace is not provisioned yet. Set TAILOR_PLATFORM_WORKSPACE_ID after provisioning the workspace."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$DRY_RUN_EXIT_CODE" = "0" ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi

          {
            echo "## $STATUS Tailor Platform Plan ($KEY)"
            echo ""
            echo "<details>"
            echo "<summary>Plan output (exit code: $DRY_RUN_EXIT_CODE)</summary>"
            echo ""
            echo '```'
            echo "$DRY_RUN_OUTPUT"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          WORKSPACE_ID: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          LABEL: __WORKSPACE_NAME__
          DRY_RUN_OUTPUT: ${{ steps.tailor-plan.outputs.output }}
          DRY_RUN_EXIT_CODE: ${{ steps.tailor-plan.outputs.exit-code }}
      - id: tailor-plan-fail
        if: vars.TAILOR_PLATFORM_WORKSPACE_ID != ''
        run: |
          if [ "$DRY_RUN_EXIT_CODE" != "0" ]; then
            echo "::error::Plan dry-run failed with exit code $DRY_RUN_EXIT_CODE"
            exit "$DRY_RUN_EXIT_CODE"
          fi
        env:
          DRY_RUN_EXIT_CODE: ${{ steps.tailor-plan.outputs.exit-code }}

  tailor-deploy:
    needs: tailor-plan
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs['dry-run']) }}
    environment: __ENVIRONMENT__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: tailor-deploy-__WORKSPACE_NAME__
      cancel-in-progress: false
    steps:
      - id: tailor-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # __SETUP_STEPS__
      - id: tailor-mask-credentials
        run: |
          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$CLIENT_SECRET"
        env:
          CLIENT_ID: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
      - id: tailor-login
        # __WORKING_DIRECTORY__
        run: __PM_EXEC__ tailor-sdk login --machine-user
        env:
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
      - id: tailor-validate-workspace
        env:
          WORKSPACE_ID: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
        run: |
          if [ -z "$WORKSPACE_ID" ]; then
            echo "::error::Workspace is not provisioned: TAILOR_PLATFORM_WORKSPACE_ID is empty. Provision the workspace and set the variable."
            exit 1
          fi
      - id: tailor-generate
        # __WORKING_DIRECTORY__
        run: __PM_EXEC__ tailor-sdk generate
        env:
          TAILOR_PLATFORM_WORKSPACE_ID: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
      - id: tailor-deploy
        # __WORKING_DIRECTORY__
        run: __PM_EXEC__ tailor-sdk deploy --yes
        env:
          TAILOR_PLATFORM_WORKSPACE_ID: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
