# __HEADER__
name: Tailor (__WORKSPACE_NAME__)

on:
  # __PULL_REQUEST_START__
  pull_request:
    branches: ["__BRANCH__"]
    # __PATHS__
  # __PULL_REQUEST_END__
  push:
    branches: ["__BRANCH__"]
    # __PATHS__
  workflow_dispatch:
    # __DISPATCH_INPUTS_START__
    inputs:
      dry-run:
        description: Preview changes without deploying
        type: boolean
        default: false
    # __DISPATCH_INPUTS_END__

permissions:
  contents: read

jobs:
  # __PLAN_JOB_START__
  tailor-plan:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs['dry-run'])
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: __ENVIRONMENT__
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tailor-plan-__WORKSPACE_NAME__-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - id: tailor-checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: tailor-setup
        uses: tailor-platform/actions/setup@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-generate-check
        uses: tailor-platform/actions/generate-check@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      # __SEED_VALIDATE_START__
      - id: tailor-seed-validate
        uses: tailor-platform/actions/seed-validate@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      # __SEED_VALIDATE_END__
      - id: tailor-drift-check
        uses: tailor-platform/actions/drift-check@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      # __MIGRATION_DRIFT_CHECK_START__
      - id: tailor-migration-drift-check
        uses: tailor-platform/actions/migration-drift-check@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      # __MIGRATION_DRIFT_CHECK_END__
      - id: tailor-plan
        # Fork PRs cannot read secrets; the checks above still run for them.
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: tailor-platform/actions/plan@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          package-manager: __PACKAGE_MANAGER__
          label: __WORKSPACE_NAME__
          # __WORKING_DIRECTORY__
          # PAT fallback: if a Proxy-Free Machine User (PFMU) is not available,
          # comment out the two lines below and uncomment platform-token instead.
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          # platform-token: ${{ secrets.TAILOR_PLATFORM_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  # __PLAN_JOB_END__
  tailor-deploy:
    # __DEPLOY_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: __ENVIRONMENT__
    concurrency:
      group: tailor-deploy-__WORKSPACE_NAME__
      cancel-in-progress: false
    steps:
      - id: tailor-checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: tailor-setup
        uses: tailor-platform/actions/setup@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-apply
        uses: tailor-platform/actions/deploy@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
          # PAT fallback: if a Proxy-Free Machine User (PFMU) is not available,
          # comment out the two lines below and uncomment platform-token instead.
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
          # platform-token: ${{ secrets.TAILOR_PLATFORM_TOKEN }}
      # __SEED_DATA_START__
      - id: seed-data
        if: false
        shell: bash
        # __WORKING_DIRECTORY__
        run: |
          # Uncomment and implement to seed data on deploy.
          # Run after apply so the schema is ready.
          # Example: node scripts/seed.mjs
          true
      # __SEED_DATA_END__
      - id: tailor-notify
        if: always()
        uses: tailor-platform/actions/notify@a51a94d08b867e576d850d9dd71e6d87f4e0cea0 # feat/setup
        with:
          provider: slack
          status: ${{ job.status }}
          workspace-name: __WORKSPACE_NAME__
          slack-token: ${{ secrets.TAILOR_SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.TAILOR_SLACK_CHANNEL_ID }}
          # user-mapping: ${{ vars.TAILOR_SLACK_USER_MAPPING }}
