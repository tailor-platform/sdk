# __HEADER__
name: Tailor (__WORKSPACE_NAME__)

on:
  push:
    tags: ["__TAG_PATTERN__"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview changes without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # __TAG_GUARD_JOB_START__
  tailor-tag-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      on-branch: ${{ steps.tailor-tag-guard.outputs.on-branch }}
    steps:
      - id: tailor-checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: tailor-tag-guard
        uses: tailor-platform/actions/tag-guard@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          target-branch: "__BRANCH__"
  # __TAG_GUARD_JOB_END__
  tailor-plan:
    # __PLAN_NEEDS__
    # __PLAN_IF__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: __ENVIRONMENT__
    permissions:
      contents: read
    steps:
      - id: tailor-checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: tailor-setup
        uses: tailor-platform/actions/setup@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-generate-check
        uses: tailor-platform/actions/generate-check@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      # __SEED_VALIDATE_START__
      - id: tailor-seed-validate
        uses: tailor-platform/actions/seed-validate@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      # __SEED_VALIDATE_END__
      - id: tailor-drift-check
        uses: tailor-platform/actions/drift-check@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      # __MIGRATION_DRIFT_CHECK_START__
      - id: tailor-migration-drift-check
        uses: tailor-platform/actions/migration-drift-check@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
      # __MIGRATION_DRIFT_CHECK_END__
      - id: tailor-plan
        uses: tailor-platform/actions/plan@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          package-manager: __PACKAGE_MANAGER__
          label: __WORKSPACE_NAME__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}

  tailor-deploy:
    needs: tailor-plan
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs['dry-run']) }}
    environment: __ENVIRONMENT__
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: tailor-deploy-__WORKSPACE_NAME__
      cancel-in-progress: false
    steps:
      - id: tailor-checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: tailor-setup
        uses: tailor-platform/actions/setup@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-install
        uses: tailor-platform/actions/install@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          package-manager: __PACKAGE_MANAGER__
      - id: tailor-apply
        uses: tailor-platform/actions/deploy@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          workspace-id: ${{ vars.TAILOR_PLATFORM_WORKSPACE_ID }}
          package-manager: __PACKAGE_MANAGER__
          # __WORKING_DIRECTORY__
          platform-client-id: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_ID }}
          platform-client-secret: ${{ secrets.TAILOR_PLATFORM_MACHINE_USER_CLIENT_SECRET }}
      # __SEED_DATA_START__
      - id: seed-data
        if: false
        shell: bash
        # __WORKING_DIRECTORY__
        run: |
          # Uncomment and implement to seed data on deploy.
          # Run after apply so the schema is ready.
          # Example: node scripts/seed.mjs
          true
      # __SEED_DATA_END__
      - id: tailor-notify
        if: always()
        uses: tailor-platform/actions/notify@201d54f0f13f3ebdb64e5202a975c57618fc3213 # feat/setup
        with:
          provider: slack
          status: ${{ job.status }}
          workspace-name: __WORKSPACE_NAME__
          slack-token: ${{ secrets.TAILOR_SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ vars.TAILOR_SLACK_CHANNEL_ID }}
          # user-mapping: ${{ vars.TAILOR_SLACK_USER_MAPPING }}
