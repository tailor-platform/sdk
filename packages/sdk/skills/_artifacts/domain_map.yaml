        priority: "HIGH"
        status: "active"

      - mistake: "confuse definition-time and generation-time hooks"
        mechanism: "onTypeLoaded/onNamespaceLoaded run during definition; onTailorDBReady/onResolverReady/onExecutorReady run during generation"
