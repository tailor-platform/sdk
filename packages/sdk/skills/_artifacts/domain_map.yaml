  - name: "Testing patterns"
    slug: "testing"
    domain: "quality"
    description: "Unit test, integration test, and E2E test patterns for resolvers, executors, and workflows — mocking, dependency injection, and global setup"
    type: "core"
    covers:
      - "resolver unit tests with TailorDB mock"
      - "dependency injection pattern for testable logic"
      - "workflow job unit tests with trigger mocking"
      - "WORKFLOW_TEST_ENV_KEY for env stubbing"
      - "bundled execution integration tests"
      - "E2E setup with globalSetup and machine user tokens"
      - "unauthenticatedTailorUser constant"
      - "setupTailordbMock and setupWorkflowMock helpers"
    tasks:
      - "write unit tests for a resolver"
      - "test workflow jobs in isolation"
      - "set up E2E tests against a deployed app"
      - "mock database access for resolver tests"
    failure_modes:
      - mistake: "mockResolvedValueOnce order does not match transaction sequence"
        mechanism: "Kysely issues BEGIN, SELECT, UPDATE, COMMIT — mocks must match this exact order"
        wrong_pattern: |
          mockQueryObject.mockResolvedValueOnce({ rows: [{ age: 30 }] });
          mockQueryObject.mockResolvedValueOnce({});
        correct_pattern: |
          mockQueryObject.mockResolvedValueOnce({}); // BEGIN
          mockQueryObject.mockResolvedValueOnce({ rows: [{ age: 30 }] }); // SELECT
          mockQueryObject.mockResolvedValueOnce({}); // UPDATE
          mockQueryObject.mockResolvedValueOnce({}); // COMMIT
        source: "docs/testing.md"
        priority: "HIGH"
        status: "active"

      - mistake: "forget to stub WORKFLOW_TEST_ENV_KEY for workflow tests"
        mechanism: "Workflow jobs access env via special env key — tests fail without stubbing it"
        wrong_pattern: |
          const result = await myJob.body(input, {});
        correct_pattern: |
          vi.stubEnv(WORKFLOW_TEST_ENV_KEY, JSON.stringify({ API_KEY: "test" }));
          const result = await myJob.body(input, {});
        source: "docs/testing.md"
        priority: "HIGH"
        status: "active"

      - mistake: "machine user token setup outside globalSetup"
        mechanism: "E2E tests need token from globalSetup — creating per-test causes auth race conditions"
        source: "example/e2e/globalSetup.ts"
        priority: "MEDIUM"
        status: "active"

tensions:
  - name: "deny-by-default security vs development speed"
    skills: ["services/tailordb", "services/auth"]
    description: "Permission system blocks everything by default — prototyping requires unsafe helpers that must not reach production"
    implication: "Agent uses unsafeAllowAll* for speed, then forgets to replace with real permissions before deploy"

  - name: "type-safety strictness vs rapid prototyping"
    skills: ["services/workflow", "services/resolver"]
    description: "JSON serialization constraints reject Date/Map/Set in workflow inputs — strict for correctness but surprising for rapid iteration"
    implication: "Agent passes rich types between jobs that silently serialize to strings"

  - name: "auto-detection convenience vs explicit control"
    skills: ["services/tailordb", "services/executor"]
    description: "publishEvents is auto-detected from executor triggers — manual setting can conflict or be redundant"
    implication: "Agent explicitly sets publishEvents: true when auto-detection already handles it, or sets false and breaks executor triggers"

