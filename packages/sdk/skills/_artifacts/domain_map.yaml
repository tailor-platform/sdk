skills:
  - name: "TailorDB schema definition"
    slug: "services/tailordb"
    domain: "data-modeling"
    description: "Define and modify database types using db.type() — fields, relations, hooks, validation, permissions, indexes, and features"
    type: "core"
    covers:
      - "db.type()"
      - "field types (string, int, float, bool, date, datetime, time, uuid, enum, object)"
      - "field modifiers (optional, array, index, unique, description)"
      - "relations (n-1, 1-1, keyOnly, toward, backward)"
      - "field-level and type-level hooks"
      - "field-level and type-level validation"
      - "composite indexes"
      - "file fields"
      - "features (aggregation, bulkUpsert, publishEvents)"
      - "serial/auto-increment fields"
      - "vector search"
      - "permission and gqlPermission"
      - "db.fields.timestamps()"
    tasks:
      - "create a new database type with fields"
      - "add a relation between two types"
      - "set up hooks for computed fields"
      - "configure permissions for a type"
      - "add validation rules to fields"
    failure_modes:
      - mistake: "mix field-level and type-level hooks on same field"
        mechanism: "TypeScript produces never type — compile error that may be unclear"
        wrong_pattern: |
          db.type("User", {
            name: db.string().hooks({ create: () => "x" }),
          }).hooks({ name: { create: () => "y" } });
        correct_pattern: |
          db.type("User", {
            name: db.string(),
          }).hooks({ name: { create: () => "y" } });
        source: "docs/services/tailordb.md, source schema.ts"
        priority: "CRITICAL"
        status: "active"

      - mistake: "mix field-level and type-level validation on same field"
        mechanism: "Same never-type constraint as hooks — cannot coexist on same field"
        wrong_pattern: |
          db.type("User", {
            name: db.string().validate(({ value }) => value.length > 0),
          }).validate({ name: [({ value }) => value.length < 100, "Too long"] });
        correct_pattern: |
          db.type("User", {
            name: db.string(),
          }).validate({
            name: [
              ({ value }) => value.length > 0,
              [({ value }) => value.length < 100, "Too long"],
            ],
          });
        source: "docs/services/tailordb.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "omit permission and gqlPermission — all operations silently blocked"
        mechanism: "Deny-by-default — types without explicit permissions block all CRUD operations"
        wrong_pattern: |
          export const user = db.type("User", {
            name: db.string(),
          });
        correct_pattern: |
          export const user = db.type("User", {
            name: db.string(),
          })
            .permission(defaultPermission)
            .gqlPermission(defaultGqlPermission);
        source: "docs/services/tailordb.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "manually define id field in db.type()"
        mechanism: "db.type() auto-adds id: UUID — passing id in fields hits never constraint"
        wrong_pattern: |
          db.type("User", {
            id: db.uuid(),
            name: db.string(),
          });
        correct_pattern: |
          db.type("User", {
            name: db.string(),
          });
          // id is automatically added
        source: "source schema.ts line 1173"
        priority: "HIGH"
        status: "active"

      - mistake: "call .index() or .unique() on array field"
        mechanism: "Array fields cannot be indexed — compile-time never type"
        wrong_pattern: |
          db.string({ array: true }).index();
        correct_pattern: |
          db.string({ array: true });
          // Use composite indexes if needed
        source: "source schema.ts line 160"
        priority: "HIGH"
        status: "active"

      - mistake: "add hooks to object/nested field"
        mechanism: "Nested fields do not support hooks — compile-time never"
        wrong_pattern: |
          db.object({ street: db.string() }).hooks({ create: () => ({}) });
        correct_pattern: |
          // Use type-level hooks for computed nested values
          db.type("Address", {
            input: db.object({ street: db.string() }),
            formatted: db.string(),
          }).hooks({
            formatted: { create: ({ data }) => data.input.street },
          });
        source: "source schema.ts line 196"
        priority: "HIGH"
        status: "active"

      - mistake: "manually set publishEvents when executor auto-detects it"
        mechanism: "SDK auto-enables publishEvents when executor uses record triggers — manual setting can conflict"
        source: "docs/services/tailordb.md"
        priority: "MEDIUM"
        status: "active"

      - mistake: "use unsafeAllowAll*Permission in production"
        mechanism: "Disables all authorization checks — dev/test only helpers"
        source: "docs/services/tailordb.md"
        priority: "CRITICAL"
        status: "active"

  - name: "Resolver creation"
    slug: "services/resolver"
    domain: "business-logic"
    description: "Create custom GraphQL query/mutation endpoints with typed input/output schemas, Kysely database access, and validation"
    type: "core"
    covers:
      - "createResolver()"
      - "input/output schema with t.* field types"
      - "input validation"
      - "getDB() and Kysely query builder"
      - "context (input, env, user)"
      - "pickFields/omitFields for type reuse"
      - "publishEvents for resolver execution"
    tasks:
      - "create a query resolver"
      - "create a mutation resolver with DB access"
      - "add input validation to a resolver"
      - "reuse TailorDB field definitions in resolver schema"
      - "trigger a workflow from a resolver"
    failure_modes:
      - mistake: "define multiple resolvers in one file"
        mechanism: "Strict 1 resolver per file rule — bundler expects single default export"
        wrong_pattern: |
          export default createResolver({ name: "a", ... });
          export const other = createResolver({ name: "b", ... });
        correct_pattern: |
          // resolvers/a.ts
          export default createResolver({ name: "a", ... });
          // resolvers/b.ts (separate file)
          export default createResolver({ name: "b", ... });
        source: "docs/services/resolver.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "use TailorDB-specific options in resolver schema"
        mechanism: "Resolver schemas use t.* types — index, relation, hooks are TailorDB-only"
        wrong_pattern: |
          createResolver({
            input: { userId: t.uuid().index() },
            ...
          });
        correct_pattern: |
          createResolver({
            input: { userId: t.uuid() },
            ...
          });
        source: "docs/services/resolver.md"
        priority: "HIGH"
        status: "active"

      - mistake: "wrong getDB namespace name"
        mechanism: "getDB() takes the namespace string from tailor.config.ts — typo causes runtime error"
        wrong_pattern: |
          const db = await getDB("tailorDB");
        correct_pattern: |
          const db = await getDB("tailordb");
        source: "runtime behavior"
        priority: "HIGH"
        status: "active"

      - mistake: "forget to export as default"
        mechanism: "Resolver must be the default export — named export will not be discovered"
        wrong_pattern: |
          export const myResolver = createResolver({ ... });
        correct_pattern: |
          export default createResolver({ ... });
        source: "docs/services/resolver.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "forget async/await when using getDB"
        mechanism: "getDB returns a Promise — forgetting await leads to operating on Promise object"
        wrong_pattern: |
          body: (context) => {
            const db = getDB("tailordb");
            return db.selectFrom("User").execute();
          }
        correct_pattern: |
          body: async (context) => {
            const db = await getDB("tailordb");
            return await db.selectFrom("User").execute();
          }
        source: "common pattern from examples"
        priority: "MEDIUM"
        status: "active"

  - name: "Executor creation"
    slug: "services/executor"
    domain: "event-processing"
    description: "Create event-driven handlers with triggers (record CRUD, schedule, webhook, resolver execution) and operations (function, GraphQL, webhook, workflow)"
    type: "core"
    covers:
      - "createExecutor()"
      - "recordCreatedTrigger / recordUpdatedTrigger / recordDeletedTrigger"
      - "scheduleTrigger (CRON)"
      - "incomingWebhookTrigger"
      - "resolverExecutedTrigger"
      - "idpUser and authAccessToken triggers"
      - "operation kinds: function, graphql, webhook, workflow"
      - "condition filtering"
      - "authInvoker for machine user context"
      - "secret reference syntax (vault/key)"
    tasks:
      - "create an executor triggered by record creation"
      - "set up a scheduled CRON job"
      - "handle incoming webhooks"
      - "react to resolver execution"
      - "call external webhooks with secrets"
    failure_modes:
      - mistake: "executor name not globally unique"
        mechanism: "Executor names must be unique across entire project — duplicate causes deployment error"
        source: "docs/services/executor.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "use record trigger but type has publishEvents: false"
        mechanism: "Record triggers require event publishing — explicitly disabling it causes apply error"
        wrong_pattern: |
          db.type("Order", { ... }).features({ publishEvents: false });
          // executor file:
          createExecutor({ trigger: recordCreatedTrigger({ type: order }), ... });
        correct_pattern: |
          db.type("Order", { ... });
          // Let auto-detection enable publishEvents
          createExecutor({ trigger: recordCreatedTrigger({ type: order }), ... });
        source: "docs/services/executor.md"
        priority: "HIGH"
        status: "active"

      - mistake: "wrong secret reference syntax in webhook headers"
        mechanism: 'Must use { vault: "name", key: "secret" } object — string value will be sent as-is'
        wrong_pattern: |
          headers: { Authorization: "vault:my-vault/my-secret" }
        correct_pattern: |
          headers: { Authorization: { vault: "my-vault", key: "my-secret" } }
        source: "docs/services/executor.md"
        priority: "HIGH"
        status: "active"

      - mistake: "not narrowing success/error in resolverExecutedTrigger"
        mechanism: "Args is a discriminated union on success boolean — accessing result without narrowing is unsafe"
        wrong_pattern: |
          condition: ({ result }) => result.output.id !== ""
        correct_pattern: |
          condition: (args) => args.success && args.result.output.id !== ""
        source: "source executor/trigger/event.ts"
        priority: "MEDIUM"
        status: "active"

      - mistake: "invalid CRON expression in scheduleTrigger"
        mechanism: "CRON string is validated at compile time — invalid expression produces never type"
        source: "source executor/trigger/schedule.ts"
        priority: "MEDIUM"
        status: "active"

  - name: "Workflow creation"
    slug: "services/workflow"
    domain: "orchestration"
    description: "Orchestrate multi-step durable jobs with createWorkflow/createWorkflowJob — explicit dependencies, trigger patterns, and JSON serialization constraints"
    type: "core"
    covers:
      - "createWorkflow()"
      - "createWorkflowJob()"
      - ".trigger() for inter-job calls"
      - "export conventions (default + named)"
      - "JSON serialization constraints"
      - "environment variable access"
      - "authInvoker for machine user context"
    tasks:
      - "create a workflow with multiple jobs"
      - "chain jobs with trigger()"
      - "pass data between jobs"
      - "trigger a workflow from a resolver or executor"
    failure_modes:
      - mistake: "workflow not default exported"
        mechanism: "createWorkflow() result must be default export — named export is silently ignored"
        wrong_pattern: |
          export const myWorkflow = createWorkflow({
            name: "my-workflow",
            mainJob: validateOrder,
          });
        correct_pattern: |
          export default createWorkflow({
            name: "my-workflow",
            mainJob: validateOrder,
          });
        source: "docs/services/workflow.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "job not named exported"
        mechanism: "All jobs must be named exports — non-exported jobs are not discovered by bundler"
        wrong_pattern: |
          const validateOrder = createWorkflowJob({ ... });
          export default createWorkflow({ mainJob: validateOrder });
        correct_pattern: |
          export const validateOrder = createWorkflowJob({ ... });
          export default createWorkflow({ mainJob: validateOrder });
        source: "docs/services/workflow.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "job name not globally unique"
        mechanism: "Job names must be unique across entire project — not just per workflow file"
        source: "docs/services/workflow.md"
        priority: "CRITICAL"
        status: "active"

      - mistake: "use Promise.all() for parallel job execution"
        mechanism: "Server executes jobs synchronously — Promise.all does NOT run jobs in parallel"
        wrong_pattern: |
          const [a, b] = await Promise.all([
            jobA.trigger(input),
            jobB.trigger(input),
          ]);
        correct_pattern: |
          const a = await jobA.trigger(input);
          const b = await jobB.trigger(input);
        source: "docs/services/workflow.md"
        priority: "HIGH"
        status: "active"

      - mistake: "pass Date, Map, or Set as job input"
        mechanism: "Job input must be JSON-compatible — non-serializable types cause compile-time never"
        wrong_pattern: |
          createWorkflowJob({
            name: "process",
            body: (input: { date: Date }) => ({ ... }),
          });
        correct_pattern: |
          createWorkflowJob({
            name: "process",
            body: (input: { date: string }) => ({ ... }),
          });
        source: "source workflow/job.ts, docs/services/workflow.md"
        priority: "HIGH"
        status: "active"

      - mistake: "expect Date objects in trigger() return value"
        mechanism: "trigger() returns Jsonify<Output> — Date objects become ISO strings after serialization"
        source: "source workflow/job.ts line 192"
        priority: "MEDIUM"
        status: "active"

