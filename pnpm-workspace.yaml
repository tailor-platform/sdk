nodeLinker: hoisted
autoInstallPeers: true

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@tailor-platform/*"
  - "@toiroakr/lines-db"
  - politty
  - zinfer

blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Pre-existing version pulled in transitively via @liam-hq/cli.
  # Earlier @swc/core versions had provenance attestation; this one does not.
  - "@swc/core@1.12.11"

packages:
  - packages/*
  - packages/create-sdk/templates/*
  - example
  - llm-challenge

allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true
  multiline-ts: true
  oxc-resolver: true
  # transitive deps whose postinstall is not needed for our workspace
  "@prisma/engines": false
  protobufjs: false
  unrs-resolver: false
