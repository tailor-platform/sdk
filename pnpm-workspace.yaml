nodeLinker: hoisted
saveExact: true

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@tailor-platform/*"
  - "@toiroakr/lines-db"
  - politty
  - zinfer

blockExoticSubdeps: true
trustPolicy: no-downgrade

packages:
  - packages/*
  - packages/create-sdk/templates/*
  - example
  - llm-challenge

allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true
  # Postinstall scripts not needed for our workspace:
  # - multiline-ts: only has `preinstall: npx only-allow pnpm` (pnpm guard for
  #   its own dev, not us).
  # - oxc-resolver / unrs-resolver / @prisma/engines / protobufjs: napi-style
  #   binary packages whose top-level install hook is unused — runtime loads
  #   the per-platform `@<scope>/binding-*` sub-package directly.
  multiline-ts: false
  oxc-resolver: false
  "@prisma/engines": false
  protobufjs: false
  unrs-resolver: false
