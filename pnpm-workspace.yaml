minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@toiroakr/lines-db"
  - politty
  - zinfer
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  # Renovate security update: kysely@0.28.14
  - kysely@0.28.14

packages:
  - packages/*
  - packages/create-sdk/templates/*
  - example
  - llm-challenge

allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true
  multiline-ts: true
  oxc-resolver: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
