nodeLinker: isolated
enableGlobalVirtualStore: true
saveExact: true

lockfile:
  format: v13

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@tailor-platform/*"
  - "@enlumine/*"

blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Pre-existing transitive version without provenance attestation.
  - "@swc/core@1.12.11"
  # npm name transferred to oxc-project/tsrs; this release has its provenance.
  - "tsrs@0.25.0-ts7.1.0-beta"

packages:
  - packages/*
  - packages/create-sdk/templates/*
  - example
  - llm-challenge

allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true
  # Postinstall scripts not needed for our workspace:
  # - multiline-ts: only has `preinstall: npx only-allow pnpm` (pnpm guard for
  #   its own dev, not us).
  # - oxc-resolver / unrs-resolver / @prisma/engines / protobufjs: napi-style
  #   binary packages whose top-level install hook is unused — runtime loads
  #   the per-platform `@<scope>/binding-*` sub-package directly.
  multiline-ts: false
  oxc-resolver: false
  "@prisma/engines": false
  protobufjs: false
  unrs-resolver: false

overrides:
  # Remove once zinfer drops its typescript peer: lockfile.format v13 cannot write a peer that is also aliased as typescript-native.
  zinfer@0.5.4>typescript: "-"
  brace-expansion@>=5.0.5 <5.0.8: 5.0.13
  esbuild@>=0.17.0 <0.28.1: 0.28.2
  glob@>=9.0.0 <=14.0.1: 14.0.6
  minimatch@<11.0.1: 11.0.9

packageExtensions:
  # make-synchronized (via @ark/attest) imports prettier without declaring it.
  make-synchronized@*:
    dependencies:
      prettier: 3.6.2

peerDependencyRules:
  allowedVersions:
    # madge@8 still declares typescript ^5.4.4, but its parser
    # (detective-typescript) supports typescript 6 and madge runs fine on it.
    madge>typescript: "6"
