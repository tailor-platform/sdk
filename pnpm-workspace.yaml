nodeLinker: hoisted
saveExact: true

overrides:
  politty: https://pkg.pr.new/politty@353

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@tailor-platform/*"
  - "@toiroakr/lines-db"
  - politty
  - zinfer

blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Pre-existing version pulled in transitively via @liam-hq/cli.
  # Earlier @swc/core versions had provenance attestation; this one does not.
  - "@swc/core@1.12.11"

packages:
  - packages/*
  - packages/create-sdk/templates/*
  - example
  - llm-challenge

allowBuilds:
  "@swc/core": true
  esbuild: true
  lefthook: true
  # Postinstall scripts not needed for our workspace:
  # - multiline-ts: only has `preinstall: npx only-allow pnpm` (pnpm guard for
  #   its own dev, not us).
  # - oxc-resolver / unrs-resolver / @prisma/engines / protobufjs: napi-style
  #   binary packages whose top-level install hook is unused — runtime loads
  #   the per-platform `@<scope>/binding-*` sub-package directly.
  multiline-ts: false
  oxc-resolver: false
  "@prisma/engines": false
  protobufjs: false
  unrs-resolver: false
